[package]
name = "rift-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent indexing and retrieval for Rift"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
ignore.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
rift-analysis = { workspace = true, features = ["collector", "archive", "parallel"] }
rift-core.workspace = true
rift-history.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
rift-protocol.workspace = true
rift-provider.workspace = true
rift-ranking.workspace = true
rift-syntax.workspace = true
toasty.workspace = true
toasty-core.workspace = true
toasty-driver-sqlite.workspace = true
rayon.workspace = true
tracing.workspace = true
same-file.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
regex-syntax.workspace = true
rusqlite.workspace = true
rift-history = { workspace = true, features = ["fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
