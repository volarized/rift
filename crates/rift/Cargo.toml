[package]
name = "rift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent filesystem projections and validated source transactions for agents"
# `engine_fixture.rs`, `harness.rs`, `live_engine_gate.rs`, and `rust_engine.rs` are
# shared helper files compiled separately into every test binary that declares them;
# Cargo's own discovery would compile each as a test binary of its own. The suites are
# listed below instead, and a helper is reached with `mod <name>;` from each suite that
# uses it.
autotests = false

[features]
# Off by default so a release artifact carries no OpenTelemetry export stack. With it
# compiled in, `initialize_tracing` still installs no exporter until an operator sets
# `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[lints]
workspace = true

[dependencies]
clap.workspace = true
fs4.workspace = true
indicatif.workspace = true
jiff.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
reqwest.workspace = true
rmcp.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rift-core.workspace = true
rift-index.workspace = true
rift-mcp.workspace = true
rift-protocol.workspace = true
rift-search.workspace = true
rift-provider.workspace = true
rift-server.workspace = true
rift-syntax.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
waitpid-any.workspace = true

[target.'cfg(unix)'.dependencies]
flate2.workspace = true
nix.workspace = true
tar.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
zip.workspace = true

[dev-dependencies]
axum.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
unicode-width.workspace = true

[[test]]
name = "corpus_bun"
path = "tests/corpus_bun.rs"

[[test]]
name = "corpus_nextjs"
path = "tests/corpus_nextjs.rs"

[[test]]
name = "corpus_fastapi"
path = "tests/corpus_fastapi.rs"

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"

[[test]]
name = "feedback_manifest"
path = "tests/feedback_manifest.rs"

[[test]]
name = "install_cli"
path = "tests/install_cli.rs"

[[test]]
name = "logs_resource"
path = "tests/logs_resource.rs"

[[test]]
name = "mcp_proxy"
path = "tests/mcp_proxy.rs"

[[test]]
name = "server_cli"
path = "tests/server_cli.rs"

[[test]]
name = "steer_cli"
path = "tests/steer_cli.rs"

[[test]]
name = "update_cli"
path = "tests/update_cli.rs"
