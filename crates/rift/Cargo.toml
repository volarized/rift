[package]
name = "rift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Persistent filesystem projections and validated source transactions for agents"

[lints]
workspace = true

[dependencies]
clap.workspace = true
fs4.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rift-core.workspace = true
rift-index.workspace = true
rift-mcp.workspace = true
rift-model.workspace = true
rift-protocol.workspace = true
rift-provider.workspace = true
rift-server.workspace = true
rift-syntax.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
flate2.workspace = true
tar.workspace = true

[target.'cfg(windows)'.dependencies]
zip.workspace = true

[dev-dependencies]
axum.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
