[package]
name = "rift-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Model Context Protocol transport for Rift"
# Every suite's helper file sits beside it in `tests/`, where Cargo's own
# discovery would compile each helper as a test binary of its own. The
# suites are listed below instead, and a helper is reached with
# `mod <name>;` from each suite that uses it.
autotests = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
jiff.workspace = true
notify.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rift-core.workspace = true
rift-error.workspace = true
rift-analysis.workspace = true
rift-cloud-client.workspace = true
rift-dependency.workspace = true
rift-history.workspace = true
rift-history-store.workspace = true
rift-index.workspace = true
rift-protocol.workspace = true
rift-ranking.workspace = true
rift-search.workspace = true
rift-server.workspace = true
rayon.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "net"] }
tokio-util.workspace = true
tower-service = "0.3.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-spawn.workspace = true

[dev-dependencies]
rift-history = { workspace = true, features = ["fixtures"] }
jsonschema.workspace = true
rusqlite.workspace = true
strum.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "body_matches"
path = "tests/body_matches.rs"

[[test]]
name = "configuration_admission"
path = "tests/configuration_admission.rs"

[[test]]
name = "documentation_selection"
path = "tests/documentation_selection.rs"

[[test]]
name = "error_contract"
path = "tests/error_contract.rs"

[[test]]
name = "global_routing"
path = "tests/global_routing.rs"

[[test]]
name = "http_serve"
path = "tests/http_serve.rs"

[[test]]
name = "index_bounds"
path = "tests/index_bounds.rs"

[[test]]
name = "live_vector_search"
path = "tests/live_vector_search.rs"

[[test]]
name = "map_resource"
path = "tests/map_resource.rs"

[[test]]
name = "history_store"
path = "tests/history_store.rs"

[[test]]
name = "search_change"
path = "tests/search_change.rs"

[[test]]
name = "search_traversal"
path = "tests/search_traversal.rs"

[[test]]
name = "source_exclusion"
path = "tests/source_exclusion.rs"

[[test]]
name = "surface_validation"
path = "tests/surface_validation.rs"

[[test]]
name = "workspace_resource"
path = "tests/workspace_resource.rs"

[[test]]
name = "embedded_python"
path = "tests/embedded_python.rs"
