[package]
name = "rift-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Model Context Protocol transport for Rift"
# Every suite's helper file sits beside it in `tests/`, where Cargo's own
# discovery would compile each helper as a test binary of its own. The
# suites are listed below instead, and a helper is reached with
# `mod <name>;` from each suite that uses it.
autotests = false

[lints]
workspace = true

[dependencies]
axum.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
notify.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rift-core.workspace = true
rift-index.workspace = true
rift-protocol.workspace = true
rift-search.workspace = true
rift-server.workspace = true
schemars.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
rift-history = { workspace = true, features = ["fixtures"] }
jsonschema.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "configuration_admission"
path = "tests/configuration_admission.rs"

[[test]]
name = "error_contract"
path = "tests/error_contract.rs"

[[test]]
name = "http_serve"
path = "tests/http_serve.rs"

[[test]]
name = "live_rust_analyzer"
path = "tests/live_rust_analyzer.rs"

[[test]]
name = "live_semantic_search"
path = "tests/live_semantic_search.rs"

[[test]]
name = "live_toml"
path = "tests/live_toml.rs"

[[test]]
name = "live_typescript"
path = "tests/live_typescript.rs"

[[test]]
name = "move_file"
path = "tests/move_file.rs"

[[test]]
name = "remove_symbol"
path = "tests/remove_symbol.rs"

[[test]]
name = "rename_symbol"
path = "tests/rename_symbol.rs"

[[test]]
name = "schema_export"
path = "tests/schema_export.rs"

[[test]]
name = "source_exclusion"
path = "tests/source_exclusion.rs"

[[test]]
name = "surface_validation"
path = "tests/surface_validation.rs"
