[package]
name = "rift-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Domain vocabulary and correctness primitives for Rift"

[dependencies]
sha2.workspace = true
percent-encoding.workspace = true
rift-protocol.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
strum.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true

# Every capture digests each workspace file's bytes (`src/digest.rs`), and sha2 0.10 reaches
# the ARMv8 SHA-256 instructions only through its `asm` feature; without it an aarch64 build
# hashes in portable code at about a quarter of the speed. Windows keeps the portable code:
# `sha2-asm` ships GNU assembler sources alone, and `cc` hands a `.S` source to the MSVC
# compiler there.
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
