[package]
name = "rift-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Workspace application service for Rift"
# A suite's helper file sits beside it in `tests/`, where Cargo's own
# discovery would compile the helper as a test binary of its own. Every
# suite is listed below instead, and a helper is reached with
# `mod <name>;` from each suite that uses it. A suite added to `tests/`
# without a `[[test]]` entry here compiles into nothing and stops
# running, so the architecture gate refuses one.
autotests = false

[lints]
workspace = true

[dependencies]
diffy.workspace = true
lsp-types.workspace = true
percent-encoding.workspace = true
rift-core.workspace = true
rift-history.workspace = true
rift-index.workspace = true
rift-lsp.workspace = true
rift-protocol.workspace = true
rift-provider.workspace = true
rift-search.workspace = true
rift-syntax.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

ty_project.workspace = true
ty_ide.workspace = true
ruff_db.workspace = true
ruff_text_size.workspace = true
ty_python_core.workspace = true

[dev-dependencies]
rift-history = { workspace = true, features = ["fixtures"] }
schemars.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "engine_pool"
path = "tests/engine_pool.rs"
