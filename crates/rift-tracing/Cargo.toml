[package]
name = "rift-tracing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The metrics database and the instrumentation Rift crates emit through"

[features]
# The scoped recorder for dependent crates' tests; never a production feature. Enable it
# from `[dev-dependencies]` only, so a release build carries no recorder.
fixtures = []
# Off by default so a release artifact carries no OpenTelemetry export stack. With it
# compiled in, `TracingRuntimeBuilder::install` still installs no exporter until an operator
# sets `OTEL_EXPORTER_OTLP_ENDPOINT`.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[lints]
workspace = true

[dependencies]
jiff.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
pin-project-lite.workspace = true
rift-error.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
