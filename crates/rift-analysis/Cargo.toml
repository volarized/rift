[package]
name = "rift-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Storage-independent source and semantic analysis for Rift"

[lints]
workspace = true

[features]
default = ["collector"]
collector = ["dep:rift-provider", "dep:rift-syntax", "dep:strum", "dep:tree-sitter", "dep:tree-sitter-json", "dep:tree-sitter-rst"]
archive = ["dep:flate2", "dep:tar", "dep:zip"]
parallel = ["dep:rayon"]

[dependencies]
rift-core.workspace = true
rift-protocol.workspace = true
rift-provider = { workspace = true, optional = true }
rift-ranking.workspace = true
rift-syntax = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
url.workspace = true
percent-encoding.workspace = true
rayon = { workspace = true, optional = true }
tree-sitter-rst = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
