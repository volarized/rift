[project]
name = "rift-dev"
version = "0.0.0"
description = "Rift development commands and test support"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "mcp==1.26.0",
    "psutil==7.2.2",
    "pywin32==312; sys_platform == 'win32'",
    "typer==0.27.2",
    "pydantic==2.13.5",
]

[project.scripts]
rift-dev = "rift_dev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rift_dev"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "PyYAML==6.0.3",
    "ruff==0.16.7",
    "ty==0.0.81",
    "types-pywin32==312.0.0.20260827",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
