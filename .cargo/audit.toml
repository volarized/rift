# zip 8.6.0 remains affected by these extraction advisories. The pinned consumers
# do not call ZipArchive::extract or ZipStreamReader::extract. Rift reads archive
# entries into memory and validates Windows update members before writing them.
# candle-core 0.11.0 reads tensor entries with by_index/by_name. Ruff's ruff_db and
# ty_vendored 0.0.8 at 2b0d21094e2a55491bff60c07fd6f8803876cae5 read an in-memory
# archive or write the bundled typeshed archive; they do not extract archive paths
# or permissions to the filesystem.
#
# candle-core requires zip ^8.6.0 and the pinned Ruff crates require ^8.0, so a
# workspace dependency update cannot remove zip 8.6.0. Review these exceptions
# whenever those consumers, their pins, or their archive operations change. Remove
# them when the consumers accept a patched zip release (currently >=9.0.0).
[advisories]
ignore = [
    # Privileged permission bits during filesystem extraction.
    # https://rustsec.org/advisories/RUSTSEC-2026-0367
    "RUSTSEC-2026-0367",
    # Symbolic link targets outside the filesystem extraction destination.
    # https://rustsec.org/advisories/RUSTSEC-2026-0368
    "RUSTSEC-2026-0368",
    # Permission changes through symbolic links during filesystem extraction.
    # https://rustsec.org/advisories/RUSTSEC-2026-0369
    "RUSTSEC-2026-0369",
]
