[store]
dir = "target/nextest"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "10s" }
retries = 0

# These suites start language engines or share the model download cache.
# Nextest runs each test in a process, so an in-process mutex cannot serialize them.
[test-groups]
live = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^live_/)'
test-group = 'live'

[profile.ci]
global-timeout = "600s"

[profile.ci.junit]
path = "junit.xml"

[profile.corpus]
test-threads = 1
slow-timeout = { period = "300s", terminate-after = 4, grace-period = "30s" }

[profile.corpus.junit]
path = "junit.xml"
