nextest-version = "0.9.145"

[store]
dir = "target/nextest"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "10s" }
retries = 0
leak-timeout = { period = "200ms", result = "fail" }

# These suites take a resource the machine holds once: the language engines and
# the model download cache, and the loopback port range one elected server binds.
# Nextest runs each test in a process, so an in-process mutex cannot serialize
# them, and only a group keeps two of them off the resource at once.
[test-groups]
live = { max-threads = 1 }
election = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^live_/) or test(/^live_/)'
test-group = 'live'

[[profile.default.overrides]]
filter = 'binary(=server_cli) or binary(=mcp_proxy) or binary(=end_to_end) or binary(=logs_resource)'
test-group = 'election'

# This suite times each syntax shape at two sizes and compares the two times, a
# comparison that holds only while both sizes meet the same machine load. Tests on
# the other slots start and end between the two measurements, so the suite reserves
# every slot and runs alone.
[[profile.default.overrides]]
filter = 'binary(=wide_node_extraction)'
threads-required = "num-test-threads"

# The two suites that read the model hub wait out a download, and each names the
# budget it will wait. Those budgets run to six minutes, so the default
# one-minute deadline ends the test first: nextest reports a timeout and the
# suite never prints the readiness it reached, which is the whole diagnostic a
# slow or unreachable hub is meant to leave behind. The deadline here is above
# every wait either suite declares, and `dev/tests/test_delivery.py` keeps it
# there.
[[profile.default.overrides]]
filter = 'binary(=live_vector_search) or binary(=live_model_sources)'
slow-timeout = { period = "420s", terminate-after = 1, grace-period = "30s" }

# The live proxied engine case reads through the real proxy while rust-analyzer
# starts, and the harness bounds that engine call by `PROXIED_ENGINE_CALL_MAX`:
# two runs of the fixture's engine retry policy and a start window, past the
# one-minute default. Under that default nextest ends the case before its own
# bound can fail it with the engine's answer. The deadline here is above that
# bound and the proxied call the case makes first, and
# `dev/tests/test_delivery.py` keeps it there.
[[profile.default.overrides]]
filter = 'binary(=mcp_proxy) & test(=live_proxied_read_resolves_incoming_references)'
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "10s" }

[profile.ci]
default-filter = "not binary(/^live_/) and not binary(/^corpus_/) and not test(/^live_/)"
global-timeout = "480s"
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# The Windows publisher requires the compiled CLI and an explicitly selected
# ignored parent. Its separate run keeps the unit suite's JUnit report intact.
[profile.ci-windows-update]
inherits = "ci"

[profile.ci-windows-update.junit]
path = "junit.xml"

# The macos-15-intel runner is the slowest leg, and the SHA-256 each server
# start computes over its own test executable has no hardware path there. Its
# bound is the suite's 1798.9 s of summed test time, times 1.41 for the slowest
# such runner measured, over 4 test threads, plus 42 s for `wide_node_extraction`
# running alone: 676 s, and a third more for the suite to grow.
[profile.ci-macos-intel]
inherits = "ci"
global-timeout = "900s"

[profile.corpus]
test-threads = 1
global-timeout = "19m"
fail-fast = false
success-output = "immediate"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_fastapi) & test(=test_fastapi_corpus)'
slow-timeout = { period = "240s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_bun) & (test(=test_bun_workspace) | test(=test_bun_stop))'
slow-timeout = { period = "540s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_nextjs) & (test(=test_nextjs_corpus) | test(=test_nextjs_churn))'
slow-timeout = { period = "720s", terminate-after = 1, grace-period = "30s" }

[profile.corpus.junit]
path = "junit.xml"

[profile.live]
default-filter = "binary(/^live_/) or test(/^live_/)"
global-timeout = "19m"
fail-fast = false
failure-output = "immediate-final"

[profile.live.junit]
path = "junit.xml"
