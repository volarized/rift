nextest-version = "0.9.140"

[store]
dir = "target/nextest"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "10s" }
retries = 0
leak-timeout = { period = "200ms", result = "fail" }

# These suites take a resource the machine holds once: the language engines and
# the model download cache, and the loopback port range one elected server binds.
# Nextest runs each test in a process, so an in-process mutex cannot serialize
# them, and only a group keeps two of them off the resource at once.
[test-groups]
live = { max-threads = 1 }
election = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^live_/) or test(/^live_/)'
test-group = 'live'

[[profile.default.overrides]]
filter = 'binary(=server_cli) or binary(=mcp_proxy) or binary(=end_to_end) or binary(=logs_resource)'
test-group = 'election'

# The two suites that read the model hub wait out a download, and each names the
# budget it will wait. Those budgets run to six minutes, so the default
# one-minute deadline ends the test first: nextest reports a timeout and the
# suite never prints the readiness it reached, which is the whole diagnostic a
# slow or unreachable hub is meant to leave behind. The deadline here is above
# every wait either suite declares, and `dev/tests/test_delivery.py` keeps it
# there.
[[profile.default.overrides]]
filter = 'binary(=live_vector_search) or binary(=live_model_sources)'
slow-timeout = { period = "420s", terminate-after = 1, grace-period = "30s" }

[profile.ci]
default-filter = "not binary(/^live_/) and not binary(/^corpus_/) and not test(/^live_/)"
global-timeout = "480s"
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

[profile.corpus]
test-threads = 1
global-timeout = "19m"
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_fastapi) & test(=test_fastapi_corpus)'
slow-timeout = { period = "240s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_bun) & (test(=test_bun_workspace) | test(=test_bun_stop))'
slow-timeout = { period = "540s", terminate-after = 1, grace-period = "30s" }

[[profile.corpus.overrides]]
filter = 'binary(=corpus_nextjs) & (test(=test_nextjs_corpus) | test(=test_nextjs_churn))'
slow-timeout = { period = "720s", terminate-after = 1, grace-period = "30s" }

[profile.corpus.junit]
path = "junit.xml"

[profile.live]
default-filter = "binary(/^live_/) or test(/^live_/)"
global-timeout = "19m"
fail-fast = false
failure-output = "immediate-final"

[profile.live.junit]
path = "junit.xml"
