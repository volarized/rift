[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Every published bisync version was yanked upstream on 2026-08-24 while
  # gix-protocol (0.64 and 0.65 alike) still requires ^0.3.0, so no lock
  # update can satisfy the gate. Drop this entry once gix-protocol sheds
  # bisync or a non-yanked version returns.
  { crate = "bisync@0.3.0", reason = "all bisync releases yanked; gix-protocol pins ^0.3.0" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# rmcp 3.1.3 enables tracing-attributes 0.1.31, whose proc macro still uses syn 2.
# gix-pack's clru 0.6.3 still pins hashbrown 0.16 while indexmap is on 0.17.
# notify 8.2.0 still pins windows-sys 0.60 while Tokio and rustix use 0.61.
# gix's sha1 still pins cpufeatures 0.2 while uuid's rand stack uses 0.3.
# hyper-util 0.1 and reqwest's hyper-tls still pin base64 0.22 while rmcp's
# HTTP transports are on 0.23.
# lsp-types 0.97 still pins fluent-uri 0.1 while jsonschema's referencing and
# toasty-core are on 0.4, and lsp-types with fluent-uri 0.1 still pin
# bitflags 1 while the rest of the graph is on 2.
skip = [
  { name = "syn", version = "2.0.119" },
  { name = "fluent-uri", version = "0.1.4" },
  { name = "bitflags", version = "1.3.2" },
  { name = "hashbrown", version = "0.16.1" },
  { name = "windows-sys", version = "0.60.2" },
  { name = "cpufeatures", version = "0.2.17" },
  { name = "base64", version = "0.22.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
