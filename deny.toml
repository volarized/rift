[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# rmcp 3.1.3 enables tracing-attributes 0.1.31, whose proc macro still uses syn 2.
skip = [{ name = "syn", version = "2.0.119" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
