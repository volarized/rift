name: native-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/rift
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/rift
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/rift
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/rift
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/rift.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/rift.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v7.0.0
        with:
          name: candidate-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Restore candidate execution permission
        if: runner.os != 'Windows'
        run: chmod +x "${{ matrix.binary }}"
      - uses: taiki-e/install-action@v2.86.3
        with:
          tool: cargo-nextest@0.9.140
      - name: Test native process exit and update publication
        shell: bash
        env:
          RIFT_UPDATE_TEST_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
          RIFT_NATIVE_TESTS: >-
            test(=server::tests::stopped_process_does_not_wait_for_a_replacement_election)
            or test(=server::tests::changed_or_missing_document_does_not_prove_process_exit)
            or test(=server::tests::already_exited_process_does_not_wait_for_a_building_holder)
            or test(=server::tests::process_observation_errors_keep_waiting_and_retain_their_cause)
            or test(=server::tests::await_stopped_times_out_while_the_holder_keeps_the_election)
            or test(=server::tests::await_election_released_returns_once_the_holder_is_gone)
            ${{ runner.os == 'Windows' && 'or test(=update::tests::windows_publish_flushes_staging_and_preserves_backup) or test(=update::tests::windows_publish_replaces_running_binary_and_cleans_backup)' || '' }}
        run: >-
          cargo nextest run --release --locked --target "${{ matrix.target }}"
          --package rift --bin rift --profile ci --no-tests fail
          ${{ runner.os == 'Windows' && '--run-ignored all' || '' }}
          -E "$RIFT_NATIVE_TESTS"
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: native-tests-${{ matrix.target }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7
