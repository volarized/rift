name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # DO NOT DELETE as redundant with setup-bun. setup-bun caches only the
      # downloaded *bun executable* (`no-cache` input, `cache-hit` output -
      # both scoped to the binary). It has no `cache:` /
      # `cache-dependency-path` input like actions/setup-node. Dependency
      # caching is entirely on us; without this step `bun install` refetches
      # every package on every run.
      #
      # `actions/cache` paths are relative to the workspace root, NOT to
      # `defaults.run.working-directory`. Hence the `docs/` prefixes below.
      - name: Cache bun install
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache # $BUN_INSTALL/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Next reuses .next/cache across builds for compilation and, once
      # `output: export` is on, for the static render. Key on sources so a
      # content-only edit still gets a warm compiler cache via restore-keys.
      - name: Cache Next build
        uses: actions/cache@v6.1.0
        with:
          path: docs/.next/cache
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('docs/bun.lock') }}-${{
            hashFiles('docs/src/**', 'docs/content/**', 'docs/*.ts', 'docs/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('docs/bun.lock') }}-
            ${{ runner.os }}-next-

      - run: bun install --frozen-lockfile

      # `biome ci` = format + lint + assists (import sorting), non-mutating.
      # Baseline is RED today (25 errors / 12 warnings) - see plan step 0.
      - run: bunx biome ci .

      # `LayoutProps`/`PageProps` are globals Next generates into .next/types.
      # Without this, `tsc` on a cold checkout fails with TS2304 "Cannot find
      # name 'LayoutProps'". Caching does not help - we cache .next/cache, not
      # .next/types - and it passes locally only off a stale .next from an
      # earlier build. `typegen` emits them without paying for a full build.
      - run: bunx next typegen

      - run: bunx tsc --noEmit

      - run: bun run build
      - run: bun run pack

      # Dependabot supports version updates for bun but NOT security updates,
      # so nothing else would *block* a vulnerable JS dependency from landing.
      # Baseline is clean as of the dependency upgrade PR; `--audit-level=high`
      # keeps moderates visible in the log without failing the build.
      # image-size (build-time transitive of fumadocs-core) has two open DoS
      # advisories with no patched release - 2.0.2 is the newest version. The
      # parsers never see untrusted bytes here: the build sizes this repo's own
      # images. Drop the ignores once fumadocs picks up a fixed image-size.
      - run: bun audit --audit-level=high --ignore=GHSA-w3rx-r6r6-pgpr --ignore=GHSA-5p2g-fcmc-qvqq

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml and this live-engine install select the same
      # compiler release. Keep rustfmt, clippy, and rust-analyzer available
      # from that release.
      - uses: Swatinem/rust-cache@v2.9.2

      - uses: astral-sh/setup-uv@v7.6.0
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: just,cargo-audit,cargo-deny,cargo-llvm-cov

      # `rustup help toolchain install` documents a comma-separated component
      # list. Install every CI component from the pinned release in one step.
      - run: >-
          rustup toolchain install 1.98 --profile minimal
          --component rust-analyzer,rustfmt,clippy

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # tombi publishes to PyPI as `tombi`, and setup-uv already put `uv` on
      # PATH above; `uv tool install` puts the binary in its tool bin dir
      # and adds that dir to PATH itself, so no further wiring is needed.
      - run: |
          uv tool install tombi
          tombi --version

      # Each local gate target is its own CI step. There is no separate
      # coverage step: `just test` is the one instrumented run, and its
      # lcov output is the artifact uploaded below.
      - run: just format
      - run: just dashes
      - run: just generate-check
      - run: just check
      - run: just clippy
      - run: just docs
      - run: just audit
      - run: just test
      - name: Test release tooling
        id: release_tests
        run: just release-test
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=release.junit.xml -o junit_family=legacy

      - name: Upload release test results
        if: ${{ !cancelled() && steps.release_tests.outcome != 'skipped' }}
        uses: codecov/codecov-action@v5.5.5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: release.junit.xml
          flags: release
          name: rift-release
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test installers
        id: installer_tests
        run: just installer-test
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=installers.junit.xml -o junit_family=legacy

      - name: Upload installer test results
        if: ${{ !cancelled() && steps.installer_tests.outcome != 'skipped' }}
        uses: codecov/codecov-action@v5.5.5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: installers.junit.xml
          flags: installers
          name: rift-installers
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload CLI coverage
        uses: codecov/codecov-action@v5.5.5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          flags: cli
          name: rift-cli
          token: ${{ secrets.CODECOV_TOKEN }}

  # Feature resolution is per target: a dependency graph that compiles on
  # Linux proves nothing about the Windows graph (v0.0.2 shipped a Windows
  # build break CI never saw). Every OS in the release build matrix needs a
  # compile gate here.
  rust-release-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.2
      - run: rustup target add "${{ matrix.target }}"
      - run: >-
          cargo check --workspace --all-targets --all-features
          --target "${{ matrix.target }}"

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/rift-release/uv.lock
      - run: >-
          uv run --locked --project tools/rift-release pytest
          tools/rift-release/tests/test_installers.py
