name: rift-release-docs

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Both triggers publish to the same production Worker.
concurrency:
  group: rift-release-docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo '::error::Dispatch rift-release-docs from main'
          exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        if: github.event_name == 'push'
        with:
          enable-cache: true
          cache-dependency-glob: tools/rift-release/uv.lock
      - name: Validate release tag
        if: github.event_name == 'push'
        working-directory: .
        env:
          RIFT_TAG: ${{ github.ref_name }}
        run: uv run --locked --project tools/rift-release rift-release validate-tag
      - name: Require commit from main
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Cache bun install
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Cache Next build
        uses: actions/cache@v6.1.0
        with:
          path: docs/.next/cache
          key: >-
            ${{ runner.os }}-next-${{ hashFiles('docs/bun.lock') }}-${{
            hashFiles('docs/src/**', 'docs/content/**', 'docs/*.ts', 'docs/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('docs/bun.lock') }}-
            ${{ runner.os }}-next-
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://volar.sh/rift/docs/
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8.0.2
        with:
          name: docs-site
          path: docs/dist
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: bun
          command: deploy
      # Deploys propagate through Cloudflare asynchronously; a single
      # immediate probe flakes. Retry each URL for up to 30 seconds.
      - name: Verify live docs
        run: |
          for url in \
            "https://volar.sh/rift/docs/" \
            "https://volar.sh/rift/install.sh" \
            "https://volar.sh/rift/install.ps1"; do
            curl --fail --silent --show-error -o /dev/null \
              --retry 10 --retry-all-errors --retry-max-time 30 "$url"
          done
