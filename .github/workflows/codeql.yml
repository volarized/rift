name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after a commit lands still surface.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # `rust` went GA in Oct 2025 and needs no build step, so all three
        # languages run build-free.
        #   javascript-typescript -> docs/
        #   rust                  -> crates/
        #   actions               -> these workflows (workflow-injection class)
        language: [javascript-typescript, rust, actions]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.4
        with:
          language: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:${{ matrix.language }}
