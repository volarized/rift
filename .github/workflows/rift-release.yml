# Semantic tags publish Rift release artifacts.
name: rift-release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: rift-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RIFT_TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/rift-release/uv.lock
      - name: Validate release tag
        run: uv run --locked --project tools/rift-release rift-release validate-tag
      - name: Require commit from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # `registry` names the `main` job whose Cargo registry this target
        # restores: the native job for the same target, and on x86-64 Linux,
        # which has none, the job that builds the same `rift` package there.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/rift
            registry: integration-cli
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/release/rift
            registry: native-aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/rift
            registry: native-x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/rift
            registry: native-aarch64-apple-darwin
          # See ci.yml's native job: without `/Brepro`, link.exe gives every
          # proc-macro build new bytes, and its dependents miss the cache.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/release/rift.exe
            registry: native-x86_64-pc-windows-msvc
            rustflags: -C link-arg=/Brepro
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: target/release/rift.exe
            registry: native-aarch64-pc-windows-msvc
            rustflags: -C link-arg=/Brepro
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RIFT_TARGET: ${{ matrix.target }}
      # Release tooling uses x86-64 Python on Windows ARM; Rift stays native.
      UV_PYTHON: ${{ matrix.os == 'windows-11-arm' && 'cpython-3.12-windows-x86_64-none' || '3.12' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            dev/uv.lock
            tools/rift-release/uv.lock
      # A tag restores the registry `main` saved and saves nothing: no later
      # tag could restore a cache written under this one.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ${{ matrix.registry }}
          cache-targets: false
          save-if: false
      - uses: taiki-e/install-action@v2.87.16
        with:
          tool: sccache@0.18.0
      # The build passes no `--target`, so RUSTFLAGS reaches proc-macros too;
      # every runner builds for its own host, which this holds to the target.
      - name: Install the toolchain for this target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          rustc --print host-tuple | grep -Fx "${{ matrix.target }}"
      # The same R2 build cache CI compiles through, started the same way; see
      # `dev/src/rift_dev/build_cache.py`. The release profile shares no object
      # with CI's builds, so a tag reuses what earlier tags compiled.
      - name: Start the build cache
        env:
          R2_BUILD_CACHE_ENDPOINT: ${{ secrets.R2_BUILD_CACHE_ENDPOINT }}
          R2_BUILD_CACHE_READ_ACCESS_KEY_ID: ${{ secrets.R2_BUILD_CACHE_READ_ACCESS_KEY_ID }}
          R2_BUILD_CACHE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_BUILD_CACHE_READ_SECRET_ACCESS_KEY }}
          R2_BUILD_CACHE_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_BUILD_CACHE_WRITE_ACCESS_KEY_ID }}
          R2_BUILD_CACHE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_BUILD_CACHE_WRITE_SECRET_ACCESS_KEY }}
        run: uv run --locked --project dev rift-dev build-cache
      - name: Build release binary
        timeout-minutes: 30
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --package rift
      - name: Report the build cache
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats
      - name: Package release archive
        run: >-
          uv run --locked --project tools/rift-release rift-release package
          --binary "${{ matrix.binary }}"
          --output dist
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: rift-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: bun run pack
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, docs]
    runs-on: ubuntu-24.04
    environment: rift-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/rift-release/uv.lock
      - uses: actions/download-artifact@v7.0.0
        with:
          path: dist
          pattern: rift-*
          merge-multiple: true
      - name: Write checksums
        run: >-
          uv run --locked --project tools/rift-release rift-release checksums
          --directory dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RIFT_TAG" dist/*
          --verify-tag
          --title "Rift $RIFT_TAG"
          --generate-notes

  deploy-docs:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://volar.sh/rift/docs/
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/download-artifact@v7.0.0
        with:
          name: docs-site
          path: docs/dist
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          packageManager: bun
          command: deploy
      # Deploys propagate through Cloudflare asynchronously; a single
      # immediate probe flakes. Retry each URL for up to 30 seconds.
      - name: Verify live release
        run: |
          for url in \
            "https://volar.sh/rift/docs/" \
            "https://volar.sh/rift/install.sh" \
            "https://volar.sh/rift/install.ps1"; do
            curl --fail --silent --show-error -o /dev/null \
              --retry 10 --retry-all-errors --retry-max-time 30 "$url"
          done
