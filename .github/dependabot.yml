version: 2

# Commit prefixes carry 🤖 so Dependabot's commits match the repo's
# emoji-prefixed convention and are greppable as machine-authored.
#
# GitHub inserts the colon itself because the prefix ends in a letter, and
# `include: scope` appends `(deps)` / `(deps-dev)`. Net result:
#     🤖 build(deps): bump github/codeql-action from 4 to 4.37.4
# The PR title derives from the same string, so squash-merged commits on main
# inherit it too. 50-character limit on `prefix`.
#
# `prefix-development` is only honoured by bundler, composer, mix, maven, npm,
# and pip - so it applies to bun (npm family) and is inert for cargo and
# github-actions, where every update is treated as production.

updates:
  # docs/ JavaScript. NOTE: Dependabot supports *version* updates for bun but
  # NOT security updates - that gap is why ci.yml also runs `bun audit` as a
  # blocking gate. Requires the text-based bun.lock (>=1.1.39), which we have.
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🤖 build"
      prefix-development: "🤖 build"
      include: scope
    groups:
      # One PR per week for the routine churn instead of a dozen.
      docs-minor-patch:
        update-types: [minor, patch]
      # The docs toolchain upgrades as one unit: fumadocs-mdx imports paths
      # that only the matching fumadocs-core exports, and fumadocs-ui carries
      # its own copy of fumadocs-core. Split across separate pull requests,
      # each major fails against the versions the others still pin, so the
      # group is what can land. Cargo, uv, and github-actions majors stay
      # ungrouped: those are independent packages, and grouping them would let
      # one breaking bump hold back the rest.
      docs-major:
        update-types: [major]

  # tools/mcp-conformance JavaScript: the MCP specification's own conformance
  # runner. Following its releases is how the gate picks up new scenarios and
  # new requirement sets, so the version tracks the specification's own.
  - package-ecosystem: bun
    directory: /tools/mcp-conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🤖 build"
      prefix-development: "🤖 build"
      include: scope
    groups:
      conformance-minor-patch:
        update-types: [minor, patch]
      conformance-major:
        update-types: [major]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🤖 build"
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Keeps the action pins current - notably `rustsec/audit-check`, which
  # publishes no floating major tag and so is pinned exactly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "🤖 build"
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "🤖 build"
      prefix-development: "🤖 build"
      include: scope
    groups:
      dev-minor-patch:
        update-types: [minor, patch]
