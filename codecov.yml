flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: cli
      carryforward: false
    - name: corpus
      carryforward: true

# A notification waits for every coverage job `ci` runs, so it never describes a
# fraction of the run. When the live suites uploaded a second report, Codecov
# computed the patch from whichever job reported first and a pull request read 13%
# against a merged 99.5%; `after_n_builds: 2` did not hold that notification, which
# fired on a single upload. The live suites now report no coverage at all, which
# they had almost none of to give: measured on one tree they reached three lines
# the unit report did not, out of 78,757.
#
# The corpus job joined `ci` and carries its own coverage upload alongside the CLI
# job's, so the wait is two builds again - this time for `cli` and `corpus`, not
# `cli` and `live`. `dev/tests/test_delivery.py` refuses a count that disagrees
# with the coverage uploads `ci` performs, so a third coverage job has to settle
# this again rather than silently reopen the window.
codecov:
  notify:
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: "86...100"
  status:
    project:
      default:
        target: 86%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 86%
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
  after_n_builds: 2

github_checks:
  annotations: true
