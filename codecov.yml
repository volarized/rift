flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: cli
      carryforward: false
    - name: corpus
      carryforward: true

# Two jobs upload coverage for one pull request: `rust` sends the unit report and
# `live` sends the engine report. Each on its own describes a fraction of the run,
# and the `live` job finishes minutes ahead of `rust`, so a status computed on its
# arrival read the patch at 13% while the same commit's merged report read 99.5%.
# Notifications wait for both. `dev/tests/test_delivery.py` refuses a count that
# disagrees with the coverage uploads `ci` performs.
codecov:
  notify:
    after_n_builds: 2

coverage:
  precision: 2
  round: down
  range: "86...100"
  status:
    project:
      default:
        target: 86%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 86%
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
  after_n_builds: 2

github_checks:
  annotations: true
