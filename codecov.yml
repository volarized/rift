flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: cli
      carryforward: false
    - name: corpus
      carryforward: true

coverage:
  precision: 2
  round: down
  range: "86...100"
  status:
    project:
      default:
        target: 86%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 86%
        threshold: 0%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  require_changes: false

github_checks:
  annotations: true
