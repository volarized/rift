// One named part of a leaf. A language marks these out inside a declaration, so an operation
// can address the body of a function without addressing its documentation.
enum RegionRole {
  // The caller did not set a value.
  REGION_ROLE_UNSPECIFIED = 0;
  // What an editor should select on arriving here: the name for a declaration, the whole node
  // otherwise.
  REGION_ROLE_SELECTION = 1;
  // The identifier alone. What a rename rewrites.
  REGION_ROLE_NAME = 2;
  // Everything before the body — the keyword, the name, the parameters, the return type.
  REGION_ROLE_HEADER = 3;
  // The implementation. Replacing it leaves the signature and the documentation standing.
  REGION_ROLE_BODY = 4;
  // What the node holds where its interior is not code: the text of a comment, the characters
  // inside a string.
  REGION_ROLE_CONTENT = 5;
  // The doc comment for this declaration. In most languages it sits outside the declaration,
  // which is why the leaf has to point at it.
  REGION_ROLE_DOCUMENTATION = 6;
  // The node with everything that belongs to it, documentation and annotations included. What a
  // delete should take.
  REGION_ROLE_ENCLOSING = 7;
