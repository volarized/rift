  // otherwise indistinguishable. The changed set has no bound. This field is SHA-256 over each
  // differing path with the digest of its content, in RFC 8785 canonical JSON. A clean tree
  // digests the empty set.
  string changes = 3;
}
// What a `Revision` resolved to, reported beside every answer so a second call can ask the same
// question again and get the same state.
//
