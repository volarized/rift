  LEAF_FACET_DECLARATION = 1;
  // Gives a name its body. Where jump-to-definition lands.
  LEAF_FACET_DEFINITION = 2;
  // The implementation part of a declaration, after its header.
  LEAF_FACET_BODY = 3;
  // A run of statements that opens a scope, however the language delimits one.
  LEAF_FACET_BLOCK = 4;
  // One step of execution.
  LEAF_FACET_STATEMENT = 5;
  // Something that evaluates to a value.
  LEAF_FACET_EXPRESSION = 6;
  // A type as written, in a position where the language expects one.
  LEAF_FACET_TYPE_EXPRESSION = 7;
  // Brings a name in from another unit.
  LEAF_FACET_IMPORT = 8;
  // Makes a name visible outside this unit.
  LEAF_FACET_EXPORT = 9;
  // A parameter as written in a declaration.
  LEAF_FACET_PARAMETER = 10;
  // A value as written at a call site.
  LEAF_FACET_ARGUMENT = 11;
  // Metadata attached to a declaration: a decorator, an attribute, a Java annotation.
  LEAF_FACET_ANNOTATION = 12;
  // Text the compiler ignores. A doc comment carries this too; `RegionRole.documentation` is
  // what ties one to the declaration it describes.
  LEAF_FACET_COMMENT = 13;
  // A name as written, whether it declares or refers.
  LEAF_FACET_IDENTIFIER = 14;
  // A value written straight into the source — `42`, `true`.
  LEAF_FACET_LITERAL = 15;
  // A destructuring or matching form: a `match` arm, a binding that pulls fields apart.
  LEAF_FACET_PATTERN = 16;
  // Produced by a tool from something else in the workspace. Destructive policy gates on this,
  // because the next build overwrites whatever you write here.
  LEAF_FACET_GENERATED = 17;
