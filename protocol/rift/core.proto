}
// Everything in scope is here, so a fact that is missing is a fact that does not exist.
message CoverageComplete {
  // What the claim covers.
  CoverageScope scope = 1;
}
// Some of what is in scope is missing. `reason` is required here because a caller that reads
// absence as proof would be wrong.
message CoveragePartial {
  // What the claim covers.
  CoverageScope scope = 1;
  // Why the answer stops short — a limit hit, a file that would not parse, a page boundary.
  // Prose for a reader; nothing keys on it.
  string reason = 2;
  // How to ask for the rest, where there is a way to.
  optional string continuation = 3;
}
// The family was never produced at all, so there is nothing here to be complete about.
message CoverageState {
  // `unsupported` — the adapter cannot produce this family at all. `not_applicable` — the
  // family has no meaning for this language.
  enum State {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The adapter does not produce this family, though the language has the concept. A later
    // build of it might.
    UNSUPPORTED = 1;
    // The language has no such concept because its adapter consumes only physical source.
    NOT_APPLICABLE = 2;
  }
  State state = 1;
  // What the claim covers.
  CoverageScope scope = 2;
  // Which of the two this is, in words: the feature the adapter lacks, or the concept the
  // language lacks.
  string reason = 3;
}
// How much of one `FactFamily` an answer actually covers. Absence of a fact means the fact does
// not exist only where the state is `complete`; anywhere else it means Rift did not get that
// far.
message Coverage {
  oneof variant {
    CoverageComplete complete = 1;
    CoveragePartial partial = 2;
    CoverageState state = 3;
  }
}
// How a type is written in the source, plus the symbol that declares it when one does. A type
// with a declaration resolves to that symbol; a structural type — `string | null`, `{ a: string
// }` — has the spelling and nothing to resolve to.
message TypeExpression {
  // The language the spelling is in, and so the adapter that produced it.
  Language language = 1;
  // The type as it is written: `Optional[Config]`, `&mut [u8]`, `string | null`.
  string source = 2;
  // The symbol that declares this type, where one does. Null for a structural type, which has a
  // spelling and nothing to open.
  optional string resolved = 3;
  // Type facts the model has no field for, namespaced by the adapter that emitted them.
  Extensions extensions = 4;
}
// One type a symbol carries, together with the role it plays for that symbol.
message TypeBinding {
  // What this type is to the symbol that carries it.
  enum Role {
    // The caller did not set a value.
    ROLE_UNSPECIFIED = 0;
    // The type of the implicit first argument — `self`, `this`.
    RECEIVER = 1;
    // The type of an argument the callable takes.
    PARAMETER = 2;
    // The type the call yields.
    RETURN = 3;
    // The type of a data member.
    FIELD = 4;
    // A constraint the type has to satisfy — the `Serialize` in `T: Serialize`.
    BOUND = 5;
    // What a container holds: the `u8` in `Vec<u8>`, the value type of a map.
    ELEMENT = 6;
    // The key type of a map.
    KEY = 7;
    // The failure type — the `E` in `Result<T, E>`, a Go `error` return.
    ERROR = 8;
    // What an alias or a newtype wraps.
    UNDERLYING = 9;
    // What a generator produces per step.
    YIELDED = 10;
    // What completes inside an asynchronous value — the `T` in `Promise<T>`.
    AWAITED = 11;
    // The representation an enumeration is stored as, where the language pins one.
    DISCRIMINANT = 12;
  }
  // Where the type fact came from. A declared type and an inferred one can both be present and
  // disagree, which is the interesting case.
  enum Provenance {
    // The caller did not set a value.
    PROVENANCE_UNSPECIFIED = 0;
    // Written in the source by the author.
    DECLARED = 1;
    // The adapter worked it out; nothing in the source says it.
    INFERRED = 2;
    // What the surrounding context demands here. A mismatch is reported against this one.
    EXPECTED = 3;
  }
  Role role = 1;
  Provenance provenance = 2;
  // The type itself.
  TypeExpression type = 3;
}
// One block of documentation attached to a declaration, in the markup it was written in.
message Documentation {
  // Which markup the text is written in, since whoever displays a doc comment is the one that
  // renders it.
  enum Format {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // No markup. Show the text as it is.
    PLAIN = 1;
    // Markdown, as the language's own doc tooling writes it.
    MARKDOWN = 2;
  }
  Format format = 1;
  // The body of the comment, with the comment syntax stripped.
  string text = 2;
}
// One parameter of a `Signature`: what it is called, the types bound to it, and how a call may
// pass it. A receiver is one of these too, held in its own field because it has no position in
// the parameter list.
message Parameter {
  // What the parameter is called. Null where the language allows an unnamed one, as a
  // positional parameter in a function type.
  optional string name = 1;
  // Where this parameter is written in the source.
  optional string node = 2;
  // What it accepts. An array because a declared type and an inferred one are separate
  // bindings.
  repeated TypeBinding types = 3;
  // Whether a call may leave it out.
  bool optional = 4;
  // Whether it absorbs the arguments that follow — `*args`, `...rest`.
  bool variadic = 5;
  // The default value as written in the source. Null where there is none.
  optional string default = 6;
  // Parameter facts the model has no field for, namespaced by the adapter that emitted them.
  Extensions extensions = 7;
}
// One callable form of a symbol: the text it renders as, the symbols that text points at, and
// its structure. Overloads are separate entries.
message Signature {
  // The signature as a reader sees it, in the language's own syntax.
  string display = 1;
  // Symbols named inside `display`, each with the byte range of `display` that names it, so a
  // renderer can turn the rendered text into links.
  repeated SignatureLink links = 2;
  // The language whose syntax `display` is written in.
  Language language = 3;
  // The implicit first parameter — `self`, `this`. Null for a free function, and for languages
  // that have no such thing.
  optional Parameter receiver = 4;
  // Declared parameters, in source order.
  repeated Parameter parameters = 5;
  // What the call yields. An array because a language may return several values, and because a
  // declared and an inferred return are separate bindings.
  repeated TypeBinding returns = 6;
  // The generic parameters this form declares, each as the symbol that declares it.
  repeated string type_parameters = 7;
  // Types this form declares it can raise.
  repeated TypeExpression throws = 8;
  // Effect keywords the declaration carries, in the language's own words: `async`, `unsafe`,
  // `pure`. The spelling is preserved and never mapped onto a portable meaning.
  repeated string effects = 9;
  // Signature facts the model has no field for, namespaced by the adapter that emitted them.
  Extensions extensions = 10;
}
// One symbol named inside a rendered signature, with the byte range of that rendering which
// names it.
message SignatureLink {
  // Offsets into the rendered string in `Signature.display`.
  TextRange range = 1;
  // The symbol that stretch of text names.
  string symbol = 2;
}
// Declared in a dependency. `manager` is the package manager that installed it, so `npm`,
// `cargo` or `pip`; `name` and `version` are that manager's own. Upgrading the dependency
// replaces these symbols.
message SymbolOriginPackage {
  // The package manager that installed it.
  string manager = 1;
  // The package name, as that manager spells it.
  string name = 2;
  // The installed version.
  string version = 3;
}
// Source of a symbol definition. The variant determines whether its source can be read or
// edited and whether a package upgrade can replace it.
message SymbolOrigin {
  oneof variant {
    google.protobuf.Empty workspace = 1;
    SymbolOriginPackage package = 2;
    google.protobuf.Empty stdlib = 3;
    google.protobuf.Empty external = 4;
    google.protobuf.Empty generated = 5;
    google.protobuf.Empty synthetic = 6;
  }
}
// Adapter-resolved semantic identity. Source structure lives in Node and is connected through
// Relationship.
message Symbol {
  // One portable category a symbol falls into. Kinds are language-specific; facets are shared,
  // so a filter written once applies to every language an adapter is installed for.
  enum SymbolFacet {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Groups names without being a unit the language loads — a C++ `namespace`, a Java package,
    // a SQL schema.
    SYMBOL_FACET_NAMESPACE = 1;
    // A unit the language imports whole. A TypeScript file carries this facet, and so do a Rust
    // `mod` and a Go package, both of which can span several files.
    SYMBOL_FACET_MODULE = 2;
    // Declares a type. `struct Config` and `interface Props` both qualify, which is what makes
    // one search for types find both.
    SYMBOL_FACET_TYPE = 3;
    // Names something that exists while the program runs: a variable, a constant, a function
    // object. A CSS class selector and a SQL sequence carry it too.
    SYMBOL_FACET_VALUE = 4;
    // Can be called, and so carries at least one `Signature`.
    SYMBOL_FACET_CALLABLE = 5;
    // Owned by another symbol — a method, a field, an enum variant. Ownership is not lexical: a
    // Go method is written beside its type, and a Rust method inside an `impl` block.
    SYMBOL_FACET_MEMBER = 6;
    // Can hold members: a class, a struct, an interface.
    SYMBOL_FACET_MEMBER_CONTAINER = 7;
    // A parameter of a callable, declared as a symbol of its own so it can be renamed and
    // referred to.
    SYMBOL_FACET_PARAMETER = 8;
    // A generic parameter — the `T` in `Vec<T>`. A Rust lifetime and a C++ `template<int N>`
    // carry it too.
    SYMBOL_FACET_TYPE_PARAMETER = 9;
    // Can be instantiated — `new Foo()`, `Foo { .. }`.
    SYMBOL_FACET_CONSTRUCTIBLE = 10;
    // Can be inherited from or overridden: a non-`final` class, a Kotlin `open fun`, a C++
    // `virtual` method.
    SYMBOL_FACET_EXTENSIBLE = 11;
    // Names a contract another type can satisfy: an interface, a trait, a protocol.
    SYMBOL_FACET_IMPLEMENTABLE = 12;
    // Expands source at compile time, as `macro_rules!` and preprocessor definitions do.
    SYMBOL_FACET_MACRO = 13;
    // The language's test tooling collects it as a test: a `#[test]` function, a `describe`
    // block.
    SYMBOL_FACET_TEST = 14;
    // Declared to be attached to another declaration: a Java `@interface`, a Kotlin `annotation
    // class`, a Python decorator, a Rust attribute macro.
    SYMBOL_FACET_ANNOTATION = 15;
    // Attached to a type declared somewhere else — a Kotlin extension function, a method in a
    // Rust `impl` block, a Go method, a Dart extension.
    SYMBOL_FACET_EXTENSION = 16;
    // One case of a closed set: a Rust enum variant, a Scala `case`, a Java enum constant.
    SYMBOL_FACET_VARIANT = 17;
    // Declares the closed set those variants belong to. A `match` over it is exhaustive once
    // every variant is covered.
    SYMBOL_FACET_ENUMERATION = 18;
    // Another name for a symbol declared elsewhere — a `typealias`, a C++ `using`, a re-export.
    // The `aliases` edge says which symbol.
    SYMBOL_FACET_ALIAS = 19;
    // Read and written as a value, and backed by code that runs — a Kotlin property, a Python
    // `@property`, a JavaScript getter.
    SYMBOL_FACET_PROPERTY = 20;
    // Declared without an implementation. Whatever carries `implements` or `extends` to it has
    // to supply one.
    SYMBOL_FACET_ABSTRACT = 21;
    // The callable that produces an instance. `constructible` marks the type it produces.
    SYMBOL_FACET_CONSTRUCTOR = 22;
    // Bound to the declaration rather than to an instance, so a call needs no receiver.
    SYMBOL_FACET_STATIC = 23;
    // Can be reassigned after it is initialized. A Rust `let mut` carries it, a `let` does not.
    SYMBOL_FACET_MUTABLE = 24;
    // Reachable from outside the unit that declares it. `visibility` carries the language's own
    // word, which Go and Python do not have: there the adapter reads the naming convention.
    SYMBOL_FACET_PUBLIC = 25;
    // Marked as no longer to be used, however the language spells it — `@Deprecated`,
    // `#[deprecated]`, a doc tag.
    SYMBOL_FACET_DEPRECATED = 26;
    // Where execution starts: `fn main`, `func main`, a `bin` script named by the package
    // manifest.
    SYMBOL_FACET_ENTRYPOINT = 27;
    // Invoked through operator syntax — C++ `operator+`, Python `__add__`, a Kotlin `operator
    // fun`.
    SYMBOL_FACET_OPERATOR = 28;
    // Produces a value that completes later. `Signature.effects` keeps the language's own
    // keyword: `async`, `suspend`.
    SYMBOL_FACET_ASYNC = 29;
    // Yields a sequence one value at a time instead of returning once — a Python generator, a
    // Dart `sync*` function.
    SYMBOL_FACET_GENERATOR = 30;
  }
  // Unique identifier of this symbol across the whole workspace, and the URI that resolves it.
  // Hand it to the symbol resource as it stands.
  string id = 1;
  // The language this symbol belongs to.
  Language language = 2;
  // The human-readable name, as written in the source: `parseConfig`. Rendered signatures live
  // in `signatures`.
  string name = 3;
  // What this symbol is in the adapter's vocabulary, such as `trait`, `function`, or `table`.
  string kind = 4;
  // Portable classification for cross-language queries. The local kinds `trait` and `interface`
  // can both carry the `type` facet.
  repeated SymbolFacet facets = 5;
  // Where the symbol comes from: code in this workspace, or a package it depends on.
  SymbolOrigin origin = 6;
  // The symbol this one belongs to — the class that owns a method, the module that owns a
  // function. Ownership is not lexical: a Go method is written beside its type and a Rust
  // method inside an `impl` block, and both name the type here. Absent at the top level.
  optional string container = 7;
  // Language keywords qualifying the declaration: `export`, `async`, `const`.
  repeated string modifiers = 8;
  // How widely the symbol is visible, in the language's own terms — `public`, `private`,
  // `pub(crate)`. Null where the language has no such concept.
  optional string visibility = 9;
  // The types this symbol carries, each tagged with the role it plays: a return type, a field
  // type, a bound.
  repeated TypeBinding types = 10;
  // One entry per callable form. Where the language dispatches overloads separately they are
  // separate symbols joined by the `overloads` edge; several entries here are alternative forms
  // of one dispatch target, as `typing.overload` writes them.
  repeated Signature signatures = 11;
  // Doc comments attached to the declaration, with the markup format they were written in.
  repeated Documentation documentation = 12;
  // Language-specific facts with no portable equivalent, namespaced by the adapter that emitted
  // them.
  Extensions extensions = 13;
  // Whether language semantics confine this symbol to the document that declares it. The
  // adapter classifies locality from its language model.
  bool document_local = 14;
}
// One named part of a node, and the bytes it spans.
message NodeRegion {
  // One named part of a node. A language marks these out inside a declaration, so an operation
  // can address the body of a function without addressing its documentation.
  enum RegionRole {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // What an editor should select on arriving here: the name for a declaration, the whole node
    // otherwise.
    REGION_ROLE_SELECTION = 1;
    // The identifier alone. What a rename rewrites.
    REGION_ROLE_NAME = 2;
    // Everything before the body — the keyword, the name, the parameters, the return type.
    REGION_ROLE_HEADER = 3;
    // The implementation. Replacing it leaves the signature and the documentation standing.
    REGION_ROLE_BODY = 4;
    // What the node holds where its interior is not code: the text of a comment, the characters
    // inside a string.
    REGION_ROLE_CONTENT = 5;
    // The doc comment for this declaration. In most languages it sits outside the declaration,
    // which is why the node has to point at it.
    REGION_ROLE_DOCUMENTATION = 6;
    // The node with everything that belongs to it, documentation and annotations included. What
    // a delete should take.
    REGION_ROLE_ENCLOSING = 7;
  }
  // Which part of the node this is.
  RegionRole role = 1;
  // Offsets into the file, on the same scale as `Node.range`.
  TextRange range = 2;
}
// One node of a file's concrete syntax tree. It identifies a source range and adapter-local
// syntax kind. `symbol` connects the node to semantic identity when the language supplies one.
message Node {
  // Portable structural facets used by filters and policy. `generated` and `test` also
  // constrain destructive operations, reference handling, and refactor scope.
  enum NodeFacet {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Introduces a name without necessarily giving it a body — a prototype, an `extern` line.
    NODE_FACET_DECLARATION = 1;
    // Gives a name its body. Where jump-to-definition lands.
    NODE_FACET_DEFINITION = 2;
    // The implementation part of a declaration, after its header.
    NODE_FACET_BODY = 3;
    // A run of statements that opens a scope, however the language delimits one.
    NODE_FACET_BLOCK = 4;
    // One step of execution.
    NODE_FACET_STATEMENT = 5;
    // Something that evaluates to a value.
    NODE_FACET_EXPRESSION = 6;
    // A type as written, in a position where the language expects one.
    NODE_FACET_TYPE_EXPRESSION = 7;
    // Brings a name in from another unit.
    NODE_FACET_IMPORT = 8;
    // Makes a name visible outside this unit.
    NODE_FACET_EXPORT = 9;
    // A parameter as written in a declaration.
    NODE_FACET_PARAMETER = 10;
    // A value as written at a call site.
    NODE_FACET_ARGUMENT = 11;
    // Metadata attached to a declaration: a decorator, an attribute, a Java annotation.
    NODE_FACET_ANNOTATION = 12;
    // Text the adapter ignores. A doc comment carries this too; `RegionRole.documentation` is
    // what ties one to the declaration it describes.
    NODE_FACET_COMMENT = 13;
    // A name as written, whether it declares or refers.
    NODE_FACET_IDENTIFIER = 14;
    // A value written straight into the source — `42`, `true`.
    NODE_FACET_LITERAL = 15;
    // A destructuring or matching form: a `match` arm, a binding that pulls fields apart.
    NODE_FACET_PATTERN = 16;
    // Produced by a tool from something else in the workspace. Destructive policy gates on
    // this, because the next build overwrites whatever you write here.
    NODE_FACET_GENERATED = 17;
    // Part of the test suite. Refactor scope gates on this, so a change can be confined to
    // production code or carried across both.
    NODE_FACET_TEST = 18;
  }
  // Unique identifier of this source region, and the URI that resolves it.
  string id = 1;
  // The symbol written at this node. Absent where a node writes no symbol — punctuation, a
  // keyword, a comment.
  optional string symbol = 2;
  // The file the node is written in.
  string unit = 3;
  // The grammar that produced this node. It belongs to the identity because two adapters can
  // produce different trees over the same file bytes.
  Language language = 4;
  // What the node is in the adapter's vocabulary, such as `fn_item`, `mapping.key`, or
  // `selector.class`.
  string kind = 5;
  // Portable structural classification, so a query can ask for bodies or imports without
  // knowing the grammar that produced them.
  repeated NodeFacet facets = 6;
  // The bytes it spans, as offsets into the file.
  TextRange range = 7;
  // The node's named parts, so an operation can rewrite a function body without touching the
  // documentation above it.
  repeated NodeRegion regions = 8;
  // The region this one is nested inside. Absent at the top level of a unit.
  optional string parent = 9;
  // Syntax facts the model has no field for, namespaced by the adapter that emitted them.
  Extensions extensions = 10;
}
// One directed edge between two symbols. Its evidence is the nodes it was read from, and its
// derivation is how much the adapter knew when it was read.
message Relationship {
  // One portable category an edge falls into. The local kinds `import` and `use` can share the
  // `imports` facet, which lets one query cross languages.
  enum RelationshipFacet {
    // The caller did not set a value.
    RELATIONSHIP_FACET_UNSPECIFIED = 0;
    // `from` lexically holds `to` — a module and the functions written in it.
    RELATIONSHIP_FACET_CONTAINS = 1;
    // `from` owns `to`. A class carries this to its methods even where the language writes them
    // outside its body.
    RELATIONSHIP_FACET_DECLARES = 2;
    // `from` adds members to `to`, which is declared elsewhere — a Rust `impl` block, a
    // TypeScript `declare module`, an `ALTER TABLE`, a CSS rule for a selector another file
    // already styles.
    RELATIONSHIP_FACET_AUGMENTS = 3;
    // `from` mentions `to` somewhere in the source and nothing narrower fits. The fallback edge
    // where there is a node to point at.
    RELATIONSHIP_FACET_REFERENCES = 4;
    // `from` invokes `to`.
    RELATIONSHIP_FACET_CALLS = 5;
    // `from` creates an instance of `to`.
    RELATIONSHIP_FACET_CONSTRUCTS = 6;
    // `from` takes the value of `to`. A SQL `SELECT` against a table is this edge.
    RELATIONSHIP_FACET_READS = 7;
    // `from` assigns to `to`. A SQL `INSERT`, `UPDATE` or `DELETE` is this edge.
    RELATIONSHIP_FACET_WRITES = 8;
    // `from` brings `to` in from another unit. A header or a stylesheet that declares nothing
    // of its own is a synthetic `module` symbol, so `#include` and `@import` are the same edge
    // as a Python `import`.
    RELATIONSHIP_FACET_IMPORTS = 9;
    // `from` makes `to` visible outside its unit.
    RELATIONSHIP_FACET_EXPORTS = 10;
    // `from` inherits from `to`.
    RELATIONSHIP_FACET_EXTENDS = 11;
    // `from` satisfies the contract `to` declares.
    RELATIONSHIP_FACET_IMPLEMENTS = 12;
    // `to` is the type of `from`. What jump-to-type-definition follows.
    RELATIONSHIP_FACET_HAS_TYPE = 13;
    // `from` replaces an inherited `to`.
    RELATIONSHIP_FACET_OVERRIDES = 14;
    // `from` is another name for `to` — a type alias, a re-export, an `as` rename.
    RELATIONSHIP_FACET_ALIASES = 15;
    // `to` was produced from `from` by a build step, so editing `to` lasts until the next
    // build.
    RELATIONSHIP_FACET_GENERATES = 16;
    // `from` needs `to` and there is no place in the source to point at — a manifest entry, a
    // build dependency. The coarsest edge there is.
    RELATIONSHIP_FACET_DEPENDS_ON = 17;
    // `to` is attached to `from` as metadata: an annotation, a decorator, an attribute.
    RELATIONSHIP_FACET_ANNOTATED_BY = 18;
    // `from` can raise `to`.
    RELATIONSHIP_FACET_THROWS = 19;
    // `from` handles `to` when something it calls raises it.
    RELATIONSHIP_FACET_CATCHES = 20;
    // `from` is constrained to satisfy `to` — the `Serialize` in `T: Serialize`, the
    // `Comparable` in `<T extends Comparable<T>>`.
    RELATIONSHIP_FACET_BOUNDED_BY = 21;
    // `from` applies `to` as a type argument — the `Config` in `Vec<Config>`.
    RELATIONSHIP_FACET_INSTANTIATES = 22;
    // `from` is a narrower form of `to`, chosen over it where both match.
    RELATIONSHIP_FACET_SPECIALIZES = 23;
    // `from` and `to` share a name and differ in signature, and the language picks between them
    // at the call site.
    RELATIONSHIP_FACET_OVERLOADS = 24;
    // `from` takes members from `to` by linearization — a Dart `with` clause, a Scala mixin.
    // The order they are written in decides which one wins.
    RELATIONSHIP_FACET_MIXES_IN = 25;
    // `from` holds `to` and promotes its members, so they are reachable without naming the
    // field. Go struct embedding.
    RELATIONSHIP_FACET_EMBEDS = 26;
    // `from` exercises `to`. A test that reaches its target through reflection or HTTP has no
    // call edge to carry it.
    RELATIONSHIP_FACET_TESTS = 27;
    // `from` supplies configuration `to` reads — a `rift.toml` key and the field it fills, a
    // `tsconfig` path alias and the module it resolves.
    RELATIONSHIP_FACET_CONFIGURES = 28;
    // `from` names `to` across a language boundary: a `className` and the CSS rule it selects,
    // an ORM entity and its table.
    RELATIONSHIP_FACET_BINDS = 29;
  }
  // How this edge was established. Every edge reaches Rift from an adapter; this field records
  // how much the adapter knew. A refactor may use `resolution` directly. Lower levels require
  // another check before rewriting.
  enum Derivation {
    // The caller did not set a value.
    DERIVATION_UNSPECIFIED = 0;
    // The adapter's own name resolution or type checker produced the edge. It is a fact about
    // the program.
    RESOLUTION = 1;
    // Read off the syntax tree because the adapter did not resolve it — a call on an untyped
    // receiver matched by name. Repeatable, and still capable of being wrong.
    SYNTAX = 2;
    // A guess, with `confidence` saying how good a one. Required there and meaningless
    // elsewhere.
    HEURISTIC = 3;
  }
  // The symbol the edge starts at.
  string from = 1;
  // What the edge is in this adapter's vocabulary, such as `import`, `use`, or `implements`.
  string kind = 2;
  // Portable classification, so a query for `imports` finds local kinds such as `import` and
  // `use` alike.
  repeated RelationshipFacet facets = 3;
  // The symbol the edge points at. One Rift cannot read carries the `external` origin; the edge
  // is the same either way.
  string to = 4;
  // The nodes this edge was read from.
  repeated string evidence = 5;
  Derivation derivation = 6;
  // How likely a `heuristic` edge is to hold, from 0 to 1. Absent for any other derivation.
  optional double confidence = 7;
  // Edge facts the model has no field for, namespaced by the adapter that emitted them.
  Extensions extensions = 8;
}
// A predicate over a standard, namespaced substrate, or diagnostic field. Rift evaluates the
// regex operation under `rift-regex`, including filters nested in
// `StructuralCaptureConstraint.semantic`. Structural patterns and path selectors carry separate
// grammars.
message FieldFilter {
  // How the operand is compared against the field. What a comparison means follows the field's
  // type, so ordering ops apply only where the values are ordered.
  enum Op {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The field equals the operand.
    EQ = 1;
    // The field does not equal the operand.
    NE = 2;
    // The field equals one of `values`. Against an array field it holds at least one of them,
    // which is how `facets` is asked for any of several at once.
    IN = 3;
    // The field holds the operand: a substring of a string, a member of an array such as
    // `facets`.
    CONTAINS = 4;
    // The field is a string starting with the operand.
    PREFIX = 5;
    // The field matches the `rift-regex` expression in the operand. Rift evaluates it.
    REGEX = 6;
    // The field is greater than the operand.
    GT = 7;
    // The field is greater than or equal to the operand.
    GTE = 8;
    // The field is less than the operand.
    LT = 9;
    // The field is less than or equal to the operand.
    LTE = 10;
    // The field is present at all. No operand is read.
    EXISTS = 11;
  }
  // Which field to test, by its name in this model: `facets`, `origin.kind`, `severity`.
  // Extension keys and diagnostic fields are addressed the same way.
  string field = 1;
  // How the operand is compared against the field. What a comparison means follows the field's
  // type, so ordering ops apply only where the values are ordered. An array field such as
  // `facets` takes `contains`, `in` and `exists`; the rest have no meaning against a list and
  // Rift rejects them.
  Op op = 2;
  // The operand, for every op except `in` and `exists`.
  optional google.protobuf.Value value = 3;
  // The operands for `in`.
  repeated google.protobuf.Value values = 4;
}
// A predicate over an exact advertised relationship kind or portable facet.
message RelationFilter {
  // One portable category an edge falls into. The local kinds `import` and `use` can share the
  // `imports` facet, which lets one query cross languages.
  enum RelationshipFacet {
    // The caller did not set a value.
    RELATIONSHIP_FACET_UNSPECIFIED = 0;
    // `from` lexically holds `to` — a module and the functions written in it.
    RELATIONSHIP_FACET_CONTAINS = 1;
    // `from` owns `to`. A class carries this to its methods even where the language writes them
    // outside its body.
    RELATIONSHIP_FACET_DECLARES = 2;
    // `from` adds members to `to`, which is declared elsewhere — a Rust `impl` block, a
    // TypeScript `declare module`, an `ALTER TABLE`, a CSS rule for a selector another file
    // already styles.
    RELATIONSHIP_FACET_AUGMENTS = 3;
    // `from` mentions `to` somewhere in the source and nothing narrower fits. The fallback edge
    // where there is a node to point at.
    RELATIONSHIP_FACET_REFERENCES = 4;
    // `from` invokes `to`.
    RELATIONSHIP_FACET_CALLS = 5;
    // `from` creates an instance of `to`.
    RELATIONSHIP_FACET_CONSTRUCTS = 6;
    // `from` takes the value of `to`. A SQL `SELECT` against a table is this edge.
    RELATIONSHIP_FACET_READS = 7;
    // `from` assigns to `to`. A SQL `INSERT`, `UPDATE` or `DELETE` is this edge.
    RELATIONSHIP_FACET_WRITES = 8;
    // `from` brings `to` in from another unit. A header or a stylesheet that declares nothing
    // of its own is a synthetic `module` symbol, so `#include` and `@import` are the same edge
    // as a Python `import`.
    RELATIONSHIP_FACET_IMPORTS = 9;
    // `from` makes `to` visible outside its unit.
    RELATIONSHIP_FACET_EXPORTS = 10;
    // `from` inherits from `to`.
    RELATIONSHIP_FACET_EXTENDS = 11;
    // `from` satisfies the contract `to` declares.
    RELATIONSHIP_FACET_IMPLEMENTS = 12;
    // `to` is the type of `from`. What jump-to-type-definition follows.
    RELATIONSHIP_FACET_HAS_TYPE = 13;
    // `from` replaces an inherited `to`.
    RELATIONSHIP_FACET_OVERRIDES = 14;
    // `from` is another name for `to` — a type alias, a re-export, an `as` rename.
    RELATIONSHIP_FACET_ALIASES = 15;
    // `to` was produced from `from` by a build step, so editing `to` lasts until the next
    // build.
    RELATIONSHIP_FACET_GENERATES = 16;
    // `from` needs `to` and there is no place in the source to point at — a manifest entry, a
    // build dependency. The coarsest edge there is.
    RELATIONSHIP_FACET_DEPENDS_ON = 17;
    // `to` is attached to `from` as metadata: an annotation, a decorator, an attribute.
    RELATIONSHIP_FACET_ANNOTATED_BY = 18;
    // `from` can raise `to`.
    RELATIONSHIP_FACET_THROWS = 19;
    // `from` handles `to` when something it calls raises it.
    RELATIONSHIP_FACET_CATCHES = 20;
    // `from` is constrained to satisfy `to` — the `Serialize` in `T: Serialize`, the
    // `Comparable` in `<T extends Comparable<T>>`.
    RELATIONSHIP_FACET_BOUNDED_BY = 21;
    // `from` applies `to` as a type argument — the `Config` in `Vec<Config>`.
    RELATIONSHIP_FACET_INSTANTIATES = 22;
    // `from` is a narrower form of `to`, chosen over it where both match.
    RELATIONSHIP_FACET_SPECIALIZES = 23;
    // `from` and `to` share a name and differ in signature, and the language picks between them
    // at the call site.
    RELATIONSHIP_FACET_OVERLOADS = 24;
    // `from` takes members from `to` by linearization — a Dart `with` clause, a Scala mixin.
    // The order they are written in decides which one wins.
    RELATIONSHIP_FACET_MIXES_IN = 25;
    // `from` holds `to` and promotes its members, so they are reachable without naming the
    // field. Go struct embedding.
    RELATIONSHIP_FACET_EMBEDS = 26;
    // `from` exercises `to`. A test that reaches its target through reflection or HTTP has no
    // call edge to carry it.
    RELATIONSHIP_FACET_TESTS = 27;
    // `from` supplies configuration `to` reads — a `rift.toml` key and the field it fills, a
    // `tsconfig` path alias and the module it resolves.
    RELATIONSHIP_FACET_CONFIGURES = 28;
    // `from` names `to` across a language boundary: a `className` and the CSS rule it selects,
    // an ORM entity and its table.
    RELATIONSHIP_FACET_BINDS = 29;
  }
  // Which way the edge runs, seen from the entity being filtered.
  enum Direction {
    // The caller did not set a value.
    DIRECTION_UNSPECIFIED = 0;
    // Edges that start at the entity — what it calls, imports, extends.
    DIRECTION_OUTGOING = 1;
    // Edges that point at it — its callers, its implementors.
    DIRECTION_INCOMING = 2;
    // Edges in both directions.
    DIRECTION_EITHER = 3;
  }
  // Whether a match needs such an edge, or needs there to be none.
  enum Quantifier {
    // The caller did not set a value.
    QUANTIFIER_UNSPECIFIED = 0;
    // At least one edge matches.
    QUANTIFIER_EXISTS = 1;
    // No edge matches. How "a symbol nothing calls" is written. It applies after the depth
    // bound, so `max_depth: 3` asks about edges within three hops and says nothing about the
    // fourth.
    QUANTIFIER_NOT_EXISTS = 2;
  }
  // Exact relationship kinds advertised by an adapter. Any listed kind matches.
  repeated string kind = 1;
  // Portable relationship facets. Any listed facet matches.
  repeated RelationshipFacet facet = 2;
  Direction direction = 3;
  // What has to be true of the entity at the other end. Nesting a filter here is how "callers
  // that are tests" becomes one query.
  optional Filter target = 4;
  // How many edges to walk before a hit counts. Above 1 this asks about indirect neighbours and
  // skips the direct ones.
  optional int64 min_depth = 5;
  // How many edges a traversal may cross. Call graphs contain cycles and can span the
  // workspace, so every traversal has this bound. Only edges that compose carry a depth —
  // `contains`, `declares`, `augments`, `calls`, `imports`, `extends`, `implements`,
  // `mixes_in`, `embeds`, `depends_on`. A bound above 1 on any other facet has nothing to walk,
  // and Rift rejects it.
  optional int64 max_depth = 6;
  // Whether a match needs such an edge, or needs there to be none.
  optional Quantifier quantifier = 7;
}
// A predicate over one entry of a list-valued field. `Symbol.types` holds several entries, and
// a filter that tests `role` and the resolved symbol separately would accept a symbol whose
// return type and whose `Config` came from two different entries. Everything under `where`
// addresses one entry, so both have to hold of the same one.
message ElementFilter {
  // The list-valued field to walk, by its name in this model: `types`, `signatures`.
  string field = 1;
  // What one entry has to satisfy. Field names inside address the entry, not the entity that
  // holds it.
  Filter where = 2;
}
// A test on one field of the entity.
message FilterField {
  // The field and the comparison.
  FieldFilter field = 1;
}
// A test on one entry of a list the entity holds.
message FilterElement {
  // The list to walk, and what one of its entries has to satisfy.
  ElementFilter element = 1;
}
// A test on the edges the entity has.
message FilterRelation {
  // The edges to look for, and what they must reach.
  RelationFilter relation = 1;
}
// Conjunction: every member has to hold.
message FilterAll {
  // The filters that must all hold.
  repeated Filter all = 1;
}
// Disjunction: at least one member has to hold.
message FilterAny {
  // The filters, of which one is enough.
  repeated Filter any = 1;
}
// Negation of what it holds.
message FilterNot {
  // The filter being negated.
  Filter not = 1;
}
// A recursive typed predicate. Every branch is tagged, so a filter tree parses in one pass.
message Filter {
  oneof variant {
    FilterField field = 1;
    FilterRelation relation = 2;
    FilterAll all = 3;
    FilterAny any = 4;
    FilterNot not = 5;
    FilterElement element = 6;
  }
}
// A symbol, wherever it happens to be written. Addressed this way, a rename reaches every node
// the adapter knows about.
message AddressSymbol {
  // The symbol the operation applies to.
  string symbol = 1;
}
// One node of one file's syntax tree, optionally narrowed to one of its named parts.
message AddressNode {
  // One named part of a node. A language marks these out inside a declaration, so an operation
  // can address the body of a function without addressing its documentation.
  enum RegionRole {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // What an editor should select on arriving here: the name for a declaration, the whole node
    // otherwise.
    REGION_ROLE_SELECTION = 1;
    // The identifier alone. What a rename rewrites.
    REGION_ROLE_NAME = 2;
    // Everything before the body — the keyword, the name, the parameters, the return type.
    REGION_ROLE_HEADER = 3;
    // The implementation. Replacing it leaves the signature and the documentation standing.
    REGION_ROLE_BODY = 4;
    // What the node holds where its interior is not code: the text of a comment, the characters
    // inside a string.
    REGION_ROLE_CONTENT = 5;
    // The doc comment for this declaration. In most languages it sits outside the declaration,
    // which is why the node has to point at it.
    REGION_ROLE_DOCUMENTATION = 6;
    // The node with everything that belongs to it, documentation and annotations included. What
    // a delete should take.
    REGION_ROLE_ENCLOSING = 7;
  }
  // The node the operation applies to.
  string node = 1;
  // Which part of the node. Absent, the whole of it.
  optional RegionRole region = 2;
}
// A byte range, whether or not anything was parsed there. This is what addresses a `LICENSE`
// file, or a region of a file no adapter claims.
message AddressSource {
  // The file, and the bytes in it.
  SourceSpan span = 1;
}
// A result of a `StructuralQuery`, by the identity it came back with. That identity carries its
// source state; resolution returns `stale_match` when the session state has moved.
message AddressMatch {
  // The match, and the state it was found in.
  string match = 1;
  // Which named capture of the match. Null addresses the match itself.
  optional string capture = 2;
}
// Where an operation applies. Separate union branches distinguish a semantic symbol, a syntax
// node, a source range, and a retained match.
message Address {
  oneof variant {
    AddressSymbol symbol = 1;
    AddressNode node = 2;
    AddressSource source = 3;
    AddressMatch match = 4;
  }
}
// A condition one capture of a `StructuralQuery` has to meet. Constraints are where a pattern
// over syntax reaches the adapter's knowledge: match every call, then keep only the ones whose
// target carries the `test` facet.
message StructuralCaptureConstraint {
  // How many nodes the capture binds, which follows the sigil used in the pattern.
  enum Cardinality {
    // The caller did not set a value.
    CARDINALITY_UNSPECIFIED = 0;
    // Exactly one node, as `$NAME` binds.
    ONE = 1;
    // A run of nodes, as `$$$NAME` binds.
    MANY = 2;
  }
  // Portable structural facets used by filters and policy. `generated` and `test` also
  // constrain destructive operations, reference handling, and refactor scope.
  enum NodeFacet {
    // The caller did not set a value.
    NODE_FACET_UNSPECIFIED = 0;
    // Introduces a name without necessarily giving it a body — a prototype, an `extern` line.
    NODE_FACET_DECLARATION = 1;
    // Gives a name its body. Where jump-to-definition lands.
    NODE_FACET_DEFINITION = 2;
    // The implementation part of a declaration, after its header.
    NODE_FACET_BODY = 3;
    // A run of statements that opens a scope, however the language delimits one.
    NODE_FACET_BLOCK = 4;
    // One step of execution.
    NODE_FACET_STATEMENT = 5;
    // Something that evaluates to a value.
    NODE_FACET_EXPRESSION = 6;
    // A type as written, in a position where the language expects one.
    NODE_FACET_TYPE_EXPRESSION = 7;
    // Brings a name in from another unit.
    NODE_FACET_IMPORT = 8;
    // Makes a name visible outside this unit.
    NODE_FACET_EXPORT = 9;
    // A parameter as written in a declaration.
    NODE_FACET_PARAMETER = 10;
    // A value as written at a call site.
    NODE_FACET_ARGUMENT = 11;
    // Metadata attached to a declaration: a decorator, an attribute, a Java annotation.
    NODE_FACET_ANNOTATION = 12;
    // Text the adapter ignores. A doc comment carries this too; `RegionRole.documentation` is
    // what ties one to the declaration it describes.
    NODE_FACET_COMMENT = 13;
    // A name as written, whether it declares or refers.
    NODE_FACET_IDENTIFIER = 14;
    // A value written straight into the source — `42`, `true`.
    NODE_FACET_LITERAL = 15;
    // A destructuring or matching form: a `match` arm, a binding that pulls fields apart.
    NODE_FACET_PATTERN = 16;
    // Produced by a tool from something else in the workspace. Destructive policy gates on
    // this, because the next build overwrites whatever you write here.
    NODE_FACET_GENERATED = 17;
    // Part of the test suite. Refactor scope gates on this, so a change can be confined to
    // production code or carried across both.
    NODE_FACET_TEST = 18;
  }
  // Which metavariable of the pattern this constrains, written without the `$`.
  string capture = 1;
  Cardinality cardinality = 2;
  // The syntax kind the captured node has to be, in its grammar's own words.
  optional string exact_kind = 3;
  // A portable structural facet the captured node has to carry.
  optional NodeFacet facet = 4;
  // A `rift-regex` expression the capture's text must match. Rift evaluates it with Unicode
  // character classes, linear-time matching, and no look-around or backreferences.
  optional string text_regex = 5;
  // What has to be true of the symbol written at the capture. The adapter matches syntax; Rift
  // applies this, because only Rift holds the resolved facts.
  optional Filter semantic = 6;
}
// A text or structural pattern, tagged by the engine that evaluates it. Carrying the complete
// query lets a match key explain its own identity and lets a caller rerun it without retrieving
// hidden state.
message MatchQuery {
  oneof variant {
    StructuralQuery structural_query = 1;
    TextQuery text_query = 2;
  }
}
// Literal or regular-expression matching over any UTF-8 file. Rift evaluates this query even
// when no adapter claims the path. Matches are leftmost-first and non-overlapping. After an
// empty regular-expression match, scanning advances to the next UTF-8 boundary. The query
// carries its dialect so a stored match key remains self-contained.
message TextQuery {
  // How Rift interprets `pattern`.
  enum Mode {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Match the pattern bytewise, with no special characters or flags.
    LITERAL = 1;
    // Read the pattern using the advertised text-matching dialect and the initial flags below.
    REGEX = 2;
  }
  // Selects Rift's text matcher.
  string kind = 1;
  // Version of the query shape and pattern semantics.
  int64 version = 2;
  // Regular-expression grammar used in `regex` mode. The separate `version` field selects its
  // syntax and match semantics. Version 1 has Unicode character classes, linear-time matching,
  // and no look-around or backreferences. Protocol conformance fixtures define accepted syntax
  // and match selection.
  string dialect = 3;
  Mode mode = 4;
  // Text to find in the selected grammar.
  string pattern = 5;
  // Initial case-sensitivity for regular-expression mode. Inline flags may change it within the
  // pattern.
  bool case_sensitive = 6;
  // Whether `^` and `$` initially match line boundaries in regular-expression mode. Inline
  // flags may change it within the pattern.
  bool multiline = 7;
  // Files searched by this query.
  PathSelector paths = 8;
}
// Every node that writes one symbol.
message StructuralQueryWithinSymbol {
  string symbol = 1;
}
// One syntax subtree.
message StructuralQueryWithinNode {
  string node = 1;
}
// One source byte range.
message StructuralQueryWithinSource {
  SourceSpan span = 1;
}
// Optional source boundary for the search. A symbol selects its nodes. A node selects its
// syntax subtree. A span selects its bytes.
message StructuralQueryWithin {
  oneof variant {
    StructuralQueryWithinSymbol symbol = 1;
    StructuralQueryWithinNode node = 2;
    StructuralQueryWithinSource source = 3;
  }
}
// A syntax search parsed with the target language's grammar. `$NAME` stands for one node and
// `$$$NAME` for a run of nodes. Each adapter uses the shared capture, constraint, and result
// shapes.
message StructuralQuery {
  // Which match to keep when one encloses another, as a nested call chain does.
  enum Overlap {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep the enclosing match. A chain of nested calls reports once, at the top.
    OUTERMOST = 1;
    // Keep the enclosed match, and report the chain at its deepest point.
    INNERMOST = 2;
    // Keep every match that does not overlap one already kept.
    ALL_NON_OVERLAPPING = 3;
  }
  string kind = 1;
  // Which revision of the metavariable grammar the pattern is written in.
  int64 version = 2;
  // Which grammar parses `pattern`, and so which adapter runs the search.
  Language language = 3;
  // The pattern, in the target language's own syntax, with metavariables where the shape
  // matters and the text does not.
  string pattern = 4;
  // Which files to search.
  PathSelector paths = 5;
  // Optional source boundary for the search. A symbol selects its nodes. A node selects its
  // syntax subtree. A span selects its bytes.
  optional StructuralQueryWithin within = 6;
  // Conditions the captures have to meet. The pattern finds a shape; these narrow it to the
  // occurrences you meant.
  repeated StructuralCaptureConstraint constraints = 7;
  Overlap overlap = 8;
  // Query fields the model has no place for, namespaced by the adapter that reads them.
  Extensions extensions = 9;
}
// One named capture of a match, and the bytes it bound.
message Capture {
  // Which metavariable of the pattern bound these bytes.
  string name = 1;
  // Where it bound. A capture that matched a run of nodes has one span per node.
  repeated SourceSpan spans = 2;
  // The source it bound, as written.
  string text = 3;
  // The node this capture landed on, or null when the capture is text and nothing was parsed —
  // as every text-regex capture is. What the node means is read through `Node.symbol`.
  optional string entity = 4;
}
// The ranges a replacement can be written over, computed by the adapter that parsed the match.
// Whether the trivia around a node belongs to the edit depends on what you are doing — deleting
// a list element has to take a separator with it — and only the grammar knows where that trivia
// ends.
message StructuralMatchRanges {
  // The node itself, with nothing around it. What a replacement in place writes over.
  SourceSpan exact = 1;
  // The node with the trivia in front of it: the indentation on its line, a separator that
  // precedes it.
  SourceSpan leading = 2;
  // The node with what follows it: a trailing comma, the newline that ends its line.
  SourceSpan trailing = 3;
  // The node with the trivia on either side. Deleting this leaves no blank line and no orphaned
  // separator.
  SourceSpan both = 4;
}
// A second place the adapter wants you to look — the earlier declaration a redefinition
// conflicts with, the bound that failed. It carries a message and a location, and never a
// severity of its own, because it is part of one finding.
message DiagnosticRelated {
  // What to notice there — "first defined here", "required by this bound".
  string message = 1;
  // Where to look.
  SourceSpan span = 2;
}
// One finding an adapter produced from source. Its code and message retain the adapter's
// vocabulary.
message Diagnostic {
  // How much a `Diagnostic` matters, in the adapter's own judgement. Adapters map their
  // toolchain's own levels onto these four, so a caller can drop everything below `warning`
  // without knowing which language produced it.
  enum Severity {
    // The caller did not set a value.
    SEVERITY_UNSPECIFIED = 0;
    // The adapter would not accept the code. Facts read from around it may be missing.
    SEVERITY_ERROR = 1;
    // The code compiles and the adapter thinks it is wrong anyway.
    SEVERITY_WARNING = 2;
    // Something worth knowing that is not a defect.
    SEVERITY_INFO = 3;
    // A suggestion, usually with a code action behind it.
    SEVERITY_HINT = 4;
  }
  enum Tag {
    // The caller did not set a value.
    TAG_UNSPECIFIED = 0;
    // The code still works and is marked for removal.
    TAG_DEPRECATED = 1;
    // The code has no effect — an unused import, an unreachable branch.
    TAG_UNNECESSARY = 2;
  }
  // Whether the facts around this finding came off a clean parse.
  enum Reliability {
    // The caller did not set a value.
    RELIABILITY_UNSPECIFIED = 0;
    // The adapter parsed the file. Facts around this finding stand.
    RELIABILITY_RELIABLE = 1;
    // The parser repaired the source to keep going, so the tree here is a guess and so is
    // anything read from it.
    RELIABILITY_RECOVERED = 2;
  }
  // Whether the finding is an artefact of source that stops mid-way, which is the normal state
  // of a file an agent is halfway through writing.
  enum Continuation {
    // The caller did not set a value.
    CONTINUATION_UNSPECIFIED = 0;
    // Appending source can make it go away: an unclosed brace, a statement cut off at the end
    // of the file.
    CONTINUATION_REPAIRABLE = 1;
    // It stands whatever follows.
    CONTINUATION_UNREPAIRABLE = 2;
    // The adapter does not say.
    CONTINUATION_UNKNOWN = 3;
  }
  // How much it matters.
  Severity severity = 1;
  // The adapter's own identifier for this finding — `TS2345`, `E0308`. Null where the adapter
  // issues none.
  optional string code = 2;
  // What the adapter said, in its own words.
  string message = 3;
  // Where it applies. Null for a finding about the file as a whole, or about the build.
  optional SourceSpan span = 4;
  // Other places the adapter pointed at while explaining this one.
  repeated DiagnosticRelated related = 5;
  // Presentation tags for the finding. An editor can render them as strikethrough or grey text.
  repeated Tag tags = 6;
  Reliability reliability = 7;
  Continuation continuation = 8;
  // Diagnostic fields the model has no place for, namespaced by the adapter that emitted them.
  Extensions extensions = 9;
  // Which adapter produced this. Null for a finding Rift itself raised.
  optional Language language = 10;
}
// One adapter's verdict over a resulting tree. `coverage` states how much the adapter checked,
// while `valid` records whether the checked scope contains an error. `validation.require` in
// the workspace-root `rift.toml` decides which reports are required.
message ValidationReport {
  // The adapter that produced this verdict.
  Language language = 1;
  // Whether this adapter accepted every file in `files` under the reported coverage.
  bool valid = 2;
  // How much of the affected program the adapter checked. The result is incomplete when
  // `validation.require` names this language and coverage is partial or unsupported.
  Coverage coverage = 3;
  // Affected files this verdict covers, sorted by project path.
  repeated string files = 4;
  // Adapter findings produced while checking the resulting tree, sorted by file and source
  // range.
  repeated Diagnostic diagnostics = 5;
}
// How many matches an atomic rewrite accepts. Rift counts the matches in the projection as it
// stands and refuses the operation when the count falls outside this interval, so a pattern
// that is looser than the caller believed rewrites nothing.
message MatchCardinality {
  // Fewest matches required.
  int64 minimum = 1;
  // Most matches accepted. Null leaves the match count unbounded, and `max_rewrite_expansions`
  // still caps the concrete edits the expansion may produce.
  optional int64 maximum = 2;
}
// The project source an action may inspect or change. Dependencies remain readable adapter
// input and are never editable through this scope.
message OperationScope {
  // How source carrying the `test` node facet participates.
  enum Tests {
    // The caller did not set a value.
    TESTS_UNSPECIFIED = 0;
    // Do not inspect or change test source.
    TESTS_EXCLUDE = 1;
    // Treat production and test source as one action scope.
    TESTS_INCLUDE = 2;
    // Confine the action to test source.
    TESTS_ONLY = 3;
  }
  // How source carrying the `generated` node facet participates.
  enum Generated {
    // The caller did not set a value.
    GENERATED_UNSPECIFIED = 0;
    // Refuse an action whose complete effect requires generated source.
    GENERATED_EXCLUDE = 1;
    // Permit generated source and require a `generated_code` confirmation.
    GENERATED_INCLUDE = 2;
  }
  // Project paths eligible for the action. Every resolved edit must remain inside this
  // selector.
  PathSelector paths = 1;
  Tests tests = 2;
  Generated generated = 3;
}
// How an adapter may eliminate each remaining use while deleting a declaration. Every field
// holds a `Disposition`, one per class of use. Complete reference coverage is mandatory.
message SafeDeletePolicy {
  // How a safe delete eliminates one classified remaining use.
  enum Disposition {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Stop the whole deletion while such a use exists.
    DISPOSITION_REFUSE = 1;
    // Replace the use with a valid form the adapter selects.
    DISPOSITION_REWRITE = 2;
    // Delete the construct containing the use, at a safe boundary the adapter selects.
    DISPOSITION_REMOVE = 3;
  }
  // Disposition for reads, calls, and constructions.
  Disposition reads = 1;
  // Disposition for assignments and other writes.
  Disposition writes = 2;
  // Disposition for imports, exports, aliases, and re-exports.
  Disposition imports = 3;
  // Disposition for overrides, implementations, and inherited declarations.
  Disposition overrides = 4;
  // Disposition for adapter-resolved uses in generated source. Scope must also permit generated
  // files.
  Disposition generated = 5;
  // Disposition for adapter-classified string references such as reflection names. Unclassified
  // strings are outside the reference set and cannot be claimed by a guarantee.
  Disposition strings = 6;
  // Disposition for complete adapter-resolved uses not covered above.
  Disposition other = 7;
}
// The desired callable shape for a structured signature action. Existing parameters retain
// identity through `Parameter.node`; a parameter without a node is new. Language constructs
// outside this shape travel in `extensions` under an advertised versioned schema.
message SignatureChange {
  // Declarations and calls the adapter must update with the signature.
  enum Propagation {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Change only the selected declaration and refuse when existing uses would become invalid.
    DECLARATION = 1;
    // Update the declaration and every resolved call site.
    CALLERS = 2;
    // Update the declaration and its complete override or implementation family.
    OVERRIDES = 3;
    // Update the declaration, callers, overrides, and implementations.
    ALL = 4;
  }
  // Desired implicit receiver, or null for a free callable.
  optional Parameter receiver = 1;
  // Desired parameters in declaration order. Reordering existing nodes preserves their identity
  // while changing their position.
  repeated Parameter parameters = 2;
  // Desired declared return bindings.
  repeated TypeBinding returns = 3;
  // Desired existing generic parameters in order. Creating a language-specific generic
  // parameter uses `extensions`.
  repeated string type_parameters = 4;
  // Desired declared error or exception types.
  repeated TypeExpression throws = 5;
  // Desired language effect keywords, in the adapter's spelling.
  repeated string effects = 6;
  Propagation propagation = 7;
  // Versioned language-specific signature fields.
  Extensions extensions = 8;
}
// Portable arguments for `refactor.rename` actions.
message RenameArguments {
  // New source name. The adapter checks language spelling, collisions, visibility, and binding
  // changes.
  string name = 1;
  // Source eligible for propagation. Complete references outside it cause refusal.
  OperationScope scope = 2;
}
message MoveArgumentsDestinationAddress {
  // Existing semantic container that receives the moved declaration.
  Address address = 1;
}
message MoveArgumentsDestinationPath {
  // Project path that receives a file, module, or declaration supported by the language.
  string path = 1;
}
// Existing destination container or project path. Symbols use an Address; files and new modules
// use a ProjectPath.
message MoveArgumentsDestination {
  oneof variant {
    MoveArgumentsDestinationAddress address = 1;
    MoveArgumentsDestinationPath path = 2;
  }
}
// Portable arguments for `refactor.move` actions.
message MoveArguments {
  MoveArgumentsDestination destination = 1;
  // Source eligible for import and reference updates.
  OperationScope scope = 2;
}
// Portable arguments for deleting a declaration. `policy` is what separates the two kinds of
// removal: without it the declaration goes and nothing analyses what referred to it, and with
// it the adapter must classify every remaining use and dispose of it as stated.
message SafeDeleteArguments {
  // Required behavior for every classified remaining use. Null removes the declaration without
  // reference analysis, which claims no reference guarantee and reports no remaining-usage
  // precondition.
  optional SafeDeletePolicy policy = 1;
  // Source in which complete usage analysis and any requested rewrite may occur.
  OperationScope scope = 2;
}
// Portable arguments for `refactor.change_signature` actions.
message ChangeSignatureArguments {
  // Desired callable structure and propagation policy.
  SignatureChange signature = 1;
  // Source eligible for caller and override propagation.
  OperationScope scope = 2;
}
// Arguments conform to RenameArguments at the stated contract version.
message ArgumentContractRename {
  int64 version = 1;
}
// Arguments conform to MoveArguments at the stated contract version.
message ArgumentContractMove {
  int64 version = 1;
}
// Arguments conform to SafeDeleteArguments at the stated contract version.
message ArgumentContractSafeDelete {
  int64 version = 1;
}
// Arguments conform to ChangeSignatureArguments at the stated contract version.
message ArgumentContractChangeSignature {
  int64 version = 1;
}
// A portable argument contract attached to a discovered adapter action. Its stable name and
// numeric version are separate fields. The descriptor's self-contained schema may narrow the
// selected contract for one language without changing its field meanings.
message ArgumentContract {
  oneof variant {
    ArgumentContractRename rename = 1;
    ArgumentContractMove move = 2;
    ArgumentContractSafeDelete safe_delete = 3;
    ArgumentContractChangeSignature change_signature = 4;
  }
}
// A language adapter ran the check against its own analysis.
message OperationVerifierAdapter {
  // The language whose adapter performed the check.
  Language language = 1;
}
// One workspace command validator checked a changed tree.
message OperationVerifierValidator {
  // The `CommandValidator.id` of the workspace validator that ran the check.
  string validator = 1;
}
// The component that checked a precondition or established a guarantee.
message OperationVerifier {
  oneof variant {
    google.protobuf.Empty rift = 1;
    OperationVerifierAdapter adapter = 2;
    OperationVerifierValidator validator = 3;
  }
}
// Boolean property such as target existence or writability.
message PreconditionValueBoolean {
  bool value = 1;
}
// Non-negative count such as remaining usages.
message PreconditionValueCount {
  int64 value = 1;
}
// Coverage required or observed for an adapter fact family.
message PreconditionValueCoverage {
  Coverage value = 1;
}
// Language or policy value whose spelling is itself significant.
message PreconditionValueText {
  string value = 1;
}
// A typed value compared by an operation precondition.
message PreconditionValue {
  oneof variant {
    PreconditionValueBoolean boolean = 1;
    PreconditionValueCount count = 2;
    PreconditionValueCoverage coverage = 3;
    PreconditionValueText text = 4;
  }
}
// One executable condition checked while resolving an operation. Expected and observed values
// carry explicit value tags.
message OperationPrecondition {
  // Condition being checked.
  enum Kind {
    // The caller did not set a value.
    KIND_UNSPECIFIED = 0;
    // Every addressed symbol, node, match, or source range resolves in the projection as it
    // stands.
    KIND_TARGET_EXISTS = 1;
    // The files a match or action offer was discovered in have not been rewritten since.
    KIND_SOURCE_UNCHANGED = 2;
    // Every affected path is inside the project and writable through Rift's workspace handle.
    KIND_WRITABLE = 3;
    // The adapter completely classified the references on which the operation depends.
    KIND_REFERENCES_COMPLETE = 4;
    // No usage remains after the selected safe-delete policy is applied.
    KIND_NO_REMAINING_USAGES = 5;
    // The requested path or semantic container can receive the moved or created entity.
    KIND_DESTINATION_LEGAL = 6;
    // The requested name creates no forbidden collision or binding change.
    KIND_NAME_AVAILABLE = 7;
    // An adapter-defined condition described by diagnostics and extension data.
    KIND_LANGUAGE_CONDITION = 8;
  }
  // Result of this check.
  enum Status {
    // The caller did not set a value.
    STATUS_UNSPECIFIED = 0;
    STATUS_SATISFIED = 1;
    STATUS_FAILED = 2;
  }
  Kind kind = 1;
  Status status = 2;
  // Component that performed the check.
  OperationVerifier verifier = 3;
  // Existing semantic or source subjects involved in the condition.
  repeated Address addresses = 4;
  // Project paths involved in the condition, including destinations that do not yet exist.
  repeated string paths = 5;
  // Required value. Examples include zero remaining usages or complete coverage.
  PreconditionValue expected = 6;
  // Value found while checking the condition.
  PreconditionValue observed = 7;
  // Adapter or Rift findings that explain the observed value.
  repeated Diagnostic diagnostics = 8;
}
// Existing semantic or source target.
message OperationBlockerAddress {
  Address address = 1;
}
// Project path involved in a collision, ownership refusal, or illegal destination.
message OperationBlockerPath {
  string path = 1;
}
// Adapter relationship the operation could not preserve or rewrite.
message OperationBlockerRelationship {
  Relationship relationship = 1;
}
// A concrete subject preventing resolution. The union admits existing code, a path that may not
// exist, or the adapter edge that cannot be changed safely.
message OperationBlocker {
  oneof variant {
    OperationBlockerAddress address = 1;
    OperationBlockerPath path = 2;
    OperationBlockerRelationship relationship = 3;
  }
}
// One semantic consequence of a resolved change. Exact bytes remain in `Edit`; this record
// explains what those bytes did to declarations and resolved relationships.
message OperationEffect {
  // Portable consequence of the change.
  enum Kind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    DECLARATION_CREATED = 1;
    DECLARATION_REMOVED = 2;
    DECLARATION_MOVED = 3;
    DECLARATION_CHANGED = 4;
    REFERENCES_UPDATED = 5;
    IMPORTS_UPDATED = 6;
    SOURCE_REWRITTEN = 7;
    FORMATTING_APPLIED = 8;
  }
  Kind kind = 1;
  // Subjects in the state before this change. Empty for creation.
  repeated Address before = 2;
  // Subjects after Rift applies the change and every adapter sharing the projection
  // acknowledges the change. Empty for deletion.
  repeated Address after = 3;
  // Source locations demonstrating the effect, pinned to their respective before or after
  // address state.
  repeated SourceSpan spans = 4;
  // Concrete account of the semantic consequence.
  string detail = 5;
}
// Evidence establishing an action-advertised or caller-declared guarantee for a resolved
// change. The record supplies its scope, verifier, method, and findings.
message GuaranteeEvidence {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    GUARANTEE_KIND_UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or command validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // How the property was established.
  enum Method {
    // The caller did not set a value.
    METHOD_UNSPECIFIED = 0;
    // Rift established the property directly from its closed edit and transaction rules.
    CONSTRUCTION = 1;
    // The language adapter or resolver checked the transformed program.
    ADAPTER = 2;
    // A named language analysis checked a property narrower than compilation.
    STATIC_ANALYSIS = 3;
    // A workspace command validator checked the changed tree.
    VALIDATOR = 4;
  }
  GuaranteeKind kind = 1;
  // Source over which the guarantee holds.
  CoverageScope scope = 2;
  // Component that established the property.
  OperationVerifier verifier = 3;
  Method method = 4;
  // Exact property checked and any limit on its interpretation.
  string detail = 5;
  // Findings produced while establishing the guarantee.
  repeated Diagnostic diagnostics = 6;
}
// One effect the caller has to accept before publication. The change that raised it lands in
// the projection either way, carrying this record, so the caller can read what happened before
// deciding. Requirements are sorted by kind, source location, title, and detail within their
// change.
message ConfirmationRequirement {
  // The condition that makes acceptance necessary.
  enum Kind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The change deletes source or replaces an existing file.
    DESTRUCTIVE = 1;
    // The change reaches enough files or symbols to require explicit acceptance.
    LARGE_SCOPE = 2;
    // The change touches source marked as generated.
    GENERATED_CODE = 3;
    // The adapter found a reference it could not classify or update.
    UNRESOLVED_REFERENCE = 4;
    // Adapter checks establish validity but do not establish equivalent behavior.
    BEHAVIOR_UNKNOWN = 5;
    // Formatting reaches outside the changed syntactic regions.
    FORMATTING_SCOPE = 6;
    // A workspace command validator will check the changed tree.
    COMMAND_VALIDATOR = 7;
    // Required adapter or command validation did not complete over the resulting tree.
    VALIDATION_INCOMPLETE = 8;
    // The action advertised a guarantee that resolution produced no evidence for.
    GUARANTEE_UNESTABLISHED = 9;
  }
  Kind kind = 2;
  // A short account of the effect being accepted.
  string title = 3;
  // The concrete consequence, including the scope or unresolved item that triggered it.
  string detail = 4;
  // Source locations that demonstrate the effect. Empty where the condition applies to the
  // resulting tree as a whole.
  repeated SourceSpan spans = 5;
}
// One adapter action family advertised for a language. The prefix supports planning. Discovery
// still decides whether the family applies at an address.
message ActionSupport {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or command validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // Supported action kind prefix, such as `refactor.rename` or `quickfix`.
  string kind = 1;
  // Languages, files, or constructs for which this family can be discovered and resolved.
  Coverage coverage = 2;
  // Guarantee kinds this family may advertise. Each discovered action states its actual subset.
  repeated GuaranteeKind guarantees = 3;
}
// An adapter's portable description of one discovered operation. Listing carries no edits
// because resolution computes only the selected action.
message ActionDescriptor {
  // How much has to be checked before applying it.
  enum Applicability {
    // The caller did not set a value.
    APPLICABILITY_UNSPECIFIED = 0;
    // The adapter needs no caller-supplied fact before resolution. Result validation and
    // advertised guarantees still apply.
    ALWAYS = 1;
    // Correct only under a condition the adapter cannot establish. The condition appears in the
    // resolved preconditions or confirmations.
    CONDITIONAL = 2;
    // The adapter inferred intent from incomplete target evidence. The caller inspects the
    // resolved change's effects before accepting it.
    SPECULATIVE = 3;
  }
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    GUARANTEE_KIND_UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or command validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // What the action is called, in the words the adapter would show a person.
  string title = 1;
  // What this action does. Filtering by prefix is what makes it useful: an agent that wants a
  // fix asks for `quickfix` and never sees a refactor.
  string kind = 2;
  // Whether the adapter ranks this as the preferred action at the target. At most one action in
  // a list is preferred.
  bool preferred = 3;
  Applicability applicability = 4;
  // Why the adapter is offering it here.
  string rationale = 5;
  // What the action applies to.
  Address target = 6;
  // Portable argument shape used by a standard refactor, or null when the adapter's
  // self-contained schema is the complete contract.
  optional ArgumentContract argument_contract = 7;
  // JSON Schema draft 2020-12 for the arguments this action takes. Remote references are
  // forbidden. When `argument_contract` is set, this schema may add language constraints while
  // preserving the portable fields and meanings. An adapter always supplies it; Rift leaves it
  // null in a listing page and carries it in the read of one offer, so a caller fetches one
  // schema rather than a schema per offer.
  optional google.protobuf.Struct arguments_schema = 8;
  // Properties this action promises to establish when resolution succeeds. Resolve must return
  // one complete `GuaranteeEvidence` entry for every kind listed here.
  repeated GuaranteeKind guarantees = 9;
  // Why the action cannot run right now, where the adapter lists it but refuses it. Null when
  // it can run.
  optional string disabled_reason = 10;
  // The findings this action would clear. Empty for an action nothing reported.
  repeated Diagnostic diagnostics = 11;
  // Action fields the model has no place for, namespaced by the adapter that emitted them.
  Extensions extensions = 12;
}
// Coverage for every fact family. Absence is authoritative only where state is complete.
message SemanticCoverage {
  map<string, Coverage> entries = 1;
}
// Caller-provided source evaluated against a session projection. It is never written back
// to that projection.
message CodeBlock {
  // UTF-8 source to evaluate as one language-specific block.
  string source = 1;
  // Project-relative directory used as the evaluation working directory. The empty path selects
  // the project root. It must name a directory in the projection.
  optional string working_directory = 2;
}
// A bounded UTF-8 rendering of bytes. Invalid byte sequences become U+FFFD. The digest
// covers the complete raw value, including bytes beyond the captured prefix.
message CapturedText {
  // Decoded captured prefix.
  string text = 1;
  // Raw bytes represented by `text` before replacement decoding.
  int64 captured_bytes = 2;
  // Raw bytes in the complete value.
  int64 total_bytes = 3;
  // Whether bytes after the captured prefix were omitted from `text`.
  bool truncated = 4;
  // SHA-256 of the complete raw value.
  string digest = 5;
}
// Exact server-selected bounds an adapter must enforce for one code-block evaluation.
// The gRPC deadline may be shorter than `timeout_ms`; whichever expires first governs.
message ExecutionBudget {
  // Maximum evaluation wall time in milliseconds.
  int64 timeout_ms = 1;
  // Captured prefix limit applied separately to stdout and stderr.
  int64 output_bytes = 2;
}
// Execution and retained-frame bounds for one debugging session.
message DebugBudget {
  // Bounds for running and capturing the debugging evaluation.
  ExecutionBudget execution = 1;
  // Maximum stack frames the adapter may retain, innermost first.
  int64 frames = 2;
  // Maximum arguments plus locals returned for one frame.
  int64 bindings_per_frame = 3;
  // Captured prefix limit for each rendered debug binding value.
  int64 value_bytes = 4;
}
// The complete bounded observation of one code-block evaluation.
message ExecutionResult {
  // How evaluation of a code block ended. Infrastructure, cancellation, and deadline failures
  // remain protocol errors rather than execution statuses.
  enum ExecutionStatus {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The code block returned normally.
    EXECUTION_STATUS_COMPLETED = 1;
    // The language runtime rejected the block or raised an unhandled failure.
    EXECUTION_STATUS_FAILED = 2;
  }
  // Whether the language runtime completed or failed the block.
  ExecutionStatus status = 1;
  // Process exit status where the adapter used a process, or null for an in-process evaluator.
  // A nonzero value accompanies `failed`.
  optional int64 exit_code = 2;
  // Bounded standard output from the evaluation.
  CapturedText stdout = 3;
  // Bounded standard error from the evaluation.
  CapturedText stderr = 4;
  // Structured failures produced while compiling or evaluating the block.
  repeated Diagnostic diagnostics = 5;
}
// One visible name in a debug frame, rendered by the language adapter. Values are display
// text rather than a portable object graph; future expansion can add a separate child-value
// interface without changing frame identity.
message DebugBinding {
  // Name as the language presents it.
  string name = 1;
  // Adapter-rendered runtime type, or null when unavailable.
  optional string type = 2;
  // Bounded adapter-rendered value. Its digest identifies the complete rendering when the
  // session budget truncates it.
  CapturedText value = 3;
}
// One stack frame retained by a debugging session. Depth zero is the innermost frame at
// the inspection stop.
message DebugFrame {
  // Zero-based depth, with the innermost frame first.
  int64 depth = 1;
  // Function, method, or adapter-local frame name.
  string name = 2;
  // Source location in the projection, or null for runtime and synthetic code. The
  // caller-provided block itself has no source span.
  optional SourceSpan source = 3;
  // Visible arguments in adapter order.
  repeated DebugBinding arguments = 4;
  // Visible local bindings in adapter order.
  repeated DebugBinding locals = 5;
}
