message StructuralQuery {
  string kind = 1;
  // Which revision of the metavariable grammar the pattern is written in.
  int64 version = 2;
  // Which grammar parses `pattern`, and so which adapter runs the search.
  string language = 3;
  // The pattern, in the target language's own syntax, with metavariables where the shape
  // matters and the text does not.
  string pattern = 4;
  // Which files to search.
  PathSelector paths = 5;
  // Optional source boundary for the search. A symbol selects its leaves. A leaf selects its
  // syntax subtree. A span selects its bytes.
  optional StructuralQueryWithin within = 6;
  // Conditions the captures have to meet. The pattern finds a shape; these narrow it to the
  // occurrences you meant.
  repeated StructuralCaptureConstraint constraints = 7;
  // Query fields the model has no place for, namespaced by the adapter that reads them.
  Extensions extensions = 9;
}
// One named capture of a match, and the bytes it bound.
message Capture {
  // Which metavariable of the pattern bound these bytes.
  string name = 1;
  // Where it bound. A capture that matched a run of nodes has one span per node.
  repeated SourceSpan spans = 2;
  // The source it bound, as written.
  string text = 3;
  // The leaf this capture landed on, or null when the capture is text and nothing was parsed —
  // as every text-regex capture is. What the leaf means is read through `Leaf.symbol`.
  optional string entity = 4;
}
// The ranges a replacement can be written over, computed by the adapter that parsed the match.
// Whether the trivia around a node belongs to the edit depends on what you are doing — deleting
// a list element has to take a separator with it — and only the grammar knows where that trivia
// ends.
message StructuralMatchRanges {
  // The node itself, with nothing around it. What a replacement in place writes over.
  SourceSpan exact = 1;
  // The node with the trivia in front of it: the indentation on its line, a separator that
  // precedes it.
  SourceSpan leading = 2;
  // The node with what follows it: a trailing comma, the newline that ends its line.
  SourceSpan trailing = 3;
  // The node with the trivia on either side. Deleting this leaves no blank line and no orphaned
  // separator.
  SourceSpan both = 4;
}
// A second place the compiler wants you to look — the earlier declaration a redefinition
// conflicts with, the bound that failed. It carries a message and a location, and never a
// severity of its own, because it is part of one finding.
message DiagnosticRelated {
  // What to notice there — "first defined here", "required by this bound".
  string message = 1;
  // Where to look.
  SourceSpan span = 2;
}
// One thing a compiler said about the source. The message and the code are passed through in
// the compiler's own words, because a normalised message loses the detail that makes it
// actionable.
message Diagnostic {
  // How much a `Diagnostic` matters, in the compiler's own judgement. Adapters map their
  // compiler's levels onto these four, so a caller can drop everything below `warning` without
  // knowing which language produced it.
  enum Severity {
    // The caller did not set a value.
    SEVERITY_UNSPECIFIED = 0;
    // The compiler would not accept the code. Facts read from around it may be missing.
    SEVERITY_ERROR = 1;
    // The code compiles and the compiler thinks it is wrong anyway.
    SEVERITY_WARNING = 2;
    // Something worth knowing that is not a defect.
    SEVERITY_INFO = 3;
    // A suggestion, usually with a code action behind it.
    SEVERITY_HINT = 4;
  }
  enum Tags {
    // The caller did not set a value.
    TAGS_UNSPECIFIED = 0;
    // The code still works and is marked for removal.
    TAGS_DEPRECATED = 1;
    // The code has no effect — an unused import, an unreachable branch.
    TAGS_UNNECESSARY = 2;
  }
  // How much it matters.
  Severity severity = 1;
  // The compiler's own identifier for this finding — `TS2345`, `E0308`. Null where the compiler
  // issues none.
  optional string code = 2;
  // What the compiler said, in its own words.
  string message = 3;
  // Where it applies. Null for a finding about the file as a whole, or about the build.
  optional SourceSpan span = 4;
  // Other places the compiler pointed at while explaining this one.
  repeated DiagnosticRelated related = 5;
  // Presentation tags for the finding. An editor can render them as strikethrough or grey text.
  repeated Tags tags = 6;
  // Diagnostic fields the model has no place for, namespaced by the adapter that emitted them.
  Extensions extensions = 9;
  // Which adapter produced this. Null for a finding Rift itself raised.
  optional string language = 10;
}
// One compiler's verdict over a candidate snapshot. `coverage` states how much the compiler
// checked, while `valid` records whether the checked scope contains an error. Publication
// requires complete coverage from every adapter that owns an affected file and a valid verdict
// from each of them.
message ValidationReport {
  // The adapter that produced this verdict.
  string language = 1;
  // Whether this compiler accepted every file in `files` under the reported coverage.
  bool valid = 2;
  // How much of the affected program the compiler checked. Publication refuses partial or
  // unsupported coverage where the change depends on that language.
  Coverage coverage = 3;
  // Affected files this verdict covers, sorted by project path.
  repeated string files = 4;
  // Compiler findings produced while checking the candidate, sorted by file and source range.
  repeated Diagnostic diagnostics = 5;
}
// How many matches an atomic rewrite accepts. Rift counts against the candidate state at that
// point in the ordered change list and refuses the whole preview when the count falls outside
// this interval.
message MatchCardinality {
  // Fewest matches required.
  int64 minimum = 1;
  // Most matches accepted. Null uses the workspace's `max_rewrite_expansions` limit.
  optional int64 maximum = 2;
}
// The project source an action may inspect or change. Dependencies remain readable compiler
// input and are never editable through this scope.
message OperationScope {
  // Project paths eligible for the action. Every resolved edit must remain inside this
  // selector.
  PathSelector paths = 1;
}
// How a compiler may eliminate each remaining use while deleting a declaration. `refuse` stops
// when that use exists, `rewrite` replaces it with a compiler-selected valid form, and `remove`
// deletes its containing construct at a compiler-selected safe boundary. Complete reference
// coverage is mandatory; any unresolved use refuses `refactor.safe_delete` before a candidate
// is built.
message SafeDeletePolicy {
}
// The desired callable shape for a structured signature action. Existing parameters retain
// identity through `Parameter.leaf`; a parameter without a leaf is new. Language constructs
// outside this shape travel in `extensions` under an advertised versioned schema.
message SignatureChange {
  // Desired implicit receiver, or null for a free callable.
  optional Parameter receiver = 1;
  // Desired parameters in declaration order. Reordering existing leaves preserves their
  // identity while changing their position.
  repeated Parameter parameters = 2;
  // Desired declared return bindings.
  repeated TypeBinding returns = 3;
  // Desired existing generic parameters in order. Creating a language-specific generic
  // parameter uses `extensions`.
  repeated string type_parameters = 4;
  // Desired declared error or exception types.
  repeated TypeExpression throws = 5;
  // Desired language effect keywords, in the adapter's spelling.
  repeated string effects = 6;
  // Versioned language-specific signature fields.
  Extensions extensions = 8;
}
// Portable arguments for `refactor.rename` actions.
message RenameArguments {
  // New source name. The compiler checks language spelling, collisions, visibility, and binding
  // changes.
  string name = 1;
  // Source eligible for propagation. Complete references outside it cause refusal.
  OperationScope scope = 2;
}
message MoveArgumentsDestinationAddress {
  // Existing semantic container that receives the moved declaration.
  Address address = 1;
}
message MoveArgumentsDestinationPath {
  // Project path that receives a file, module, or declaration supported by the language.
  string path = 1;
}
// Existing destination container or project path. Symbols use an Address; files and new modules
// use a ProjectPath.
message MoveArgumentsDestination {
  oneof variant {
    MoveArgumentsDestinationAddress address = 1;
    MoveArgumentsDestinationPath path = 2;
  }
}
// Portable arguments for `refactor.move` actions.
message MoveArguments {
  // Source eligible for import and reference updates.
  OperationScope scope = 2;
}
// Portable arguments for `refactor.safe_delete` actions.
message SafeDeleteArguments {
  // Required behavior for every classified remaining use.
  SafeDeletePolicy policy = 1;
  // Source in which complete usage analysis and any requested rewrite may occur.
  OperationScope scope = 2;
}
// Portable arguments for `refactor.change_signature` actions.
message ChangeSignatureArguments {
  // Desired callable structure and propagation policy.
  SignatureChange signature = 1;
  // Source eligible for caller and override propagation.
  OperationScope scope = 2;
}
// Arguments conform to RenameArguments at the stated contract version.
message ArgumentContractRename {
  int64 version = 1;
}
// Arguments conform to MoveArguments at the stated contract version.
message ArgumentContractMove {
  int64 version = 1;
}
// Arguments conform to SafeDeleteArguments at the stated contract version.
message ArgumentContractSafeDelete {
  int64 version = 1;
}
// Arguments conform to ChangeSignatureArguments at the stated contract version.
message ArgumentContractChangeSignature {
  int64 version = 1;
}
// A portable argument contract attached to a discovered compiler action. Its stable name and
// numeric version are separate fields. The descriptor's self-contained schema may narrow the
// selected contract for one language without changing its field meanings.
message ArgumentContract {
  oneof variant {
    ArgumentContractRename rename = 1;
    ArgumentContractMove move = 2;
    ArgumentContractSafeDelete safe_delete = 3;
    ArgumentContractChangeSignature change_signature = 4;
  }
}
// A language adapter checked compiler-owned state.
message OperationVerifierAdapter {
  // Adapter whose compiler performed the check.
  string language = 1;
}
// One caller-supplied sandbox validator checked the candidate.
message OperationVerifierValidator {
  // Zero-based position in the preview's validator declarations.
  int64 validator = 1;
}
// The component that checked a precondition or established a guarantee.
message OperationVerifier {
  oneof variant {
    google.protobuf.Empty rift = 1;
    OperationVerifierAdapter adapter = 2;
    OperationVerifierValidator validator = 3;
  }
}
// Boolean property such as target existence or writability.
message PreconditionValueBoolean {
  bool value = 1;
}
// Non-negative count such as remaining usages.
message PreconditionValueCount {
  int64 value = 1;
}
// Pinned project state used by stale-state checks.
message PreconditionValueSnapshot {
  Snapshot value = 1;
}
// Coverage required or observed for a compiler fact family.
message PreconditionValueCoverage {
  Coverage value = 1;
}
// Language or policy value whose spelling is itself significant.
message PreconditionValueText {
  string value = 1;
}
// A typed value compared by an operation precondition. The tag prevents a snapshot string, a
// name, and a count rendered as text from becoming indistinguishable.
message PreconditionValue {
  oneof variant {
    PreconditionValueBoolean boolean = 1;
    PreconditionValueCount count = 2;
    PreconditionValueSnapshot snapshot = 3;
    PreconditionValueCoverage coverage = 4;
    PreconditionValueText text = 5;
  }
}
// One executable condition checked during resolution and rechecked during publication. Expected
// and observed values carry explicit value tags.
message OperationPrecondition {
  // Component that performed the check.
  OperationVerifier verifier = 3;
  // Existing semantic or source subjects involved in the condition.
  repeated Address addresses = 4;
  // Project paths involved in the condition, including destinations that do not yet exist.
  repeated string paths = 5;
  // Required value. Examples include the discovered snapshot, zero remaining usages, or
  // complete coverage.
  PreconditionValue expected = 6;
  // Value found while checking the condition.
  PreconditionValue observed = 7;
  // Compiler or Rift findings that explain the observed value.
  repeated Diagnostic diagnostics = 8;
}
// Existing semantic or source target.
message OperationBlockerAddress {
  Address address = 1;
}
// Project path involved in a collision, ownership refusal, or illegal destination.
message OperationBlockerPath {
  string path = 1;
}
// Compiler relationship the operation could not preserve or rewrite.
message OperationBlockerRelationship {
  Relationship relationship = 1;
}
// A concrete subject preventing resolution. The union admits existing code, a path that may not
// exist, or the compiler edge that cannot be changed safely.
message OperationBlocker {
  oneof variant {
    OperationBlockerAddress address = 1;
    OperationBlockerPath path = 2;
    OperationBlockerRelationship relationship = 3;
  }
}
// One semantic consequence of a resolved change. Exact bytes remain in `Edit`; this record
// explains what those bytes did to declarations and resolved relationships.
message OperationEffect {
  // Subjects in the state before this change. Empty for creation.
  repeated Address before = 2;
  // Subjects after Rift applies the change and every adapter sharing the worktree acknowledges
  // the new snapshot. Empty for deletion.
  repeated Address after = 3;
  // Source locations demonstrating the effect, pinned to their respective before or after
  // address state.
  repeated SourceSpan spans = 4;
  // Concrete account of the semantic consequence.
  string detail = 5;
}
// Evidence establishing an action-advertised or caller-declared guarantee for a resolved
// change. The record supplies its scope, verifier, method, and findings.
message GuaranteeEvidence {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or sandbox validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  GuaranteeKind kind = 1;
  // Source over which the guarantee holds.
  CoverageScope scope = 2;
  // Component that established the property.
  OperationVerifier verifier = 3;
  // Exact property checked and any limit on its interpretation.
  string detail = 5;
  // Findings produced while establishing the guarantee.
  repeated Diagnostic diagnostics = 6;
}
// One effect a caller must acknowledge before publication. Requirements are sorted by kind,
// source location, title, and detail, then numbered from zero. The acknowledgement is
// interpreted only with the preview named by the publish request.
message ConfirmationRequirement {
  // Zero-based position in the preview's ordered confirmation list.
  int64 id = 1;
  // A short account of the effect being acknowledged.
  string title = 3;
  // The concrete consequence, including the scope or unresolved item that triggered it.
  string detail = 4;
  // Source locations that demonstrate the effect. Empty where the condition applies to the
  // candidate as a whole.
  repeated SourceSpan spans = 5;
}
// One compiler action family advertised for a language. The prefix supports planning. Discovery
// still decides whether the family applies at an address.
message ActionSupport {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or sandbox validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // Supported action kind prefix, such as `refactor.rename` or `quickfix`.
  string kind = 1;
  // Languages, files, or constructs for which this family can be discovered and resolved.
  Coverage coverage = 2;
  // Guarantee kinds this family may advertise. Each discovered action states its actual subset.
  repeated GuaranteeKind guarantees = 3;
}
// A compiler's portable description of one discovered operation. Listing carries no edits
// because resolution computes only the selected action.
message ActionDescriptor {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or sandbox validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // What the action is called, in the words the compiler would show a person.
  string title = 1;
  // What this action does. Filtering by prefix is what makes it useful: an agent that wants a
  // fix asks for `quickfix` and never sees a refactor.
  string kind = 2;
  // Whether the compiler ranks this as the preferred action at the target. At most one action
  // in a list is preferred.
  bool preferred = 3;
  // Why the compiler is offering it here.
  string rationale = 5;
  // What the action applies to.
  Address target = 6;
  // Portable argument shape used by a standard refactor, or null when the adapter's
  // self-contained schema is the complete contract.
  optional ArgumentContract argument_contract = 7;
  // JSON Schema draft 2020-12 for the arguments this action takes. Remote references are
  // forbidden. When `argument_contract` is set, this schema may add language constraints while
  // preserving the portable fields and meanings.
  google.protobuf.Struct arguments_schema = 8;
  // Properties this action promises to establish when resolution succeeds. Resolve must return
  // one complete `GuaranteeEvidence` entry for every kind listed here.
  repeated GuaranteeKind guarantees = 9;
  // Why the action cannot run right now, where the compiler lists it but refuses it. Null when
  // it can run.
  optional string disabled_reason = 10;
  // The findings this action would clear. Empty for an action nothing reported.
  repeated Diagnostic diagnostics = 11;
  // Action fields the model has no place for, namespaced by the adapter that emitted them.
  Extensions extensions = 12;
}
// Identity of one match: the query that found it, the snapshot it searched, and the range where
// it landed. The complete query remains available for inspection and replay.
message MatchKey {
  // The snapshot it was found in. A match does not survive into another one, because the bytes
  // its span points at have moved.
  Snapshot snapshot = 1;
  // The file and byte range that matched.
  SourceSpan span = 2;
  // The query that produced this match. One span found by two queries denotes two match
  // identities.
  MatchQuery query = 3;
}
// State-bound identity of one discovered compiler action. The language selects the adapter. The
// opaque token binds its handle and adapter generation.
message ActionKey {
  // The snapshot it was discovered in. Rift rediscovers the adapter's action and checks this
  // before applying anything, because an action is only meaningful against the code it was
  // computed from.
  Snapshot snapshot = 1;
  // Language whose adapter minted the token and resolves it.
  string language = 2;
  // Opaque Rift handle containing the adapter token and generation. Rift unwraps it only when
  // resolving the offer.
  string token = 3;
}
