syntax = "proto3";
// Generated from the Pydantic models under protocol/src/rift/models. Do not edit.
// The Rift server owns at most one configured adapter process per exact Language and calls it
// over gRPC on a Unix domain socket. The process can hold several projection states and back
// them with separate runtime workers. Rift supplies each adapter state with a server-owned
// projection. Different-language adapters may open the same tree. Rift serializes source
// writes, then refreshes every adapter that holds the projection.
package rift.adapter;
import "rift/core.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/empty.proto";
extend google.protobuf.MessageOptions {
  optional string section = 50000;
}
// How long Rift may retain one Analyze result.
enum CacheScope {
  // No cache claim. Rift treats the result as request-volatile.
  CACHE_SCOPE_UNSPECIFIED = 0;
  // The projection contents, adapter implementation, language, and virtual inputs determine the
  // result.
  PROJECTION = 1;
  // Adapter-observed external state also affects the result. Retention ends with the process or
  // adapter-state generation.
  PROCESS = 2;
  // The result is request-volatile and is not retained.
  NONE = 3;
}
// One generated adapter wire contract supported by the process.
message AdapterContract {
  option (section) = "Capabilities";
  // Breaking adapter protocol generation.
  int64 major = 1;
  // Additive revision within the selected major.
  uint32 minor = 2;
  // SHA-256 of the generated adapter descriptor.
  string schema_digest = 3;
}
// Adapter capabilities read once during startup.
message Capabilities {
  option (section) = "Capabilities";
  reserved 1;
  // Language name and optional dialect handled by this configured adapter process. A workspace
  // configures at most one process for the exact pair; that process can hold many adapter
  // states.
  rift.core.Language language = 2;
  // The adapter build, as it names itself.
  string implementation = 3;
  // Physical source files this adapter owns and parses as `language`.
  repeated rift.adapter.SourceClaim source_claims = 4;
  // Files this adapter reads as configuration or dependency metadata —
  // `Cargo.toml`, `tsconfig.json`. Several adapters may claim the same one.
  repeated rift.adapter.AuxiliaryClaim auxiliary_claims = 5;
  // Paths inside the workspace this adapter writes while operating.
  repeated rift.adapter.WriteClaim write_claims = 6;
  // The exact kinds this adapter emits, and the portable facets each carries. This is the
  // vocabulary Rift filters against: a facet nobody advertises is one no answer can be negated
  // on.
  repeated rift.adapter.KindDescriptor kinds = 7;
  // Optional RPC operations this adapter implements, sorted by enum number.
  repeated rift.core.AdapterOperation operations = 8;
  // Fact families Analyze may emit, sorted by enum number. Non-empty requires the `analyze`
  // operation.
  repeated rift.core.FactFamily fact_families = 9;
  // Action families available for planning before a target-specific Actions call. Non-empty
  // requires `actions` and `resolve`; entries sort by kind prefix.
  repeated rift.core.ActionSupport action_kinds = 10;
  // Versioned extension values this adapter emits, and where each may appear.
  repeated rift.adapter.ExtensionDescriptor extension_values = 11;
  // Bounds Rift must stay inside when driving this adapter.
  rift.adapter.AdapterLimits limits = 12;
  // Execution behavior the host should account for while this adapter runs.
  rift.adapter.RuntimeRequirements runtime = 13;
  // Supported generated contracts in adapter preference order.
  repeated rift.adapter.AdapterContract contracts = 14;
}
// A deterministic claim on physical files, re-evaluated after every path or
// content change. Selectors are ORed and compare UTF-8 bytes: suffixes against
// the full path, names against the final component, shebang prefixes against
// the first line. Highest priority wins. Equal priority from two adapters is an
// ownership error.
message SourceClaim {
  option (section) = "Capabilities";
  // Which adapter wins where two claim the same path. Higher takes it.
  uint32 priority = 1;
  // Suffixes matched against the whole path, so `.d.ts` can be claimed apart
  // from `.ts`.
  repeated string path_suffixes = 2;
  // Whole final path components, for files whose name carries the meaning —
  // `Makefile`, `Dockerfile`.
  repeated string path_names = 3;
  // First-line prefixes for extensionless scripts: `#!/usr/bin/env python`.
  repeated string shebang_prefixes = 4;
  // Whether a claimed file may contain other languages. A Svelte owner sets
  // this for an embedded TypeScript region, then publishes that region as a
  // virtual source when the TypeScript adapter has to analyze it.
  bool container = 5;
}
// A non-owning claim on project files needed to discover or configure adapter
// semantics. Same bytewise rules as SourceClaim, may overlap across adapters,
// and never makes a file a source unit.
message AuxiliaryClaim {
  option (section) = "Capabilities";
  // What an auxiliary file is to the adapter that reads it. This is what the
  // file means, and it is what Rift acts on: a workspace manifest changing can
  // add or remove whole source trees, which Rift has to rescan for. What the
  // adapter has to redo is `environment_defining`.
  enum Purpose {
    // The adapter did not say. Treated as the widest purpose, so a change to
    // the file invalidates everything derived from it.
    UNSPECIFIED = 0;
    // Settings the adapter reads directly — `tsconfig.json`, `.rustfmt.toml`.
    ADAPTER_CONFIGURATION = 1;
    // Declared dependencies, before resolution — `package.json`, `Cargo.toml`.
    DEPENDENCY_MANIFEST = 2;
    // Resolved dependency versions — `Cargo.lock`, `bun.lock`. Editing one can
    // change every type the adapter resolves.
    DEPENDENCY_LOCK = 3;
    // Which packages make up the project — a Cargo workspace, an npm workspace.
    // A change here can add or remove whole source trees.
    WORKSPACE_MANIFEST = 4;
    // Metadata a build step wrote for the adapter to read back.
    GENERATED_METADATA = 5;
    // Something the adapter needs that none of the above describes. The claim
    // states its purpose.
    OTHER = 6;
  }
  // What the file is to the adapter, and so what Rift itself has to redo when
  // it changes.
  repeated rift.adapter.AuxiliaryClaim.Purpose purposes = 1;
  // Suffixes matched against the whole path.
  repeated string path_suffixes = 2;
  // Whole final path components — `Cargo.toml`, `package.json`.
  repeated string path_names = 3;
  // Whether a Refresh touching this file forces the adapter to rebuild its
  // resolved state, including reselecting its project runtime when necessary. Declared and
  // never inferred from purpose or path, because only the adapter knows whether it
  // rereads a given file.
  bool environment_defining = 4;
}
// Paths inside the workspace that this adapter writes to. Rift
// classifies each claimed subtree as adapter output and excludes it from
// source analysis and agent results.
// Write claims are exclusive across adapters sharing a connection projection. Rift
// refuses workspace admission when two adapters can write the same path; one
// of them must redirect that output to its private state_root.
//
// CARGO_TARGET_DIR, GOCACHE, PYTHONPYCACHEPREFIX, and tsBuildInfoFile can point
// at `state_root`. Declare generated output that must remain beside source, such as npm's
// `node_modules`; an already tracked source path remains source even when a claim matches it.
//
// Selectors follow SourceClaim's bytewise rules. A directory name matches the
// directory and everything beneath it.
message WriteClaim {
  option (section) = "Capabilities";
  // Whole final path components. A directory named here takes its whole tree
  // with it — `node_modules`, `target`.
  repeated string path_names = 1;
  // Suffixes matched against the whole path, covering generated files in
  // several directories.
  repeated string path_suffixes = 2;
  // Why the adapter needs it, in one line. Rift logs this when a claim shadows
  // a workspace file, which is nearly always a mistake.
  string reason = 3;
}
// One kind this adapter emits, and the portable facets it carries. Which facet
// vocabulary applies depends on what the kind describes — a symbol, a node or
// a relationship — so the branch that is set is what says which.
message KindDescriptor {
  option (section) = "Capabilities";
  // The adapter-local kind name, such as `trait`, `mapping.key`, or `selector.class`.
  string kind = 1;
  oneof facets {
    // Facets carried by symbols of this kind.
    rift.adapter.SymbolFacets symbol = 2;
    // Facets carried by nodes of this kind.
    rift.adapter.NodeFacets node = 3;
    // Facets carried by relationships of this kind.
    rift.adapter.RelationshipFacets relationship = 4;
  }
}
message SymbolFacets {
  option (section) = "Capabilities";
  repeated rift.core.SymbolFacet values = 1;
}
message NodeFacets {
  option (section) = "Capabilities";
  repeated rift.core.NodeFacet values = 1;
}
message RelationshipFacets {
  option (section) = "Capabilities";
  repeated rift.core.RelationshipFacet values = 1;
}
// One versioned extension value, and every place it may appear. Rift validates
// each occurrence against the schema.
message ExtensionDescriptor {
  option (section) = "Capabilities";
  // Reverse-domain namespaced key.
  string key = 1;
  // Bumped whenever the schema changes shape. A consumer skips versions it does
  // not implement.
  uint32 version = 2;
  // Which model types this value may be attached to — `Symbol`, `Node`.
  repeated string targets = 3;
  // A self-contained JSON Schema draft 2020-12 document. Remote references are
  // forbidden, so validation fetches nothing.
  string schema = 4;
  // Whether Rift builds a search index over this value. Each indexed fact costs
  // storage, so the adapter declares this explicitly.
  bool indexed = 5;
}
// Bounds this adapter advertises. One process holds state for several server-owned
// projections, so each state receives its own in-flight limit.
message AdapterLimits {
  option (section) = "Capabilities";
  // Largest single message this adapter will accept or send. A fact batch is
  // split to stay under it.
  uint64 max_message_bytes = 1;
  // Concurrent calls accepted across the whole connection.
  uint32 max_in_flight = 2;
  // Concurrent calls accepted for one adapter state, so one caller cannot consume the process.
  uint32 max_in_flight_per_state = 3;
  // Server-owned projection states this adapter will hold at once. Each can retain a parsed
  // tree, index, and runtime worker, so the bound controls resource use.
  uint32 max_states = 4;
}
// Execution behavior reported by an adapter process for server admission and diagnostics.
// Rift does not isolate the process or its workers from the host. These requirements
// do not select the project runtime used for one adapter state.
message RuntimeRequirements {
  option (section) = "Capabilities";
  // Whether the adapter executes workspace code, such as a build script, plugin, or macro.
  bool executes_workspace_code = 1;
  // Whether the adapter spawns subprocesses, including runtime workers selected for individual
  // adapter states.
  bool spawns_subprocesses = 2;
}
// One adapter's state for a Rift FS projection. Every call that reads code
// carries it. The adapter may back different states with different project
// runtimes. A call naming an earlier state receives `StaleState`.
message AdapterState {
  option (section) = "Adapter state";
  // Adapter-local state generation, and the whole of an adapter state's identity.
  // Open mints the first value; Refresh and SyncVirtual advance it. A call carrying
  // an earlier generation receives StaleState.
  uint64 generation = 3;
}
// Open one Rift FS projection in the adapter. The adapter
// may inspect its files and select or start the project runtime for this state.
message OpenRequest {
  option (section) = "Adapter state";
  // Absolute path to a directory the adapter owns and Rift never reads. Build
  // output belongs here — point CARGO_TARGET_DIR and friends at it. Every open
  // adapter state receives a distinct path, and Rift never reuses that path after
  // Close. An adapter may maintain its own shared read-only cache
  // outside this directory when its language toolchain supports safe sharing.
  string state_root = 2;
  // Exact contract selected from the adapter's `Capabilities.contracts`.
  rift.adapter.AdapterContract contract = 4;
  // Absolute Rift FS path for `projection`. Other adapters can receive the same path. Adapter
  // output goes to `state_root` or a declared WriteClaim scratch subtree.
  string root = 5;
}
// Rift changed files in a projection. It sends this call to every language
// adapter holding the shared path. Paths are
// project-relative and cover every file Rift touched; each adapter decides
// which changes reach its own analysis. Content is on disk before this call. The adapter
// reselects its project runtime when runtime-defining inputs have changed.
message RefreshRequest {
  option (section) = "Adapter state";
  // The state the adapter last acknowledged. A mismatch means Rift and the
  // adapter disagree about what is on disk, and comes back as StaleState.
  rift.adapter.AdapterState from = 1;
  // Files created or overwritten since `from`, as `rift://file/<path>`.
  repeated string written = 3;
  // Files deleted since `from`. A rename arrives as one of each.
  repeated string removed = 4;
}
// One atomic replacement of the virtual sources consumed by an adapter. Rift
// sends exactly one `start` event first, then each `unit` followed by ordered
// `text` chunks ending in `final: true`. The complete stream replaces the
// previous overlay; an RPC failure leaves the previous generation intact. The
// units are the complete set selected for this consumer at `start`,
// including an empty set when every previous unit has been retracted.
message VirtualSyncEvent {
  option (section) = "Adapter state";
  oneof event {
    // Current adapter-local state. The returned AdapterState advances its
    // generation.
    rift.adapter.AdapterState start = 1;
    // One virtual file whose exact Language matches this adapter.
    rift.adapter.VirtualUnit unit = 2;
    // Ordered bytes for the preceding unit.
    rift.adapter.VirtualText text = 3;
  }
}
// Release one open adapter state.
message CloseRequest {
  option (section) = "Adapter state";
  rift.adapter.AdapterState state = 1;
}
// Read selected claimed physical or synced virtual sources at one state.
message AnalyzeRequest {
  option (section) = "Analysis";
  rift.adapter.AdapterState state = 1;
  // Source units requested as `rift://file/<path>`, sorted by URI. Empty selects every source
  // unit this adapter owns.
  repeated string units = 2;
  // Advertised fact families requested in enum order. Empty selects every advertised family.
  repeated rift.core.FactFamily fact_families = 3;
}
// One event of an analyze stream, followed eventually by exactly one summary.
message AnalyzeEvent {
  option (section) = "Analysis";
  oneof event {
    // A claimed physical or synced virtual unit is about to have facts.
    rift.adapter.SourceUnit source_unit = 1;
    // A file this adapter produced is about to have text and facts.
    rift.adapter.VirtualUnit virtual_unit = 2;
    // A chunk of a produced file's bytes.
    rift.adapter.VirtualText virtual_text = 3;
    // A batch of facts for one file.
    rift.adapter.Facts facts = 4;
    // No more facts for one file.
    rift.adapter.UnitCoverage coverage = 5;
    // No more events at all.
    rift.adapter.AnalyzeSummary summary = 6;
  }
}
// Metadata for one physical or synced virtual source unit this adapter owns.
// Rift resolves the URI against the immutable source-store tree or the virtual overlay at
// this AdapterState generation.
message SourceUnit {
  option (section) = "Analysis";
  // The unit, as `rift://file/<path>`. The same spelling `SourceSpan.unit`
  // uses, so a fact and the unit it was read from compare without translation.
  string unit = 1;
  // Which bytes each language owns. One entry for a file in a single language,
  // several where one embeds another.
  repeated rift.core.LanguageRegion regions = 2;
}
// Metadata for a file this adapter produced from another one. Rift validates
// the complete publication and forwards it to the selected consumer through
// SyncVirtual. The consumer stores it in a private overlay under state_root.
// Rift exposes the retained bytes as a regular, non-executable File resource.
message VirtualUnit {
  option (section) = "Analysis";
  // The produced file, as `rift://file/<path>`. The adapter mints the path;
  // downstream facts use the same identity even though the bytes live in the
  // consumer's private overlay.
  string unit = 1;
  // The exact language that consumes these bytes. Rift routes it to the configured adapter for
  // this pair.
  rift.core.Language language = 2;
  // Which bytes each language owns inside the produced file. A consumer echoes
  // these regions when it later emits SourceUnit for the synced path.
  repeated rift.core.LanguageRegion regions = 3;
}
// One chunk of a produced file's bytes. Sent in pieces because a generated file
// can be far larger than the source it came from, and a message has a bound.
message VirtualText {
  option (section) = "Analysis";
  // The produced file these bytes belong to, spelled as its VirtualUnit did.
  string unit = 1;
  // Byte offset this chunk starts at. Chunks arrive in order and leave no gaps.
  uint64 offset = 2;
  // The bytes themselves.
  string text = 3;
  // Whether this is the last chunk. Rift holds the file until it arrives.
  bool final = 4;
}
// One file's worth of one fact family. Rift buffers by file until the coverage
// event for that file, then routes complete virtual units to their consumer.
message Facts {
  option (section) = "Analysis";
  // The file these facts were read from, as `rift://file/<path>`.
  string unit = 1;
  oneof family {
    rift.adapter.OriginMappings origin_mappings = 2;
    rift.adapter.Symbols symbols = 3;
    rift.adapter.Nodes nodes = 4;
    rift.adapter.Relationships relationships = 5;
    rift.adapter.Diagnostics diagnostics = 6;
  }
}
message OriginMappings {
  option (section) = "Analysis";
  repeated rift.core.OriginMapping items = 1;
}
message Symbols {
  option (section) = "Analysis";
  repeated rift.core.Symbol items = 1;
}
message Nodes {
  option (section) = "Analysis";
  repeated rift.core.Node items = 1;
}
message Relationships {
  option (section) = "Analysis";
  repeated rift.core.Relationship items = 1;
}
message Diagnostics {
  option (section) = "Analysis";
  repeated rift.core.Diagnostic items = 1;
}
// Closes one file's facts. `present=false` clears everything buffered for it.
message UnitCoverage {
  option (section) = "Analysis";
  // The file being closed, as `rift://file/<path>`.
  string unit = 1;
  // Whether the file exists and was read at all. False retracts it.
  bool present = 2;
  // How complete each fact family is for this file. Every family is stated: a
  // family the adapter cannot produce is `unsupported` and one the language has
  // no concept of is `not_applicable`, so there is no silence to interpret.
  rift.core.SemanticCoverage coverage = 3;
}
// Completes one ordered Analyze stream and states how long Rift may retain its facts.
message AnalyzeSummary {
  option (section) = "Analysis";
  // The state every fact in this stream was read against.
  rift.adapter.AdapterState state = 1;
  // Files whose previously published facts no longer hold, as
  // `rift://file/<path>`. This reaches files the stream said nothing about,
  // which is what a per-file `UnitCoverage` cannot do.
  repeated string invalidated = 2;
  // Retention scope for every fact in this Analyze stream.
  rift.adapter.CacheScope cache_scope = 3;
}
// Ask the adapter to validate the closure affected by a candidate change.
// Rift has applied the change only in the private candidate and acknowledged that state through
// Refresh, so the adapter reads the exact files Rift may publish.
message ValidateRequest {
  option (section) = "Validation";
  // Private candidate state being checked.
  rift.adapter.AdapterState state = 1;
  // Files changed in the candidate projection, as project-relative paths. The adapter
  // expands these to the dependent files its own validity rules require.
  repeated string changed = 2;
}
// Validation diagnostics followed by exactly one summary.
message ValidateEvent {
  option (section) = "Validation";
  oneof event {
    // A bounded batch of findings from the adapter.
    rift.adapter.Diagnostics diagnostics = 1;
    // The final verdict and the scope actually checked.
    rift.adapter.ValidationSummary summary = 2;
  }
}
// Closes one validation stream. Rift combines this with the preceding
// diagnostics and the adapter's language to construct ValidationReport.
message ValidationSummary {
  option (section) = "Validation";
  // State every finding and the verdict were computed from.
  rift.adapter.AdapterState state = 1;
  // Whether the adapter accepted the checked scope.
  bool valid = 2;
  // How completely the adapter checked the affected source closure.
  rift.core.Coverage coverage = 3;
  // Files included in that closure, as project-relative paths in byte order.
  repeated string files = 4;
}
// Ask the language formatter for concrete edits over the current session state.
// Rift skips this RPC for FormattingPolicy.PRESERVE.
message FormatRequest {
  option (section) = "Formatting";
  // Session state whose offsets the response must use.
  rift.adapter.AdapterState state = 1;
  // CHANGED_REGIONS or AFFECTED_FILES. PRESERVE is refused because it requires
  // no formatter work.
  rift.core.FormattingPolicy policy = 2;
  // Text ranges changed by the resolved operation. Required for
  // CHANGED_REGIONS and ignored for AFFECTED_FILES.
  repeated rift.core.SourceSpan spans = 3;
  // Changed files owned by this adapter. Required for AFFECTED_FILES and used
  // to group spans for CHANGED_REGIONS.
  repeated string files = 4;
}
// Formatter output over one acknowledged session state.
message FormatResponse {
  option (section) = "Formatting";
  // State the formatter read.
  rift.adapter.AdapterState state = 1;
  // Atomic non-overlapping replacements in canonical file-and-range order.
  repeated rift.core.TextEdit edits = 2;
  // Whether every requested region or file was formatted.
  rift.core.Coverage coverage = 3;
  // Formatter findings that explain partial coverage or a refusal.
  repeated rift.core.Diagnostic diagnostics = 4;
}
// Find every place matching one pattern parsed by the language adapter.
message MatchRequest {
  option (section) = "Matching";
  // The state to search, and what the answer is pinned to.
  rift.adapter.AdapterState state = 1;
  // The pattern, and the constraints on what its captures may be.
  rift.core.StructuralQuery query = 2;
}
// One event of a match stream, followed eventually by exactly one summary.
message MatchEvent {
  option (section) = "Matching";
  oneof event {
    // A batch of matches.
    rift.adapter.Matches matches = 1;
    // No more matches.
    rift.adapter.MatchSummary summary = 2;
  }
}
message Matches {
  option (section) = "Matching";
  repeated rift.adapter.StructuralMatch items = 1;
}
// One match, as the adapter found it. It carries no identity of its own: a
// `MatchKey` is the query and the span it matched, and Rift already holds
// the first, so the span below completes it.
message StructuralMatch {
  option (section) = "Matching";
  // The file and byte range the pattern matched.
  rift.core.SourceSpan span = 1;
  // The ranges around the matched node that are safe to replace.
  rift.core.StructuralMatchRanges replacement_ranges = 2;
  // What each named part of the pattern bound to.
  repeated rift.core.Capture captures = 3;
  // Why this is a match, one step per line.
  repeated string explanation = 4;
}
// Closes a match stream.
message MatchSummary {
  option (section) = "Matching";
  // The state every match was found against.
  rift.adapter.AdapterState state = 1;
  // Matches sort by unit UTF-8 bytes, range start, range end, then RFC 8785
  // bytes of their replacement ranges and captures.
  // How much of the workspace the pattern actually reached.
  rift.core.Coverage coverage = 2;
}
// Ask which action descriptors and tokens apply at one address. Resolve computes
// edits after the caller selects one token.
message ActionsRequest {
  option (section) = "Actions";
  // The state to ask against. The answer is only valid against it.
  rift.adapter.AdapterState state = 1;
  // Where in the code to ask: a symbol, a node, a byte range, or a match.
  rift.core.Address target = 2;
  // Hierarchical kind prefixes. Empty requests every action.
  repeated string only = 3;
}
// The actions on offer at one address.
message ActionsResponse {
  option (section) = "Actions";
  // The state they were discovered against.
  rift.adapter.AdapterState state = 1;
  // What the adapter can do here, each with the token that resolves it.
  repeated rift.adapter.ActionOffer actions = 2;
  // Coverage of action discovery at this address.
  rift.core.Coverage coverage = 3;
}
// An adapter action token and its portable descriptor. Rift combines the token,
// Capabilities.language, and ActionsResponse.state to build an ActionKey. The
// descriptor crosses into MCP unchanged.
message ActionOffer {
  option (section) = "Actions";
  // The adapter's own handle on this action. Tokens are unique within one
  // AdapterState. Rift passes the selected token back unread.
  string token = 1;
  // What the action is, in terms the model shares with MCP.
  rift.core.ActionDescriptor descriptor = 2;
}
// Compute what one action would change.
message ResolveRequest {
  option (section) = "Actions";
  // The state the token was discovered in. A token resolved against anything
  // else comes back as StaleState, because the offsets it computed no longer
  // point where they did.
  rift.adapter.AdapterState state = 1;
  // The token from the `ActionOffer` being resolved.
  string token = 2;
  // Arguments, as RFC 8785 canonical JSON, validated against the descriptor's
  // arguments_schema before the call.
  string arguments = 3;
}
// What the action changes. Rift applies these to the projection; the adapter's
// own tree is untouched and will next hear about the change through Refresh.
message ResolveResponse {
  option (section) = "Actions";
  // The state whose bytes the edit offsets address.
  rift.adapter.AdapterState state = 1;
  // The change itself, as byte ranges and their replacements.
  repeated rift.core.Edit edits = 2;
  // Whether the edits are the whole change. Partial means the adapter could
  // only rewrite part of what the action names — a rename it cannot follow into
  // a macro, say — and the diagnostics say where it stopped.
  rift.core.Coverage coverage = 3;
  // What the adapter wants the caller to know before applying this.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Conditions the adapter checked while resolving. Every entry is satisfied;
  // a failed condition is returned in Refusal instead.
  repeated rift.core.OperationPrecondition preconditions = 5;
  // Semantic consequences of the edits. Rift refreshes the adapter and
  // reconstructs resulting-state addresses before publishing the change.
  repeated rift.core.OperationEffect effects = 6;
  // Scoped evidence for every guarantee advertised by the action descriptor.
  repeated rift.core.GuaranteeEvidence guarantees = 7;
}
// Evaluate one caller-provided block in the project runtime selected for a pinned adapter
// state. Rift gives this call a disposable execution workspace, so evaluated code never runs in
// the session projection.
message ExecuteRequest {
  option (section) = "Execution";
  // Adapter state to evaluate against.
  rift.adapter.AdapterState state = 1;
  // Source and project-relative working directory.
  rift.core.CodeBlock block = 2;
  // Exact workspace-configured bounds the adapter must enforce for this evaluation.
  rift.core.ExecutionBudget budget = 3;
}
// Bounded result of evaluating a block against one unchanged adapter state.
message ExecuteResponse {
  option (section) = "Execution";
  // State whose project runtime and source context were used.
  rift.adapter.AdapterState state = 1;
  rift.core.ExecutionResult result = 2;
}
// Adapter-local handle for an inspect-only debugging evaluation. Start runs until normal
// completion or an unhandled failure. A failed evaluation retains its stack frames until
// DebugStop or adapter-state cleanup.
message DebugSessionKey {
  option (section) = "Debugging";
  // Pinned adapter state used by the debugging evaluation.
  rift.adapter.AdapterState state = 1;
  // Opaque adapter-local handle. Rift never exposes it to the MCP caller.
  string token = 2;
}
// Adapter-local key and terminal evaluation summary for one debugging session.
message DebugSession {
  option (section) = "Debugging";
  // Stable identity used by frame reads and cleanup.
  rift.adapter.DebugSessionKey key = 1;
  // Retained stack frames, innermost first. Zero after normal completion.
  uint32 frame_count = 2;
  // How evaluation ended and its bounded output.
  rift.core.ExecutionResult result = 3;
}
// Start an inspect-only debugging evaluation against one pinned adapter state.
message DebugStartRequest {
  option (section) = "Debugging";
  rift.adapter.AdapterState state = 1;
  rift.core.CodeBlock block = 2;
  // Exact workspace-configured bounds for evaluation, retained frames, and bindings.
  rift.core.DebugBudget budget = 3;
}
// Select one retained stack frame from a debugging session.
message DebugGetFrameRequest {
  option (section) = "Debugging";
  rift.adapter.DebugSessionKey session = 1;
  // Zero-based stack depth, with the innermost retained frame first.
  uint32 depth = 2;
}
// One retained frame and the session identity it came from.
message DebugGetFrameResponse {
  option (section) = "Debugging";
  rift.adapter.DebugSessionKey session = 1;
  rift.core.DebugFrame frame = 2;
}
// Release one debugging session and all retained runtime state behind it.
message DebugStopRequest {
  option (section) = "Debugging";
  rift.adapter.DebugSessionKey session = 1;
}
// Carried in `google.rpc.Status.details` when an adapter declines work it
// understood: the target is ambiguous, an action went stale, the language
// forbids it. Everything else is an ordinary status code.
message Refusal {
  option (section) = "Failure";
  // Why the adapter declined. The value is what a caller acts on: some of these
  // are worth retrying after a Refresh, and the rest never are.
  enum Reason {
    // The adapter did not classify it. Treated as permanent.
    UNSPECIFIED = 0;
    // The operation has no implementation for this language. Retrying is futile.
    UNSUPPORTED = 1;
    // The code has to change first — a file must compile before this can run.
    UNMET_PRECONDITION = 2;
    // The address resolves to several targets. The caller narrows it and asks
    // again.
    AMBIGUOUS_TARGET = 3;
    // The action was discovered against an adapter state that has advanced.
    // Rediscover it and resolve the new token.
    STALE_ACTION = 4;
    // The match was found against an adapter state that has advanced. Search again.
    STALE_MATCH = 5;
    // Doing it would reach further than the caller can have meant — outside the
    // workspace, or into generated code nothing regenerates.
    UNSAFE_EFFECT = 6;
    // The language itself forbids it: a rename to a reserved word, a visibility
    // change its rules do not allow.
    LANGUAGE_REFUSAL = 7;
  }
  // Which class of refusal this is, so a caller can decide without parsing
  // `message`.
  rift.adapter.Refusal.Reason reason = 1;
  // One line for a human, saying what specifically was wrong.
  string message = 2;
  // What in the code stopped it.
  repeated rift.core.OperationBlocker blockers = 3;
  // What the adapter reported while trying.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Executable conditions checked before refusal, including failed values.
  repeated rift.core.OperationPrecondition preconditions = 5;
}
// Carried in `google.rpc.Status.details` when a pinned call names a state the
// adapter has moved past. The caller resyncs to `actual` before retrying.
message StaleState {
  option (section) = "Failure";
  rift.adapter.AdapterState actual = 1;
}
// Everything Rift can ask one language for. The adapter answers `Describe`
// once, then holds state for projections and answers questions about their code. Optional
// calls are advertised in `Capabilities.operations`; an unimplemented call returns
// gRPC `UNIMPLEMENTED`. Rift issues only advertised optional calls. Returning
// `UNIMPLEMENTED` from an advertised call is an adapter protocol error.
service Adapter {
  // What this adapter can do, asked once before anything else. Rift holds the
  // adapter to exactly what it claims here and never probes or feature-tests.
  rpc Describe (google.protobuf.Empty) returns (rift.adapter.Capabilities);
  // Here is the Rift FS projection. The adapter can inspect its source, select a runtime
  // worker, and initialize state.
  rpc Open (rift.adapter.OpenRequest) returns (rift.adapter.AdapterState);
  // The files on disk moved to a new state, and these are the paths that changed. The adapter
  // re-evaluates runtime-defining inputs before acknowledging the new state. Without this it
  // would have to stat the tree to find out, and rebuilding adapter state per edit would
  // discard incremental work.
  rpc Refresh (rift.adapter.RefreshRequest) returns (rift.adapter.AdapterState);
  // Replace this adapter state's private virtual-source overlay. The first
  // event pins the current adapter state; the remaining events carry a
  // complete manifest and its bytes. Rift drains calls for this adapter
  // state before the stream and blocks new calls until completion. Stream
  // completion commits the overlay atomically.
  rpc SyncVirtual (stream rift.adapter.VirtualSyncEvent) returns (rift.adapter.AdapterState);
  // Release this tree's adapter state so Rift can delete the tree. Refused while
  // calls are in flight so their adapter state and source path remain valid
  // through the final stream event.
  rpc Close (rift.adapter.CloseRequest) returns (google.protobuf.Empty);
  // Read the code and say what is in it: symbols, where they appear, how they
  // connect, and what the adapter complains about. Facts stream per file and
  // the summary closes it.
  rpc Analyze (rift.adapter.AnalyzeRequest) returns (stream rift.adapter.AnalyzeEvent);
  // Check a session change after Rift has written it and refreshed adapter state.
  // The stream carries diagnostics followed by one verdict over the affected
  // source closure.
  rpc Validate (rift.adapter.ValidateRequest) returns (stream rift.adapter.ValidateEvent);
  // Format the files or syntactic regions touched by a session change. Rift applies
  // the returned text edits and refreshes adapter state before the next change.
  rpc Format (rift.adapter.FormatRequest) returns (rift.adapter.FormatResponse);
  // Find code by structural shape: a call with two arguments, or a class
  // implementing an interface.
  rpc Match (rift.adapter.MatchRequest) returns (stream rift.adapter.MatchEvent);
  // List the fixes and refactors the adapter can offer at one address.
  rpc Actions (rift.adapter.ActionsRequest) returns (rift.adapter.ActionsResponse);
  // Work out what one of those actions would actually change. Separate from
  // `Actions` because computing an action's edits costs about as much as
  // performing it, and only one of the actions offered gets picked.
  rpc Resolve (rift.adapter.ResolveRequest) returns (rift.adapter.ResolveResponse);
  // Evaluate a caller-provided code block in the project runtime selected for this exact
  // adapter state. The surrounding workspace is disposable.
  rpc Execute (rift.adapter.ExecuteRequest) returns (rift.adapter.ExecuteResponse);
  // Evaluate a code block for post-mortem inspection, retaining stack frames after an unhandled
  // failure until DebugStop.
  rpc DebugStart (rift.adapter.DebugStartRequest) returns (rift.adapter.DebugSession);
  // Read one retained stack frame without resuming evaluation.
  rpc DebugGetFrame (rift.adapter.DebugGetFrameRequest) returns (rift.adapter.DebugGetFrameResponse);
  // Release a debugging session and its retained execution workspace.
  rpc DebugStop (rift.adapter.DebugStopRequest) returns (google.protobuf.Empty);
}
