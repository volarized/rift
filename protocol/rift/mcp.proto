// An integration check from the workspace-root `rift.toml`, executed directly without a shell
// in a disposable validation workspace materialized from the complete merged tree. The
// workspace is the process working directory and does not isolate the command from the host.
message CommandValidator {
  // How repository configuration presents this check.
  enum Kind {
    // The caller did not set a value.
    KIND_UNSPECIFIED = 0;
    KIND_TEST = 1;
    KIND_LINT = 2;
    KIND_BUILD = 3;
    KIND_OTHER = 4;
  }
