    // The caller did not set a value.
    UNSPECIFIED = 0;
    // No adapter implements this operation for the language it reaches, or repository state
    // cannot satisfy the contract.
    REFUSAL_REASON_UNSUPPORTED = 1;
    // A condition checked before resolution failed. The failed entry is in `preconditions`.
    REFUSAL_REASON_UNMET_PRECONDITION = 2;
    // The address resolves to several targets. Narrow it and ask again.
    REFUSAL_REASON_AMBIGUOUS_TARGET = 3;
    // The offer was discovered against a snapshot that has moved. Read the actions resource
    // again.
    REFUSAL_REASON_STALE_ACTION = 4;
    // The match was found against a snapshot that has moved. Search again.
    REFUSAL_REASON_STALE_MATCH = 5;
    // A rewrite matched fewer or more times than its cardinality accepts.
    REFUSAL_REASON_CARDINALITY_MISMATCH = 6;
    // The operation needs acknowledgements the caller did not supply.
    REFUSAL_REASON_CONFIRMATION_REQUIRED = 7;
    // The complete effect reaches outside what the caller can have meant — outside the project,
    // or into generated source.
    REFUSAL_REASON_UNSAFE_EFFECT = 8;
    // The requested formatting policy has no formatter behind it for an affected language.
    REFUSAL_REASON_FORMATTER_UNSUPPORTED = 9;
    // Required adapter or command validation did not complete.
    REFUSAL_REASON_VALIDATION_INCOMPLETE = 10;
    // The offer belongs to a portable family, which resolves through `rename`, `move`,
    // `delete`, or `change_signature` rather than through `act`.
    REFUSAL_REASON_PORTABLE_FAMILY = 11;
    // The integration target is checked out in a Git worktree. Rift never changes a checked-out
    // ref, index, or working tree.
    REFUSAL_REASON_CHECKED_OUT_TARGET = 12;
  }
