// Current workspace capabilities and request limits. Source resolvers advertise what
// they discover; each language advertises the fact providers that analyze those sources.
message WorkspaceResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // Workspace and index revisions captured for this page.
  rift.core.ReadSnapshot snapshot = 2;
  // The ceilings a request has to stay inside here.
  Limits limits = 4;
  // Served languages and their capabilities, sorted by name and dialect with null first.
  repeated LanguageSupport languages = 5;
  // How complete each fact family is across the workspace. A family reported `unsupported` here
  // remains unsupported in subsequent answers.
  rift.core.SemanticCoverage coverage = 6;
  // Resolvers that populate the source catalog, sorted by identity. Their revisions are
  // independent from fact-provider revisions.
  repeated SourceResolverSummary source_resolvers = 7;
  // Source-catalog units on this page, sorted by source identity. Pagination keeps the captured
  // catalog revision.
  repeated rift.core.SourceUnit source_units = 10;
  // The MCP resource families this workspace serves.
  repeated ResourceFamily resources = 8;
  // The same resource carrying the cursor for the next page, or null on the last one.
  optional string next = 9;
  // Hooks declared by the workspace-root `rift.toml`, in execution order.
  repeated Hook hooks = 13;
}
// Where one projection lives on the filesystem and what it holds. A caller that has
// to reach the projection through an ordinary filesystem tool reads its path here.
message ProjectionResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // The projection: identity, directory path, and state.
  Projection projection = 2;
  // Absolute path of the workspace this projection was taken from.
  string workspace = 3;
}
// One page of search hits from one captured tree and index revision. `coverage` states whether
// an empty result proves that no indexed candidate matched.
message SearchResult {
  // Tree and search-index revisions used for this result page.
  rift.core.ReadSnapshot snapshot = 1;
  // Coverage of the indexed candidate set used for this search. An empty result proves no match
  // only where this is complete.
  rift.core.Coverage coverage = 2;
  // The hits on this page, in the order the request asked for.
  repeated SearchHit results = 3;
  // Cursor for the next page, or null after the final result.
  optional string next_cursor = 4;
}
// Evaluate code in the targeted tree's execution copy — the workspace's, or the
// named projection's. The copy persists between calls, so installed dependencies and
// build caches survive; before each evaluation the server refreshes its visible files
// to match the targeted tree.
message ExecuteParams {
  // Exact language and optional dialect selecting the runtime.
  rift.core.Language language = 1;
  // Source to evaluate and its project-relative working directory.
  rift.core.CodeBlock block = 2;
  // The projection whose execution copy is used. Null uses the workspace's.
  optional string projection = 3;
}
// Bounded result of one execution. The server does not synchronize writes inside the
// execution directory back to the targeted tree. The directory is not a sandbox, so the
// runtime retains the server's OS permissions outside it.
message ExecuteResult {
  // Target-tree revision copied into the execution directory.
  rift.core.ReadSnapshot snapshot = 1;
  // Language whose runtime evaluated the block.
  rift.core.Language language = 2;
  // Runtime status, bounded output, and structured diagnostics.
  rift.core.ExecutionResult result = 3;
  // Exact bounds applied to this evaluation.
  rift.core.ExecutionBudget budget = 4;
}
// One `Diagnostic` as an MCP answer carries it: the fact its emitter minted, plus what Rift can
// add on top — where it lands in a line and column, and the source around it.
message DiagnosticContext {
  // Component that produced the diagnostic. Rift sets this after collecting provider, hook, or
  // apply output.
  enum Source {
    // The caller did not set a value.
    SOURCE_UNSPECIFIED = 0;
    // The analysis of a provider serving the language.
    PROVIDER = 1;
    // A workspace hook Rift ran over a proposed change.
    HOOK = 2;
    // Output from applying edits to the workspace.
    APPLY = 3;
  }
  Source source = 1;
  // The finding itself, exactly as its emitter minted it.
  rift.core.Diagnostic diagnostic = 3;
  // One-based line the finding starts on. Null where the diagnostic has no span — a
  // whole-project error has nowhere to point.
  optional int64 line = 4;
  // One-based column within that line, counted in UTF-8 bytes. Null for the same reason as
  // `line`.
  optional int64 column = 5;
  // The source the finding points at. Null where there is no span to copy from.
  optional SourceExcerpt excerpt = 6;
}
// One resolver that discovers source units before providers analyze them.
message SourceResolverSummary {
  // Implementation name and version the resolver reports.
  string implementation = 1;
  // Stable source-resolver identity.
  string id = 2;
  // Source locations this resolver discovers, in protocol order.
  repeated rift.core.SourceLocationKind locations = 3;
  // Latest immutable resolver revision, or null when unavailable.
  optional string revision = 4;
  // Current resolver lifecycle state.
  SourceResolverState state = 5;
}
// One cause in a failure chain. Entries appear from the outer operation to the concrete
// failure.
message ErrorCause {
  // How this link classifies on its own.
  ErrorCode code = 1;
  // What happened, for a human reading a log.
  string message = 2;
  // What could be done about this cause. The request's outer directive governs the call.
  RetryDirective retry = 3;
}
// The `data` object on every Rift MCP failure. `code` and `retry` are what a caller branches
// on, `message` is for a human, and the remaining fields carry the evidence available for that
// failure.
message ErrorData {
  // How far the request got before it failed. The same code means different things at different
  // phases: `limit_exceeded` while reading is a response too big, and while checking a change
  // it is a change set too large.
  enum Phase {
    // The caller did not set a value.
    PHASE_UNSPECIFIED = 0;
    // Working out what the workspace can do: capabilities, limits, which languages have
    // providers.
    DISCOVERY = 1;
    // Reading workspace or provider data.
    READ = 2;
    // Turning an address or a cursor into the concrete thing it names at a state.
    RESOLVE = 3;
    // Checking a proposed change against the schema and the state it was pinned to.
    CHECK = 4;
    // Resolving the operation, writing the result into the targeted tree, and running its
    // hooks.
    CHANGE = 5;
    // Publishing projection changes to the workspace.
    PUBLISH = 6;
    // Preparing the execution copy and evaluating caller-provided code.
    EXECUTE = 7;
  }
  // Why the request failed.
  ErrorCode code = 1;
  // Human-readable account of the failure. Machine-readable classification remains in the
  // surrounding fields.
  string message = 2;
  // What the caller may do next.
  RetryDirective retry = 3;
  Phase phase = 4;
  // What a provider or hook reported while the request was failing. Empty where neither ran.
  repeated DiagnosticContext diagnostics = 7;
  // Which advertised limit was hit, and by how much. Present exactly when `code` is
  // `limit_exceeded`, and forbidden otherwise.
  optional LimitEvidence limit = 8;
  // What led to this failure, outermost first. A code alone rarely says whether the cause is
  // worth waiting out.
  repeated ErrorCause causes = 9;
}
// Which advertised limit a `limit_exceeded` failure hit, and by how much. It is present exactly
// when the code is `limit_exceeded`; without it, choosing between retrying smaller, falling
// back to another resource and giving up means reparsing the human message.
message LimitEvidence {
  // The limit's field path below `Limits`, such as `max_page_items` or
  // `execution.max_concurrent`.
  string field = 2;
  // The value in force when the request was rejected.
  int64 limit = 3;
  // What the request would have needed. Larger than `limit`, and the difference is what the
  // caller has to close.
  int64 required = 4;
}
// A link to one Rift resource, as MCP carries it inside tool output. `name` selects the family,
// which fixes the URI shape a read of `uri` accepts and the media type it returns.
message ResourceLink {
  // The resource to read. Hand it to `resources/read` unchanged.
  string uri = 1;
  // The resource family this link belongs to.
  ResourceFamily name = 2;
  // What a read of `uri` returns, as `application/vnd.rift.<family>+json`.
  string mime_type = 3;
}
// One advertised MCP resource template, as `resources/templates/list` returns it. The family
// fixes the template and the media type.
message ResourceTemplate {
  // The resource family being advertised.
  ResourceFamily name = 1;
  // What a read of a URI from this template returns, as `application/vnd.rift.<family>+json`.
  string mime_type = 2;
}
// The URI passed to MCP `resources/read`. Each branch is one advertised Rift resource family.
message ResourceReadParams {
  // A URI matching one advertised resource family.
  string uri = 1;
}
// One content block of an MCP resource read. `text` holds the family's payload as JSON —
// `WorkspaceResourcePayload` for `rift://workspace`, `FsResourcePayload` for an `rift://fs`
// URI, and so on — and `mimeType` names which. The `rift:contentTypes` map in the schema
// carries the complete pairing.
message ResourceContent {
  // The URI that was read, as it resolved.
  string uri = 1;
  // Which payload `text` holds, as `application/vnd.rift.<family>+json`.
  string mime_type = 3;
  // The payload, serialized as JSON.
  string text = 2;
}
// The result of one MCP resource read. Each Rift resource returns one JSON payload in `text`,
// identified by `mimeType`. File bytes use UTF-8 or base64.
message ResourceReadResult {
  // The blocks this read produced. MCP allows several per read; each Rift resource returns one.
  repeated ResourceContent contents = 1;
}
// A symbol hit: the declaration a provider resolved.
message SearchHitTargetSymbol {
  // The declaration that matched.
  rift.core.Symbol symbol = 1;
}
// A node hit: one place in a syntax tree, without its enclosing symbol record.
message SearchHitTargetNode {
  // The syntax-tree node that matched, and the symbol written at it where there is one.
  rift.core.Node node = 1;
}
// A file hit: one entry of the tree, whether or not any provider reads it.
message SearchHitTargetFile {
  // The tree entry that matched: what it holds, and which languages read it.
  rift.core.File file = 1;
}
// What a search hit is. Tagged, so the payload correlation survives code generation.
message SearchHitTarget {
  oneof variant {
    SearchHitTargetSymbol symbol = 1;
    SearchHitTargetNode node = 2;
    SearchHitTargetFile file = 3;
  }
}
// Gets declarations by name and returns them with their bodies inline, so one call
// replaces a search followed by paging through the file.
message GetSymbolParams {
  // The declaration name to look up — a name, not a free-text query; `search` takes those. An
  // exact symbol name ranks first, then prefix matches, then qualified-name substrings.
  string name = 1;
  // Narrows the answer to one language. Null searches every served language.
  optional rift.core.Language language = 2;
  // Whether each hit carries its declaration source.
  optional bool include_body = 3;
  // Whether each hit carries its version-control timeline and co-change coupling. Off by
  // default: a timeline is read when the caller is deciding about the symbol, not on every
  // lookup.
  optional bool include_history = 7;
  // Most hits to return in one page, capped by `max_page_items`.
  optional int64 limit = 4;
  // Continues a previous lookup where its last page ended.
  optional string cursor = 5;
  // The projection to read. Null reads the workspace tree.
  optional string projection = 6;
  // Source locations eligible for matches. All is the default because a known name may identify
  // a dependency or standard-library declaration.
  optional SearchScope scope = 8;
}
// One declaration a `get_symbol` lookup found.
message GetSymbolHit {
  // The declaration that matched.
  rift.core.Symbol symbol = 1;
  // The declaration node, whose identity `replace_symbol` can act on. Null when source is
  // unavailable or outside the project.
  optional rift.core.Node node = 2;
  // The declaration source when the request asked for bodies and the provider can read it. Null
  // for source-less declarations.
  optional SourceExcerpt source = 3;
  // The symbol's timeline, present when the request asked for history. Its coverage says how
  // far back the walk reached.
  optional rift.core.SymbolHistory history = 4;
  // Symbols that historically change with this one, strongest coupling first, present when the
  // request asked for history.
  repeated rift.core.CoChange co_changes = 5;
}
// One page of declarations matching a name.
message GetSymbolResult {
  // The declarations on this page, best match first.
  repeated GetSymbolHit hits = 1;
  // Coverage of the symbol index used for this lookup. An empty result proves absence only
  // where this is complete.
  rift.core.Coverage coverage = 2;
  // Cursor for the next page, or null after the final hit.
  optional string next_cursor = 3;
  // Tree and index revisions used for this result page.
  rift.core.ReadSnapshot snapshot = 4;
}
// Lists the syntax nodes covering one position, outermost first. It returns a witnessed
// address for an edit smaller than a declaration, such as one call expression.
message NodesParams {
  // Project-relative file to inspect.
  string path = 1;
  // UTF-8 byte offset the listed nodes must cover — one position, not a range; the nodes
  // themselves carry the spans.
  int64 position = 2;
  // The projection to read. Null reads the workspace tree.
  optional string projection = 3;
}
// The nodes covering one position. Each identity carries its witness, so an address
// taken from this listing refuses cleanly once the bytes drift.
message NodesResult {
  // Nodes covering the position, outermost first.
  repeated rift.core.Node nodes = 1;
  // The source of each node, in the same order.
  repeated SourceExcerpt source = 2;
  // Completeness of the node facts used to build the listing.
  rift.core.SemanticCoverage coverage = 3;
  // Tree revision and provider state used for this listing.
  rift.core.ReadSnapshot snapshot = 4;
}
// Replaces one declaration whole, addressed by its symbol. The parser derives the span, so the
// caller supplies no offsets; a name that resolves to several declarations refuses with
// `ambiguous_target` listing the candidates.
message ReplaceSymbolParams {
  // The declaration to replace.
  string symbol = 4;
  // Which part of the declaration to replace — `body` leaves the header and documentation
  // standing. Null replaces the enclosing declaration whole.
  optional rift.core.RegionRole region = 5;
  // The replacement source.
  string body = 6;
  // The projection the change applies to. Null changes the workspace tree.
  optional string projection = 7;
}
// Inserts a new declaration beside an existing one. Anchoring on a symbol keeps the operation
// placement-safe: the parser decides the exact bytes, so an insertion cannot land inside a
// neighboring declaration.
message InsertSymbolParams {
  // Which side of the anchor receives the new declaration.
  enum Position {
    // The caller did not set a value.
    POSITION_UNSPECIFIED = 0;
    // The new declaration lands immediately before the anchor.
    POSITION_BEFORE = 1;
    // The new declaration lands immediately after the anchor.
    POSITION_AFTER = 2;
  }
  // The existing declaration the new one lands beside.
  string anchor = 4;
  Position position = 5;
  // The new declaration's source.
  string body = 6;
  // The projection the change applies to. Null changes the workspace tree.
  optional string projection = 7;
}
// Replaces one syntax node, addressed by an identity a `nodes` listing returned. The address
// carries its witness, so a listing that has gone stale refuses with a failed
// `source_unchanged` precondition instead of splicing into moved bytes.
message ReplaceNodeParams {
  // The node to replace, witness included.
  string node = 4;
  // Which named part of the node to replace. Null replaces the node whole.
  optional rift.core.RegionRole region = 5;
  // The replacement source.
  string body = 6;
  // The projection the change applies to. Null changes the workspace tree.
  optional string projection = 7;
}
// A UTF-8 unified diff guarded by its context lines, for the change no symbol or node address
// fits — several scattered hunks, a new file plus an edit. A malformed patch — an absolute
// path, path traversal, a binary patch, a broken header — is `invalid_request`; a hunk whose
// context differs from the state it resolves against is a refusal carrying a failed
// `source_unchanged` precondition.
message PatchParams {
  // Unified text diff with project-relative `a/` and `b/` paths.
  string patch = 4;
  // The projection the change applies to. Null changes the workspace tree.
  optional string projection = 5;
}
// Restores changed paths of one projection from the current workspace.
message ProjectionRestoreParams {
  // The projection whose changed paths are restored.
  string projection = 1;
  // Changed paths to restore. Null restores every changed path. Naming any path of a change
  // restores every path that change touched — a change leaves the changeset whole.
  repeated string paths = 2;
}
// What a passing run of one configured hook establishes.
message HookGuarantee {
  // Guarantee established when the hook passes.
  rift.core.GuaranteeKind kind = 1;
  // Source over which the hook checks the property.
  rift.core.CoverageScope scope = 2;
  // Exact property the hook checks and limits on interpreting a pass.
  string detail = 3;
}
// A hook that runs an executable, without a shell, inside the tree a change applied to — the
// workspace itself, or the projection the change named. The command executes that changed tree.
// The server imports visible filesystem writes from a projection; VCS-ignored output outside
// its manifest remains untracked.
message CommandHook {
  // How workspace configuration presents this hook.
  enum Kind {
    // The caller did not set a value.
    KIND_UNSPECIFIED = 0;
    KIND_TEST = 1;
    KIND_LINT = 2;
    KIND_BUILD = 3;
    KIND_OTHER = 4;
  }
  // Whether Rift appends changed `ProjectPath` values to `argv` in byte order.
  enum ChangedPaths {
    // The caller did not set a value.
    CHANGED_PATHS_UNSPECIFIED = 0;
    CHANGED_PATHS_NONE = 1;
    CHANGED_PATHS_APPEND = 2;
  }
  // Whether an identical tree and environment are expected to produce the same result.
  enum Determinism {
    // The caller did not set a value.
    DETERMINISM_UNSPECIFIED = 0;
    DETERMINISM_DETERMINISTIC = 1;
    DETERMINISM_BEST_EFFORT = 2;
  }
  // Label shown with this hook. It is unique within `hooks`.
  string id = 1;
  Kind kind = 2;
  // Executable followed by literal arguments. An absolute executable path is refused; a bare
  // name resolves through the `PATH` of the merged environment the command runs with, and a
  // relative path resolves below `working_directory` in the changed tree. Rift performs no
  // shell expansion.
  repeated string argv = 3;
  ChangedPaths changed_paths = 4;
  // Directory below the changed tree's root in which the process starts. The empty path selects
  // the root.
  string working_directory = 5;
  // Environment values added on top of the environment the server inherited. Rift starts the
  // command directly, without a shell, and supplies its working directory separately.
  map<string, string> environment = 6;
  // Wall-clock limit before Rift terminates the process.
  int64 timeout_ms = 7;
  // Captured prefix limit for each output stream. `CapturedText.total_bytes` reports the
  // omitted size. The upper bound keeps one escaped hook result inside one bounded result.
  int64 output_limit_bytes = 8;
  // Behavior or other properties this hook is intended to check. A passing result turns each
  // declaration into `GuaranteeEvidence`; a failed result attaches a `ConfirmationRequirement`
  // to the change.
  repeated HookGuarantee guarantees = 9;
  Determinism determinism = 10;
}
// One workspace hook from the workspace-root `rift.toml`, run inside the changed tree
// each time a change applies. `type` selects how the hook runs; `command` is the only
// type.
message Hook {
  oneof variant {
    CommandHook command = 1;
  }
}
// One change in a changeset, with everything Rift learned while resolving it.
// A change carrying confirmations is recorded the same way as one carrying none; the
// confirmations are what publication checks.
message ChangeSummary {
  // Identity of this change in the changeset.
  string id = 1;
  // Whether Rift applied the change or imported it from the projection directory.
  ChangeOrigin origin = 2;
  // Paths whose entries differ because of this change, sorted bytewise. For a filesystem import
  // this is the authoritative scope even when no portable `Edit` represents the entry bytes.
  repeated string paths = 3;
  // Concrete edits in canonical file-and-range order. Empty for a filesystem import whose
  // binary or symbolic-link delta has no portable `Edit` form.
  repeated rift.core.Edit edits = 4;
  // Semantic effects in emission order.
  repeated rift.core.OperationEffect effects = 6;
  // Scoped guarantee evidence in guarantee-kind order.
  repeated rift.core.GuaranteeEvidence guarantees = 7;
  // Resolution findings in source order.
  repeated rift.core.Diagnostic diagnostics = 8;
  // Concerns providers and hooks attached to this change, warnings first. An open warning
  // instructs the caller; in a projection it also mints an `advisory` confirmation below.
  repeated rift.core.Advisory advisories = 9;
  // Effects the caller has to accept before this change can be published, sorted by kind,
  // source location, title, and detail. Empty for a change applied directly to the workspace,
  // where there is no publication to gate, and where every hook vouched for the result.
  repeated rift.core.ConfirmationRequirement confirmations = 10;
}
// One page of a changeset, oldest change first: every change applied, what each one did,
// and which of them nobody vouched for. For a projection this is the read the caller makes
// before publishing; for the workspace it is the journal of what already landed.
message ChangesResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // Projection state the page was read from, or null for the workspace journal — the workspace
  // tree has no publication to summarize.
  optional rift.core.ProjectionState state = 2;
  // Changes on this page, in the order they were applied.
  repeated ChangeSummary changes = 3;
  // The same resource carrying the cursor for the next page, or null on the last one.
  optional string next = 4;
  // Target-tree revision captured after filesystem changes were reconciled.
  rift.core.ReadSnapshot snapshot = 5;
}
// The operation resolved to edits and the server wrote them into the targeted tree.
message ChangeApplied {
  // The applied change and its evidence.
  ChangeSummary summary = 1;
}
// Resolution produced no edits, so the targeted tree is untouched.
message RefusedResult {
  // The condition the caller can act on.
  rift.core.RefusalReason reason = 2;
  // Conditions checked before refusal, including at least one failed entry for
  // `unmet_precondition`.
  repeated rift.core.OperationPrecondition preconditions = 3;
  // Existing code, paths, or relationships that prevented a deterministic resolution.
  repeated rift.core.OperationBlocker blockers = 4;
  // Evidence that explains the refusal.
  repeated rift.core.Diagnostic diagnostics = 5;
}
// An applied change or semantic refusal.
message ChangeResult {
  oneof variant {
    ChangeApplied applied = 1;
    RefusedResult refused = 2;
  }
}
// One recorded projection read whose workspace file changed before publication.
// Projection write paths use `conflicts` and do not also appear here. The caller can pass
// this exact value to `accept_dependencies`; another workspace change invalidates it.
message DependencyConflict {
  // File whose returned bytes informed work in the projection.
  string path = 1;
  // SHA-256 of the file bytes returned by the projection read.
  string observed = 2;
  // Current workspace file digest, or null when the workspace file no longer exists.
  optional string current = 3;
}
// Publishes one projection into the workspace. Publication settles change confirmations
// and read-dependency conflicts because it is the step that writes into the workspace. The
// caller accepts either condition only by naming its exact evidence.
message PublishParams {
  // The projection being published.
  string projection = 2;
  // Changes whose confirmations the caller accepts. A change carrying a confirmation and absent
  // here is returned in `unaccepted` and nothing is written.
  repeated string accept = 1;
  // Read-dependency conflicts whose exact `path`, `observed`, and `current` values the caller
  // accepts. The server recomputes each current digest while holding the workspace publication
  // lock; a changed value remains in `dependency_conflicts`.
  repeated DependencyConflict accept_dependencies = 3;
}
// The result of publishing one projection's changes into the workspace. A successful
// publication clears its changeset and recorded read dependencies; any listed conflict or
// unaccepted change leaves both trees unchanged.
message PublishResult {
  // Current projection state after the attempt.
  rift.core.ProjectionState state = 2;
  // Paths changed in both this projection and the workspace. Non-empty means nothing was
  // written.
  repeated string conflicts = 3;
  // Projection-read files whose workspace bytes changed, sorted by path. Each entry is reusable
  // in `accept_dependencies`; non-empty means nothing was written.
  repeated DependencyConflict dependency_conflicts = 5;
  // Changes carrying a confirmation that `accept` did not name, sorted by change identity.
  // Non-empty means nothing was written.
  repeated string unaccepted = 4;
}
// One filesystem entry from the workspace tree.
message FsResourcePayload {
  // How a filesystem resource entry is represented.
  enum Encoding {
    // The caller did not set a value.
    ENCODING_UNSPECIFIED = 0;
    ENCODING_DIRECTORY = 1;
    ENCODING_UTF8 = 2;
    ENCODING_BASE64 = 3;
    ENCODING_NONE = 4;
  }
  // Exact resource request this payload answers.
  string uri = 1;
  // Tree revision from which this entry was read.
  rift.core.ReadSnapshot snapshot = 2;
  // Directory, regular file, or symbolic link named by the URI.
  rift.core.ProjectEntry entry = 3;
  // How this entry's payload is represented.
  Encoding encoding = 4;
  // Directory children on this page — subdirectories and files alike, each one a complete
  // `ProjectEntry`, sorted bytewise by path.
  repeated rift.core.ProjectEntry entries = 5;
  optional int64 start = 6;
  optional int64 end = 7;
  optional int64 total_bytes = 8;
  optional string content = 9;
  // SHA-256 of the complete file for a regular-file read, null for directories and symlinks.
  // Compare it across pages of one range read: a changed digest means the file moved underneath
  // the read, and the range starts over at zero.
  optional string digest = 11;
  // Continuation for the same entry.
  optional string next = 10;
}
// Effective caller-code routing after Rift intersects `rift.toml` with the language's
// runtime capability.
message ExecutionAvailability {
  // Whether execute may route to this language after workspace configuration and runtime
  // capability are applied.
  bool execute = 1;
}
// One provider serving a language, and the fact families it produces there. Facts from
// several providers merge in `LanguageSupport.providers` order, and per-family coverage
// records the revisions that contributed.
message ProviderSummary {
  // Implementation name and version the provider reports.
  string implementation = 1;
  // Fact families this provider produces for the language, sorted by protocol order.
  repeated rift.core.FactFamily fact_families = 2;
  // Stable provider identity used by per-answer provenance.
  string id = 3;
  // Latest immutable fact revision this provider can serve. Null when `state` is `unavailable`.
  optional string revision = 4;
  // Current lifecycle state for this language.
  ProviderState state = 5;
}
// What serves one language: the providers producing facts, and the effective
// caller-code availability.
message LanguageSupport {
  // Language name and optional dialect.
  rift.core.Language language = 1;
  // Providers producing facts for this language, in merge precedence order. The first provider
  // supplying a scalar field wins; multi-valued facts are unioned by canonical identity.
  repeated ProviderSummary providers = 2;
  // Effective workspace configuration and runtime capability for caller code.
  ExecutionAvailability execution = 6;
}
// The operations the Rift server exposes. The server terminates MCP itself, over Streamable
// HTTP; `rift mcp` forwards stdio frames to it unchanged, so every method behaves the same
// whichever way the call arrived.
service Rift {
  // Gets project, dependency, or standard-library declarations by name. Each hit includes
  // declaration source when the provider can read it; `include_body: false` omits it, and
  // `include_history` adds project version-control history. Use `search` for lexical, filtered,
  // or relationship discovery.
  rpc GetSymbol (rift.mcp.GetSymbolParams) returns (rift.mcp.GetSymbolResult);
  // Searches symbols, nodes, and files by lexical `query`, provider `filter`, or bounded
  // relationship `traversal`. `scope` selects project, dependency, or all sources. Use
  // `traversal` for callers, callees, tests, edit ripple, or review context; use `get_symbol`
  // when the declaration name is known.
  rpc Search (rift.mcp.SearchParams) returns (rift.mcp.SearchResult);
  // Lists syntax nodes covering one byte position and returns witnessed addresses for
  // `replace_node`. Use it when the target is smaller than a declaration.
  rpc Nodes (rift.mcp.NodesParams) returns (rift.mcp.NodesResult);
  // Replaces one declaration addressed by symbol, with no caller-supplied offsets. The symbol
  // must resolve to project source; dependency, standard-library, external, and synthetic
  // declarations refuse as unsupported. Use `replace_node` for a smaller syntax region or
  // `patch` for scattered hunks.
  rpc ReplaceSymbol (rift.mcp.ReplaceSymbolParams) returns (rift.mcp.ChangeResult);
  // Inserts a new declaration immediately before or after an existing one. The parser decides
  // the exact bytes, so the insertion cannot land inside a neighboring declaration.
  rpc InsertSymbol (rift.mcp.InsertSymbolParams) returns (rift.mcp.ChangeResult);
  // Replaces one syntax node, addressed by a witnessed identity a `nodes` listing returned. A
  // stale listing refuses instead of splicing into moved bytes.
  rpc ReplaceNode (rift.mcp.ReplaceNodeParams) returns (rift.mcp.ChangeResult);
  // Applies every hunk of one unified diff atomically. Use it for scattered hunks, file
  // creation, or changes no symbol or node address expresses.
  rpc Patch (rift.mcp.PatchParams) returns (rift.mcp.ChangeResult);
  // Creates a pinned workspace snapshot. Changes targeting its id write the projection
  // directory until `publish` copies them into the workspace.
  rpc ProjectionCreate (rift.mcp.ProjectionCreateParams) returns (rift.mcp.Projection);
  // Lists projections and the state of each.
  rpc ProjectionList (rift.mcp.ProjectionListParams) returns (rift.mcp.ProjectionListResult);
  // Removes one projection and deletes its directory, unpublished changes included.
  rpc ProjectionRemove (rift.mcp.ProjectionRemoveParams) returns (rift.mcp.ProjectionRemoveResult);
  // Restores a projection's changed paths from the workspace and drops the changes that touched
  // them.
  rpc ProjectionRestore (rift.mcp.ProjectionRestoreParams) returns (rift.core.ProjectionState);
  // Reconciles direct filesystem writes, then publishes a projection's changeset into the
  // workspace. A changed write path, an unaccepted confirmation, or a changed read dependency
  // refuses the whole publication.
  rpc Publish (rift.mcp.PublishParams) returns (rift.mcp.PublishResult);
  // Evaluates code in the targeted tree's execution copy, where installed dependencies persist
  // between calls. The server does not synchronize copy writes back, but the runtime retains
  // the server's OS permissions outside that directory.
  rpc Execute (rift.mcp.ExecuteParams) returns (rift.mcp.ExecuteResult);
  rpc ReadResource (rift.mcp.ResourceReadParams) returns (rift.mcp.ResourceReadResult);
}
