// A UTF-8 unified diff guarded by its context lines. Rift refuses absolute paths, path
// traversal, binary patches, malformed headers, and any hunk whose context differs from the
// candidate state.
message PatchChange {
  // How formatting participates in a change. The policy is part of the preview identity, so
  // refresh and publish cannot widen its reach.
  enum FormattingPolicy {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Tags this as a unified diff.
  string kind = 1;
  // Unified diff in Git's text patch syntax, with project-relative `a/` and `b/` paths.
  string patch = 2;
  // Formatting applied after every hunk resolves.
  FormattingPolicy formatting = 3;
}
// One compiler action selected from `actions`. Rift validates `arguments` against the
// advertised schema and resolves the token. Refresh and publish rediscover at the descriptor's
// target. Kind, target, argument contract, argument schema, and guarantees select the same
// action. Zero or several matches cause a refusal.
message ActionChange {
  // How formatting participates in a change. The policy is part of the preview identity, so
  // refresh and publish cannot widen its reach.
  enum FormattingPolicy {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Tags this as a compiler action.
  string kind = 1;
  // The descriptor used for replay and the key used for initial resolution.
  ActionOffer action = 2;
  // Arguments accepted by the offer's `ActionDescriptor.arguments_schema`. An action with no
  // parameters receives an empty object.
  google.protobuf.Struct arguments = 3;
  // Formatting applied after the action's edits resolve.
  FormattingPolicy formatting = 4;
}
// An atomic query-and-rewrite over the candidate state. Rift finds every match, checks the
// cardinality, expands the replacement, and either applies all resulting edits or refuses the
// candidate.
message RewriteChange {
  // How formatting participates in a change. The policy is part of the preview identity, so
  // refresh and publish cannot widen its reach.
  enum FormattingPolicy {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Tags this as an atomic match rewrite.
  string kind = 1;
  // The text or structural pattern evaluated at this point in the change list.
  rift.core.MatchQuery query = 2;
  // UTF-8 replacement template. `${NAME}` inserts the source bound by a named or numeric
  // capture, `${0}` inserts the whole match, and `$$` inserts one dollar sign. An absent
  // capture refuses the rewrite.
  string replacement = 3;
  // The accepted number of matches before expansion.
  rift.core.MatchCardinality cardinality = 5;
  // Formatting applied after every replacement resolves.
  FormattingPolicy formatting = 6;
}
// A validated three-way inverse of one commit. Rift computes the difference from `parent` to
// `revision`, applies its inverse to the candidate state, and refuses overlapping changes it
// cannot merge without guessing.
message RevertChange {
  // How formatting participates in a change. The policy is part of the preview identity, so
  // refresh and publish cannot widen its reach.
  enum FormattingPolicy {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Tags this as a revision revert.
  string kind = 1;
  // Exact commit whose changes are inverted.
  string revision = 2;
  // Parent against which the commit's change is defined. Required for ordinary and merge
  // commits; null selects the empty tree for a root commit. A commit that does not have this
  // parent is refused.
  optional string parent = 3;
  // Paths from the original commit eligible for inversion. Excluded paths remain untouched; the
  // commit diff exposes them when the caller needs to inspect the omission.
  rift.core.PathSelector paths = 4;
  // Formatting applied after the inverse edits resolve.
  FormattingPolicy formatting = 5;
}
// Bounded summary of one requested change after resolution. The preview resource pages its
// exact edits and evidence as records carrying this change index.
message ResolvedChange {
  // Zero-based position in the ordered request.
  int64 index = 1;
  // Language adapters that contributed to resolution, sorted by language. Empty for a change
  // resolved entirely by Rift.
  repeated string owners = 2;
  // Number of concrete Edit records retained for this change.
  int64 edit_count = 3;
  // Number of satisfied preconditions retained for this change.
  int64 precondition_count = 4;
  // Number of semantic effects retained for this change.
  int64 effect_count = 5;
  // Number of guarantee evidence records retained for this change.
  int64 guarantee_count = 6;
  // How completely Rift and its adapters resolved the request. Publication requires complete
  // coverage.
  rift.core.Coverage coverage = 7;
  // Number of resolution diagnostics retained for this change.
  int64 diagnostic_count = 8;
}
message SandboxedValidatorGuarantees {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or sandbox validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // Requested change indexes to which this evidence applies.
  repeated int64 changes = 1;
  // Guarantee established when the validator passes.
  GuaranteeKind kind = 2;
  // Source over which the command checks the property.
  rift.core.CoverageScope scope = 3;
  // Exact property the command checks and limits on interpreting a pass.
  string detail = 4;
}
// A caller-authorized acceptance check executed directly, without a shell, in a disposable copy
// of the complete candidate tree. The sandbox denies network access, mounts external
// dependencies read-only, and discards every write when the check ends.
message SandboxedValidator {
  // Caller label shown with this validator. The result links to the complete declaration by
  // digest, so labels may repeat.
  string id = 1;
  // Executable followed by literal arguments. An absolute executable path is refused; a bare
  // name resolves through the sandbox PATH and a relative path resolves below
  // `working_directory`. Rift performs no shell expansion.
  repeated string argv = 3;
  // Directory below the project root in which the process starts. The empty path selects the
  // root.
  string working_directory = 5;
  // Caller-supplied environment additions. Rift supplies a policy-controlled PATH, private HOME
  // and temporary directories, and a UTF-8 locale; it removes host secrets and every other
  // inherited variable.
  map<string, string> environment = 6;
  // Wall-clock limit before Rift terminates the process.
  int64 timeout_ms = 7;
  // Captured prefix limit for each output stream. `ValidatorOutput.total_bytes` reports the
  // omitted size. The upper bound keeps one escaped validator result inside a 65536-byte
  // preview page.
  int64 output_limit_bytes = 8;
  // Behavior or other properties this command is intended to check. A passing result turns each
  // declaration into `GuaranteeEvidence`; a failed result rejects publication.
  repeated SandboxedValidatorGuarantees guarantees = 9;
  // Network policy enforced by the sandbox.
  string network = 11;
}
// A bounded UTF-8 rendering of one process stream. Invalid byte sequences become U+FFFD. The
// digest covers the complete raw stream, including bytes beyond the captured prefix.
message ValidatorOutput {
  // Decoded captured prefix.
  string text = 1;
  // Raw bytes represented by `text` before replacement decoding.
  int64 captured_bytes = 2;
  // Raw bytes emitted by the complete stream.
  int64 total_bytes = 3;
  // Whether bytes after the captured prefix were omitted from `text`.
  bool truncated = 4;
  // SHA-256 of the complete raw stream. This retains the identity of omitted bytes when
  // `truncated` is true.
  string digest = 5;
}
// A declared validator process that exited with status zero.
message ValidatorResultPassed {
  optional int64 exit_code = 1;
  // SHA-256 of the validator's RFC 8785 canonical JSON declaration. Results and declarations
  // form a bijection on this value, because labels may repeat while commands differ.
  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  ValidatorOutput stdout = 5;
  // Bounded standard error from the process.
  ValidatorOutput stderr = 6;
}
// A declared validator process that exited with a nonzero status.
message ValidatorResultFailed {
  int64 exit_code = 1;
  // SHA-256 of the validator's RFC 8785 canonical JSON declaration. Results and declarations
  // form a bijection on this value, because labels may repeat while commands differ.
  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  ValidatorOutput stdout = 5;
  // Bounded standard error from the process.
  ValidatorOutput stderr = 6;
}
// The completed outcome of one declared validator. Exit status zero passes. Every other exit
// status fails. A launch, timeout, sandbox, or capture failure raises `sandbox_failure` before
// Rift produces candidate evidence.
message ValidatorResult {
  oneof variant {
    ValidatorResultPassed passed = 1;
    ValidatorResultFailed failed = 2;
  }
}
// Bounded verdict over a candidate's compiler reports and sandbox validators. The preview
// resource carries the complete paginated evidence.
message CandidateValidation {
  // Whether every affected language returned complete compiler coverage and every declared
  // validator produced a result.
  bool complete = 1;
  // True when `complete` is true, every compiler report is valid, and every validator result
  // passed. Publication requires true.
  bool valid = 2;
  // Number of compiler reports retained by the preview.
  int64 adapter_reports = 3;
  // Number of sandbox validator results retained by the preview.
  int64 validator_results = 4;
  // Number of retained validator results with `passed` status.
  int64 validators_passed = 5;
}
// The bounded identity and acceptance evidence returned by `apply`. The linked preview resource
// carries the complete requested and resolved plan.
message CandidateSummary {
  // The retained plan's stable identity.
  string preview = 1;
  // The state against which the first change was resolved.
  rift.core.Snapshot base = 2;
  // The immutable Git commit containing every resolved edit. It remains outside the accepted
  // ref until publication succeeds.
  string candidate = 3;
  // Link to the complete retained plan.
  PreviewResourceLink resource = 4;
  // Bounded verdict and evidence counts for this candidate.
  CandidateValidation validation = 5;
  // Number of acknowledgement requirements retained in the preview resource.
  int64 confirmation_count = 6;
}
message PreviewResourcePayloadEdits {
  // Requested change index that produced this edit.
  int64 change = 1;
  // Concrete filesystem effect.
  rift.core.Edit edit = 2;
}
message PreviewResourcePayloadPreconditions {
  // Requested change index checked by this condition.
  int64 change = 1;
  rift.core.OperationPrecondition precondition = 2;
}
message PreviewResourcePayloadEffects {
  // Requested change index that produced this effect.
  int64 change = 1;
  rift.core.OperationEffect effect = 2;
}
message PreviewResourcePayloadGuarantees {
  // Requested change index supported by this evidence.
  int64 change = 1;
  rift.core.GuaranteeEvidence evidence = 2;
}
message PreviewResourcePayloadResolutionDiagnostics {
  // Requested change index that produced this finding.
  int64 change = 1;
  rift.core.Diagnostic diagnostic = 2;
}
// One page of a retained candidate contract. Concatenating every array from successive pages
// reconstructs the complete plan and validation evidence. Every page repeats the URI, base,
// candidate, and bounded validation verdict.
message PreviewResourcePayload {
  // The preview resource URI for this page.
  string uri = 1;
  // The state from which resolution began.
  rift.core.Snapshot base = 2;
  // The immutable candidate commit produced by the complete plan.
  string candidate = 3;
  // Caller-supplied checks on this page, preserving declaration order.
  repeated SandboxedValidator validators = 4;
  // Requested changes on this page, preserving their transaction order.
  repeated Change requested = 5;
  // Bounded resolution summaries on this page, ordered by request index.
  repeated ResolvedChange resolved = 6;
  // Concrete edits on this page, ordered by change index and canonical edit order.
  repeated PreviewResourcePayloadEdits edits = 7;
  // Satisfied preconditions on this page, ordered by change index and check order.
  repeated PreviewResourcePayloadPreconditions preconditions = 8;
  // Semantic effects on this page, ordered by change index and adapter emission order.
  repeated PreviewResourcePayloadEffects effects = 9;
  // Guarantee evidence on this page, ordered by change index and guarantee kind.
  repeated PreviewResourcePayloadGuarantees guarantees = 10;
  // Resolution findings on this page, ordered by change index and source location.
  repeated PreviewResourcePayloadResolutionDiagnostics resolution_diagnostics = 11;
  // File-level diff entries on this page, ordered by the path present after the change and then
  // by the path present before it.
  repeated rift.core.FileChange files = 12;
  // Bounded verdict for the complete candidate.
  CandidateValidation validation = 13;
  // Compiler reports on this page, sorted by language and unique across the complete resource.
  repeated rift.core.ValidationReport adapter_reports = 14;
  // Sandbox validator results on this page, preserving declaration order and appearing once
  // across the complete resource.
  repeated ValidatorResult validator_results = 15;
  // Acknowledgements on this page, sorted by id across the complete resource.
  repeated rift.core.ConfirmationRequirement confirmations = 16;
  // Rift findings about the complete plan, including path, ownership, and formatting decisions.
  repeated rift.core.Diagnostic diagnostics = 17;
  // The URI for the next plan page, or null after the final page.
  optional string next = 18;
}
// One phase of the candidate lifecycle for one repository. Preview creates a retained plan,
// refresh re-resolves that plan on a selected base, and publish attempts to advance the
// accepted ref with the retained contract. Future federation composes independent Apply calls
// and records partial outcomes and compensation across their separate compare-and-swap
// boundaries.
message ApplyParams {
  oneof variant {
    PreviewApplyParams preview_apply_params = 1;
    RefreshApplyParams refresh_apply_params = 2;
    PublishApplyParams publish_apply_params = 3;
  }
}
// Builds and validates an immutable candidate while leaving the accepted ref and session
// worktree unchanged.
message PreviewApplyParams {
  // Selects candidate creation.
  string mode = 1;
  // State against which resolution begins. Omission selects the workspace's current accepted
  // revision.
  optional string rev = 2;
  // Ordered deterministic changes. Each observes the result of its predecessors.
  repeated Change changes = 3;
  // Caller-supplied acceptance checks. The `edit` profile accepts an empty array. The `full`
  // profile may accept up to `Limits.max_validators` declarations.
  repeated SandboxedValidator validators = 4;
}
// Re-resolves a retained preview's exact changes and validators on a selected base. It creates
// a new preview and leaves the accepted ref unchanged.
message RefreshApplyParams {
  // Selects preview refresh.
  string mode = 1;
  // The retained contract to run again.
  string previous = 2;
  // New base. Omission selects the current accepted revision.
  optional string rev = 3;
}
// Attempts to advance the accepted ref with a retained preview. Rift replays resolution and
// validation. Every deterministic preview record and the candidate tree must match. It then
// compares the accepted ref with the retained base and advances it to the candidate. Fresh
// validator verdicts govern publication; captured output may differ.
message PublishApplyParams {
  // Selects publication.
  string mode = 1;
  // The retained contract to publish.
  string preview = 2;
  // Caller-chosen retry key. Rift retains the key with the exact publish request and result,
  // returning that result on an exact retry and refusing reuse with different input.
  string idempotency_key = 3;
  // Every currently required confirmation id, sorted bytewise. Missing or extra ids refuse
  // publication.
  repeated int64 confirmations = 4;
}
// A completed candidate lifecycle decision. Malformed requests, unavailable infrastructure,
// storage faults, and sandbox failures use `ErrorData`.
message ApplyResult {
  oneof variant {
    PreviewApplyResult preview_apply_result = 1;
    RefreshApplyResult refresh_apply_result = 2;
    AcceptedApplyResult accepted_apply_result = 3;
    RejectedApplyResult rejected_apply_result = 4;
    RefusedApplyResult refused_apply_result = 5;
    ConflictApplyResult conflict_apply_result = 6;
  }
}
// A retained preview created without advancing the accepted ref or materializing its files.
message PreviewApplyResult {
  // Identifies preview creation.
  string status = 1;
  // Candidate identity and acceptance evidence.
  CandidateSummary summary = 2;
}
// A new retained preview produced from an earlier contract and a selected base.
message RefreshApplyResult {
  // Identifies preview refresh.
  string status = 1;
  // The preview whose contract was rerun.
  string previous = 2;
  // Identity and evidence for the refreshed candidate.
  CandidateSummary summary = 3;
  // Number of request indexes whose resolved owner, edits, preconditions, effects, guarantees,
  // coverage, or diagnostics differ from the previous preview. Comparing the two preview
  // resources yields the exact indexes.
  int64 changed_request_count = 4;
  // Number of candidate paths that differ from the previous preview. Comparing the paginated
  // file records yields the exact paths.
  int64 changed_file_count = 5;
}
// Publication advanced the accepted ref to the retained candidate commit. `accepted` therefore
// equals `summary.candidate`. The session worktree remains unchanged until `persist`
// materializes it.
message AcceptedApplyResult {
  // Identifies successful publication.
  string status = 1;
  // The published candidate and its acceptance evidence.
  CandidateSummary summary = 2;
  // The commit now held by the accepted ref.
  string accepted = 3;
  // Whether Rift returned a previously stored result for this exact idempotency key and
  // request.
  bool replayed = 4;
}
// Publication reran the retained contract and validation did not pass. The candidate remains
// readable as a preview and the accepted ref is unchanged.
message RejectedApplyResult {
  // Identifies validation rejection.
  string status = 1;
  // The rejected candidate and the evidence that prevented acceptance.
  CandidateSummary summary = 2;
}
// Resolution or publication stopped before a valid candidate outcome existed. No accepted ref
// or session worktree changes.
message RefusedApplyResult {
  // Identifies a domain refusal.
  string status = 1;
  // State against which the refused work was attempted.
  rift.core.Snapshot base = 2;
  // Zero-based requested change that caused the refusal, or null for a publication-wide
  // condition.
  optional int64 change = 3;
  // Conditions checked before refusal, including at least one failed entry for
  // `unmet_precondition`.
  repeated rift.core.OperationPrecondition preconditions = 5;
  // Existing code, paths, or relationships that prevented a deterministic resolution.
  repeated rift.core.OperationBlocker blockers = 6;
  // Evidence that explains the refusal.
  repeated rift.core.Diagnostic diagnostics = 7;
  // Deterministic replacement changes that satisfy the condition Rift could identify. Empty
  // when no safe repair is known.
  repeated Change suggestions = 8;
}
// Publication reached compare-and-swap after another accepted change had moved the ref, or
// reused an idempotency key for different input. The accepted ref is unchanged by this request.
message ConflictApplyResult {
  // Identifies an optimistic concurrency conflict.
  string status = 1;
  // Accepted snapshot the retained preview expected.
  rift.core.Snapshot base = 3;
  // Accepted snapshot observed at publication time.
  rift.core.Snapshot current = 4;
}
// Selects files from one accepted commit for materialization into the session worktree. Omitted
// `paths` selects every changed path.
message PersistParams {
  // Accepted commit whose tree supplies the desired entries.
  string revision = 1;
  // Changed project paths to materialize. Omission selects all paths changed by the accepted
  // commit.
  repeated string paths = 2;
  // Whether entries absent from the accepted tree may be removed from the worktree.
  optional bool include_deletions = 3;
}
// The materialization decision for one selected path. Safety conditions are reported as skips.
// Materialization keeps sparse-checkout boundaries, leaves child repositories untouched, and
// does not hydrate external content.
message PersistOutcome {
  // Selected project path.
  string path = 1;
}
// Materialization outcomes for one accepted commit. Results follow project-path byte order.
// Rift enumerates the selected paths and verifies that every outcome fits `max_response_bytes`
// before writing any path.
message PersistResult {
  // Accepted commit used as the source tree.
  string revision = 1;
  // Whether every selected path is `written` or `unchanged`.
  bool all_written = 2;
  // One result per selected path.
  repeated PersistOutcome outcomes = 3;
}
message FileResourcePayloadUtf8FileContent {
  optional string kind = 1;
}
message FileResourcePayloadUtf8File {
  optional FileResourcePayloadUtf8FileContent content = 1;
}
// A range whose bytes decode as UTF-8. Start and end fall on UTF-8 code-point boundaries.
message FileResourcePayloadUtf8 {
  optional string content = 1;
  optional FileResourcePayloadUtf8File file = 2;
}
message FileResourcePayloadBase64FileContent {
  optional string kind = 1;
}
message FileResourcePayloadBase64File {
  optional FileResourcePayloadBase64FileContent content = 1;
}
// A range carried as canonical base64 because its bytes do not form valid UTF-8.
message FileResourcePayloadBase64 {
  optional string content = 1;
  optional FileResourcePayloadBase64File file = 2;
}
message FileResourcePayloadNoneFileContent {
  enum Kind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    LFS_POINTER = 1;
    SYMLINK = 2;
    GITLINK = 3;
  }
  optional Kind kind = 1;
}
message FileResourcePayloadNoneFile {
  optional FileResourcePayloadNoneFileContent content = 1;
}
// A non-regular tree entry. Its empty interval carries no bytes and has no continuation.
message FileResourcePayloadNone {
  optional int64 start = 1;
  optional int64 end = 2;
  optional int64 total_bytes = 3;
  optional google.protobuf.Value content = 4;
  optional google.protobuf.Value next = 5;
  optional FileResourcePayloadNoneFile file = 6;
}
// One bounded byte range from a file at one state. Regular files carry UTF-8 text where the
// selected bytes form valid UTF-8 and base64 otherwise. `next` continues at `end` until the
// complete file has been read.
message FileResourcePayload {
  oneof variant {
    FileResourcePayloadUtf8 utf8 = 1;
    FileResourcePayloadBase64 base64 = 2;
    FileResourcePayloadNone none = 3;
  }
}
// What Rift can do for one language in this workspace, and which compiler is doing it. An agent
// uses this to select queries and operations. File recognition, virtual inputs, and compiler
// write claims remain on the adapter seam.
message LanguageSupport {
  // Which language this entry answers for. It is the adapter's identity too, since one
  // workspace runs one adapter per language.
  string language = 1;
  // The compiler name and version used by this adapter process. It remains fixed for the
  // process lifetime and is reported once with the workspace capabilities.
  string compiler = 2;
  // What the adapter build driving that compiler calls itself. Two adapter versions can read
  // one compiler differently, so the pair is what a bug report needs.
  string adapter = 3;
  // Coverage and failure reason for structural matching in this language. Unsupported coverage
  // distinguishes a missing parser from a complete query with no matches.
  rift.core.Coverage structural_matching = 4;
  // Coverage and failure reason for compiler action discovery.
  rift.core.Coverage actions = 5;
  // Supported action families in kind-prefix order. An empty array with complete `actions`
  // coverage means the compiler offers no actions; unsupported coverage means Rift cannot know.
  repeated rift.core.ActionSupport action_kinds = 6;
  // Whether the adapter can validate a changed compiler closure completely enough for
  // publication.
  rift.core.Coverage validation = 7;
  // Whether the adapter can format changed syntax regions or complete affected files.
  rift.core.Coverage formatting = 8;
}
// The Protobuf service exposed by the Rift server. rift-mcp maps its JSON entry points to these
// methods using mcp.json metadata.
service Rift {
  // Lists the project tree at one snapshot. Rift derives directories from Git paths and answers
  // without starting a language adapter. A depth of one is an `ls`; an unbounded depth with
  // path selectors is a recursive tree, glob, or file find.
  rpc Tree (rift.mcp.TreeParams) returns (rift.mcp.TreeResult);
  // Reads the compiler-owned declaration structure of one file. Results preserve source nesting
  // and carry semantic coverage, so an empty outline distinguishes an empty file from an
  // unsupported language.
  rpc Outline (rift.mcp.OutlineParams) returns (rift.mcp.OutlineResult);
  // Ranked lookup of symbols, leaves and files. A lexical query finds names or text; a
  // structured filter walks compiler facts. Path selectors narrow either form. Every page
  // carries its total order, continuation cursor, and coverage.
  rpc Search (rift.mcp.SearchParams) returns (rift.mcp.SearchResult);
  // Finds byte ranges. Rift runs literal and regular-expression matching over every UTF-8 file.
  // The owning compiler parses structural patterns because it defines the language's syntax.
  // Every hit carries a key an edit can address.
  rpc Match (rift.mcp.MatchParams) returns (rift.mcp.MatchResult);
  // Asks a compiler what it can offer at one address: the fixes and refactors it would suggest
  // there. Each result carries the snapshot and adapter token needed for resolution. Rift
  // refuses a token after its snapshot moves. Call this tool after a diagnostic or before a
  // refactor.
  rpc Actions (rift.mcp.ActionsParams) returns (rift.mcp.ActionsResult);
  // Builds, refreshes, or publishes a deterministic candidate. Preview retains each request
  // with its checked preconditions, exact edits, semantic effects, guarantee evidence, diff,
  // validation, and confirmations. Refresh repeats that contract on a newer base. Publish
  // replays it and advances the accepted ref when the retained plan still agrees, fresh
  // validation passes, and the base still matches.
  rpc Apply (rift.mcp.ApplyParams) returns (rift.mcp.ApplyResult);
  // Materializes an accepted commit into the session worktree. Each requested path reports its
  // own outcome, so drift, sparse checkout rules, nested repositories, and deletion policy
  // remain visible to the caller.
  rpc Persist (rift.mcp.PersistParams) returns (rift.mcp.PersistResult);
  rpc ReadResource (rift.mcp.ResourceReadParams) returns (rift.mcp.ResourceReadResult);
}
