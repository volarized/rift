  enum Strength {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // No affected adapter supplied a semantic validation report.
    STRENGTH_MECHANICAL = 1;
    // Every affected adapter that advertises validation supplied a complete report.
    STRENGTH_AVAILABLE = 2;
    // Every language named by repository validation policy supplied a complete report.
    STRENGTH_REQUIRED = 3;
  }
  // Whether every completed adapter report accepted the resulting tree.
  bool valid = 1;
  // Whether every adapter required by repository policy returned complete coverage.
  bool complete = 2;
  // Semantic validation strength established for the resulting tree.
  Strength strength = 3;
  // Adapter reports in language order.
  repeated rift.core.ValidationReport adapter_reports = 4;
}
// Git identity, diff, resolution evidence, and validation for one committed change.
message ChangeSummary {
  // Session-ref head replaced by this operation.
  string previous = 1;
  // Commit now held by the session ref.
  string commit = 2;
  // Link to the Git diff from `previous` to `commit`.
  DiffResourceLink diff = 3;
  // Bounded evidence from resolving the requested operation.
  ResolvedOperation resolved = 4;
  // Adapter validation of the resulting commit.
  ChangeValidation validation = 5;
  // Concrete edits in canonical file-and-range order.
  repeated rift.core.Edit edits = 6;
  // Satisfied preconditions in check order.
  repeated rift.core.OperationPrecondition preconditions = 7;
  // Semantic effects in adapter emission order.
  repeated rift.core.OperationEffect effects = 8;
  // Scoped guarantee evidence in guarantee-kind order.
