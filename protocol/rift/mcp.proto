// `ExecutionLimits.debug` means policy disables debugging.
message DebugLimits {
  // Debugging sessions retained across all connections in this workspace.
  int64 max_sessions = 1;
  // Milliseconds without debug_get_frame or debug_stop after which Rift stops the session and
  // releases its execution workspace.
  int64 idle_timeout_ms = 2;
  // Stack frames one failed debugging evaluation may retain.
  int64 max_frames = 3;
  // Arguments plus locals one debug frame may return.
  int64 max_bindings_per_frame = 4;
  // Captured UTF-8 bytes in each rendered binding value.
  int64 max_value_bytes = 5;
}
// Workspace policy ceilings for caller-provided code. Null at `Limits.execution` means
// policy disables execution, regardless of adapter capability.
message ExecutionLimits {
  // UTF-8 bytes accepted in one CodeBlock.source.
  int64 max_code_bytes = 1;
  // Wall-clock milliseconds allowed for one evaluation.
  int64 max_timeout_ms = 2;
  // Captured prefix bytes allowed separately for stdout and stderr.
  int64 max_output_bytes = 3;
  // Evaluations running concurrently across all connections in the workspace.
  int64 max_concurrent = 4;
  // Debugging ceilings, or null when debugging policy is disabled.
  optional DebugLimits debug = 5;
}
// The ceilings this server enforces on MCP requests and responses. They come from host policy
// at launch, so two workspaces running the same Rift can differ. A request over one of them, or
// a response that would be, fails with `limit_exceeded` carrying `LimitEvidence`.
message Limits {
  // Largest request body the server accepts, in bytes. A deep filter tree or a long structural
  // pattern is the usual way to exceed it.
  int64 max_request_bytes = 1;
  // Largest serialized tool result or resource page Rift returns. Paginated answers stop before
  // this boundary and provide a cursor; an indivisible result that cannot fit fails with
  // `limit_exceeded`. Conforming `read` implementations advertise at most 65536 bytes, below
  // the truncation boundary of common MCP harnesses.
  int64 max_response_bytes = 2;
  // Largest RFC 8785 JSON encoding of one indivisible item in a paginated answer, such as one
  // Change, Edit, diagnostic, or validator result. Resolution fails with `limit_exceeded`
  // before committing a change when one item exceeds this value. Host policy sets it at or
  // below 49152 bytes, leaving page space for identity and cursors.
  int64 max_record_bytes = 3;
  // Most source bytes one file resource page carries before UTF-8 or base64 serialization. Rift
  // may return fewer bytes to preserve a UTF-8 boundary and stay within `max_response_bytes`.
  int64 max_file_chunk_bytes = 4;
  // Ceiling on `limit` for every paginated tool. Asking for more is `invalid_request`; asking
  // for less than this still permits a shorter page.
  int64 max_page_items = 5;
  // How far a relationship filter may walk. Transitive callers of a widely used function fan
  // out fast, and this is what stops one query from touching the whole graph.
  int64 max_relation_depth = 6;
  // Most top-level `Change` values one mutation request accepts.
  int64 max_changes = 7;
  // Most concrete `Edit` values one resolved operation may contain across every change.
  int64 max_edits = 8;
  // How many repository-declared command checks may run before one integration. Zero when
  // repository or user policy admits none.
  int64 max_validators = 9;
  // Most concrete edits one atomic `RewriteChange` may produce after matching.
  int64 max_rewrite_expansions = 10;
  // Caller-code execution ceilings. Null means host policy disables execute and all debug
  // tools; adapter capability alone never enables them.
  optional ExecutionLimits execution = 11;
}
// Capability manifest for one repository workspace, including configured languages, adapter
// support, resolved state, and request limits.
message RepositoryResourcePayload {
  enum Tools {
    // The caller did not set a value.
    TOOLS_UNSPECIFIED = 0;
    // Snapshot-pinned project tree listing over every file, without an adapter.
    TOOLS_TREE = 1;
    // Adapter-owned declaration structure and diagnostics for one file.
    TOOLS_OUTLINE = 2;
    // Ranked lookup of symbols, nodes and files.
    TOOLS_SEARCH = 3;
    // Literal, regular-expression and structural matching, with a key per hit.
    TOOLS_MATCH = 4;
    // Commits concrete edits to the session ref.
    TOOLS_EDIT = 5;
    // Commits a unified diff to the session ref.
    TOOLS_PATCH = 6;
    // Commits replacements for every accepted match of one query.
    TOOLS_REWRITE = 7;
    // Commits the three-way inverse of one commit.
    TOOLS_REVERT = 8;
    // Runs Git's merge operation in the session worktree.
    TOOLS_MERGE = 9;
    // Changes what a declaration is called and rewrites its references.
    TOOLS_RENAME = 10;
    // Moves a declaration or file and updates imports and references.
    TOOLS_MOVE = 11;
    // Removes a declaration, mechanically or with a reference-aware policy.
    TOOLS_DELETE = 12;
    // Changes a callable's shape and propagates it to callers and overrides.
    TOOLS_CHANGE_SIGNATURE = 13;
    // Resolves one discovered adapter action that has no portable contract.
    TOOLS_ACT = 14;
    // Merges the session head into a local branch and reports Git conflicts.
    TOOLS_INTEGRATE = 15;
    // Evaluates a code block in one adapter's revision-specific project runtime.
    TOOLS_EXECUTE = 16;
    // Starts an inspect-only debugging evaluation.
    TOOLS_DEBUG_START = 17;
    // Reads one retained stack frame from a debugging session.
    TOOLS_DEBUG_GET_FRAME = 18;
    // Releases a debugging session and its execution workspace.
    TOOLS_DEBUG_STOP = 19;
  }
  enum Resources {
    // The caller did not set a value.
    RESOURCES_UNSPECIFIED = 0;
    // Workspace capabilities, resolved state, request limits, and cache policy.
    RESOURCES_REPOSITORY = 1;
    // One symbol, its nodes, its edges and its diagnostics.
    RESOURCES_SYMBOL = 2;
    // What changed between two revisions.
    RESOURCES_DIFF = 3;
    // One file's tree entry and its bytes.
    RESOURCES_FILE = 4;
    // The fixes and refactors an adapter offers at one address, or across one file.
    RESOURCES_ACTIONS = 5;
    // One discovered action, with the schema of the arguments it takes.
    RESOURCES_ACTION = 6;
  }
  // Git object hash used by this repository. It determines whether a `Commit` contains 40 or 64
  // hexadecimal characters.
  enum ObjectFormat {
    // The caller did not set a value.
    OBJECT_FORMAT_UNSPECIFIED = 0;
    // Object IDs are 40 hex characters. Still git's default.
    OBJECT_FORMAT_SHA1 = 1;
    // Object IDs are 64 hex characters. A repository created with `--object-format=sha256`.
    OBJECT_FORMAT_SHA256 = 2;
  }
  // Runtime conformance level verified for this workspace. Profiles accumulate. Shared checks
  // validate schemas and examples, reference reachability, axis ownership, generated Protobuf
  // output, adapter service compilation, and the handshake. Runtime fixtures cover ordering,
  // limits, typed failures, the shared-worktree barrier, and topological virtual-source sync.
  // `Contract` identifies the schema under test.
  enum ConformanceProfile {
    // The caller did not set a value.
    CONFORMANCE_PROFILE_UNSPECIFIED = 0;
    // Serves the read tools plus repository, symbol, diff, and file resources. Fixtures
    // reconstruct file bytes, verify language summaries and match tags, replay cursors, reject
    // stale state, preserve coverage, and stop at gitlinks. Fixtures cover shared-worktree
    // languages and retained virtual files. Mechanical reads and warm cached semantic reads run
    // with adapters stopped. Fixed repositories record latency, bytes, tokens, and adapter
    // memory.
    CONFORMANCE_PROFILE_READ = 1;
    // Adds session change tools, integration, adapter formatting, and adapter validation.
    // Fixtures exercise every change and advertised action family, ref-only read sessions,
    // first-change worktree materialization, expected-head races, Git merge conflicts and
    // target races, cancellation, lost-response recovery from Git state, and process restart.
    // Command validators remain unavailable and `max_validators` is zero.
    CONFORMANCE_PROFILE_EDIT = 2;
    // Adds repository-declared command validators and caller-code execution. Fixtures verify
    // direct execution without shell expansion, disposable-workspace cleanup, environment
    // construction, timeouts, bounded output capture, and restartable adapter processes. A
    // release claim also runs the suite with two different language adapters and one
    // embedded-language repository.
    CONFORMANCE_PROFILE_FULL = 3;
  }
  // The URI this payload answers for, echoed back with the revision and cursor it resolved.
  string uri = 1;
  // The snapshot this answer was resolved against. Pass it back as `rev` when a later call has
  // to agree with this one.
  rift.core.Snapshot at = 2;
  // Protocol version and schema identifier for every other field in this payload.
  Contract contract = 3;
  // The ceilings a request has to stay inside here.
  Limits limits = 4;
  // Configured languages and their capabilities, sorted by name and dialect with null first.
  repeated LanguageSupport languages = 5;
  // How complete each fact family is across the workspace. A family reported `unsupported` here
  // remains unsupported in subsequent answers.
  rift.core.SemanticCoverage coverage = 6;
  // The MCP tools this workspace serves. A tool the profile or host policy does not reach is
  // absent from this list and from `tools/list`. Execute appears when at least one
  // LanguageSupport.execution.execute is true; the debug triplet appears together when at least
  // one LanguageSupport.execution.debug is true.
  repeated Tools tools = 7;
  // The MCP resource families this workspace serves.
  repeated Resources resources = 8;
  // The same resource carrying the cursor for the next page, or null on the last one.
  optional string next = 9;
  // Which hash git uses for object IDs in this repository. It decides how long a `Commit` is,
  // so a client that validates one has to read this first.
  ObjectFormat object_format = 10;
  // The pattern grammars the `match` tool accepts here.
  MatchSyntax matching = 11;
  // The tier this workspace passes on this host. `edit` gates session changes and integration;
  // `full` also gates command validators and caller-code execution.
  ConformanceProfile profile = 12;
  // Repository-declared integration checks admitted by current user policy, in execution order.
  // Empty when none are effective.
  repeated CommandValidator validators = 13;
}
// One page of search hits, and what the page is worth. `coverage` is what makes an empty page
// readable: nothing matched, or Rift could not see far enough to know.
message SearchResult {
  // The snapshot this answer was resolved against. Pass it back as `rev` when a later call has
  // to agree with this one.
  rift.core.Snapshot at = 1;
  // How much Rift could see while answering. An empty page means nothing matched only where
  // this is complete.
  rift.core.Coverage coverage = 2;
  // The hits on this page, in the order the request asked for.
  repeated SearchHit results = 3;
  // Pass this back to get the next page. Null on the last one.
  optional string next_cursor = 4;
}
// One adapter action discovered at an address: the URI that resolves it, and the portable
// description the adapter returned. A listing page leaves `descriptor.arguments_schema` null,
// because a page of offers carries as many schemas as it has entries and a caller reads one.
// The single-offer resource always carries it.
message ActionOffer {
  // Identity of this offer. Hand it to `act`, or read it for the argument schema the action
  // takes.
  string action = 1;
  // What the action does and what it applies to.
  rift.core.ActionDescriptor descriptor = 2;
}
// One page of the actions available at one address. Offers sort by language name, dialect with
// null first, target, kind, and offer identity. The cursor binds that order, the snapshot, and
// the adapter build.
message ActionsResourcePayload {
  // The address this page answers for, echoed back as it resolved.
  string uri = 1;
  // The snapshot this answer was resolved against. Pass it back as `rev` when a later call has
  // to agree with this one.
  rift.core.Snapshot at = 2;
  // The actions on this page, each without its argument schema.
  repeated ActionOffer offers = 3;
  // Whether the adapter could answer here. A language with no action support returns an empty
  // list with `unsupported` coverage and its reason.
  rift.core.Coverage coverage = 4;
  // The same address carrying the cursor for the next page, or null on the last one.
  optional string next = 5;
}
// One discovered action and the arguments it accepts. This is the read that supplies
// `arguments_schema`, so a caller fetches one schema for the action it chose rather than a
// schema per offer on a page.
message ActionResourcePayload {
  // The offer this payload answers for, echoed back as it resolved.
  string uri = 1;
  // The snapshot this offer was discovered in.
  rift.core.Snapshot at = 2;
  // Language whose adapter minted the offer and resolves it.
  rift.core.Language language = 3;
  // The offer, with `descriptor.arguments_schema` present.
  ActionOffer offer = 4;
}
// Evaluate a caller-provided code block with one configured language adapter against an
// exact revision. The server materializes a disposable execution workspace before crossing
// the adapter seam.
message ExecuteParams {
  // Exact language and optional dialect selecting the adapter.
  rift.core.Language language = 1;
  // Source to evaluate and its project-relative working directory.
  rift.core.CodeBlock block = 2;
  // Revision whose project source and runtime configuration provide context.
  optional string rev = 3;
}
// Bounded result of one execution. Writes made by evaluated code are absent because its
// execution workspace is discarded.
message ExecuteResult {
  // Exact snapshot used to prepare the execution workspace.
  rift.core.Snapshot at = 1;
  // Adapter that evaluated the block.
  rift.core.Language language = 2;
  // Runtime status, bounded output, and structured diagnostics.
  rift.core.ExecutionResult result = 3;
  // Exact bounds sent to the adapter for this evaluation.
  rift.core.ExecutionBudget budget = 4;
}
// Public summary of an inspect-only debugging evaluation. Start runs the block to normal
// completion or an unhandled failure; failed runs retain their stack for frame reads.
message DebugSession {
  // Server-minted public handle. The adapter-local DebugSessionKey never crosses MCP.
  string id = 1;
  // Snapshot retained by the session's execution workspace.
  rift.core.Snapshot at = 2;
  // Adapter that owns the retained debug state.
  rift.core.Language language = 3;
  // Retained stack frames, innermost first. Zero after normal completion.
  int64 frame_count = 4;
  // How the debugging evaluation ended and its bounded output.
  rift.core.ExecutionResult result = 5;
  // Exact execution and retained-frame bounds applied to this session.
  rift.core.DebugBudget budget = 6;
}
// Start an inspect-only debugging evaluation in a disposable execution workspace.
message DebugStartParams {
  // Exact language and optional dialect selecting the adapter.
  rift.core.Language language = 1;
  rift.core.CodeBlock block = 2;
  // Revision whose project source and runtime configuration provide context.
  optional string rev = 3;
}
// Read one retained stack frame without resuming or mutating the debugging session.
message DebugGetFrameParams {
  string session = 1;
  // Zero-based stack depth, with the innermost retained frame first.
  int64 depth = 2;
}
// One retained frame from a connection-bound debugging session.
message DebugGetFrameResult {
  string session = 1;
  rift.core.DebugFrame frame = 2;
}
// Stop a debugging session and release its adapter state and execution workspace.
message DebugStopParams {
  string session = 1;
}
// Acknowledgement that a debugging session no longer retains runtime state.
message DebugStopResult {
  string session = 1;
  optional int64 stopped = 2;
}
// A structural match with grammar-derived replacement ranges.
message MatchHitStructural {
  // The named captures this match bound, in the order the pattern declares them.
  repeated rift.core.Capture captures = 1;
  // Why this is a match, one step per line.
  repeated string explanation = 2;
  // Ranges the adapter says can be replaced whole: the matched node alone, or with the
  // whitespace and punctuation on either side. Rewriting `foo(a, b)` out of a list needs one of
  // the wider ones to avoid leaving a comma behind.
  rift.core.StructuralMatchRanges replacement_ranges = 3;
  // Facts the adapter carries that this model has no field for, under a reverse-domain key.
  rift.core.Extensions extensions = 4;
  // Identity of this match and the state it was found in. An edit addressed at it is checked
  // against this before it lands.
  string key = 5;
}
// A text match. Bytes matched bytes, with no tree behind them and nothing to say about what is
// safe to replace.
message MatchHitText {
  // The named captures this match bound, in the order the pattern declares them.
  repeated rift.core.Capture captures = 1;
  // Why this is a match, one step per line.
  repeated string explanation = 2;
  // Identity of this match and the state it was found in. An edit addressed at it is checked
  // against this before it lands.
  string key = 3;
}
// One match, tagged by the engine that produced it. The tag equals `key.query.kind`. A
// structural match carries grammar-derived replacement ranges. A text match carries source
// captures only.
message MatchHit {
  oneof variant {
    MatchHitStructural structural = 1;
    MatchHitText text = 2;
  }
}
// A match request: the query, a page size, and the revision to run it against. The complete
// query travels in every match key, so a key can be inspected and replayed without hidden
// lookup state.
message MatchParams {
  // What to look for, and which engine answers it.
  rift.core.MatchQuery query = 1;
  // Most matches to return in one page, capped by `max_page_items`.
  optional int64 limit = 2;
  // Continues a previous match where its last page ended. Omit it for the first page.
  optional string cursor = 3;
  // Which revision to answer against. Absent, the default branch at its latest commit.
  optional string rev = 4;
}
// One page of matches and the state they were found in. Matches sort by file bytes, range, and
// canonical key. Rift checks the key against `at` before applying an addressed edit.
message MatchResult {
  // The snapshot this answer was resolved against. Pass it back as `rev` when a later call has
  // to agree with this one.
  rift.core.Snapshot at = 1;
  // The matches on this page.
  repeated MatchHit matches = 2;
  // How much of the selected path set was searched. A file too large to read makes this partial
  // with a reason.
  rift.core.Coverage coverage = 3;
  // Pass this back to get the next page. Null on the last one.
  optional string next_cursor = 4;
}
// One `Diagnostic` as an MCP answer carries it: the fact the adapter minted, plus what Rift can
// add without the adapter — where it lands in a line and column, and the source around it.
message DiagnosticContext {
  // Component that produced the diagnostic. Rift sets this after collecting adapter, validator,
  // or apply output.
  enum Source {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language's own analysis.
    ADAPTER = 1;
    // A check Rift ran over a proposed change.
    VALIDATOR = 2;
    // Reported while applying edits to the workspace.
    APPLY = 3;
  }
  Source source = 1;
  // The state this answer was resolved against.
  rift.core.Snapshot at = 2;
  // The finding itself, exactly as the adapter minted it.
  rift.core.Diagnostic diagnostic = 3;
  // One-based line the finding starts on. Null where the diagnostic has no span — a
  // whole-project error has nowhere to point.
  optional int64 line = 4;
  // One-based column within that line, counted in UTF-8 bytes. Null for the same reason as
  // `line`.
  optional int64 column = 5;
  // The source the finding points at. Null where there is no span to copy from.
  optional SourceExcerpt excerpt = 6;
}
// One cause in a failure chain. Entries appear from the outer operation to the concrete
// failure.
message ErrorCause {
  // Why a request failed, as a stable code a caller branches on. The code is the complete
  // classification. Domain results such as unsupported coverage and edit refusal use their
  // typed result values.
  enum ErrorCode {
    // The caller did not set a value.
    ERROR_CODE_UNSPECIFIED = 0;
    // The request does not satisfy the schema, or names something the schema forbids: a `limit`
    // above the advertised maximum, a filter field that does not exist. The same bytes fail
    // identically.
    ERROR_CODE_INVALID_REQUEST = 1;
    // The client and server use different protocol versions. Compare `Contract` with the
    // client's supported contract.
    ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
    // Host policy refused — a path outside the workspace, a revision this deployment does not
    // expose, a language not authorized for execution, or a debugging session owned by another
    // connection. The same request fails the same way.
    ERROR_CODE_PERMISSION_DENIED = 3;
    // The revision does not resolve here: a deleted branch, a commit never fetched, a working
    // tree that has been removed. Retrying helps only once the revision exists.
    ERROR_CODE_SNAPSHOT_NOT_FOUND = 4;
    // The snapshot passed back is no longer one the server can answer from — the working tree
    // moved under it, or the adapter that held its facts was restarted. Re-read the current
    // snapshot and rebuild whatever was pinned to the old one.
    ERROR_CODE_SEMANTIC_SNAPSHOT_MISMATCH = 5;
    // The revision resolves, but Rift has no index for it yet: the adapters are still
    // analysing, or that state's facts were dropped. Retrying once indexing catches up
    // succeeds.
    ERROR_CODE_SEMANTIC_SNAPSHOT_UNAVAILABLE = 6;
    // The identity is well-formed and resolves to nothing — no such symbol, no such file at
    // that revision, or a debug session already stopped or expired. Retrying does not help.
    ERROR_CODE_RESOURCE_NOT_FOUND = 7;
    // The entry is known but its bytes cannot be produced: an LFS object Rift does not fetch,
    // or a blob the object store cannot read. Retrying does not help.
    ERROR_CODE_CONTENT_UNAVAILABLE = 8;
    // The cursor is malformed, or it was minted for a different request, order or page size.
    // Start the query again from its first page.
    ERROR_CODE_CURSOR_INVALID = 9;
    // The cursor is well-formed but the state it was minted against has moved, so continuing it
    // would splice two different answers together. Start again against the current state.
    ERROR_CODE_CURSOR_SNAPSHOT_MISMATCH = 10;
    // The caller cancelled, or the connection went away before the request finished. Sending it
    // again is fine.
    ERROR_CODE_CANCELLED = 11;
    // The request ran past its time budget. A smaller one may succeed — a lower `limit`, a
    // narrower path selector — and so may the same one once a cold adapter has warmed up.
    ERROR_CODE_DEADLINE_EXCEEDED = 12;
    // A request or a response crossed an advertised limit. `limit` says which one and by how
    // much, so the request can be resized and sent again.
    ERROR_CODE_LIMIT_EXCEEDED = 13;
    // The required worktree is locked, has an unmerged index, or is otherwise not in the Git
    // state this operation requires. Inspect or finish that Git operation first.
    ERROR_CODE_WORKTREE_BUSY = 14;
    // No adapter is running for the language the request names: none is installed, or the one
    // that was has died. A structural query against a language with no adapter lands here.
    ERROR_CODE_ADAPTER_UNAVAILABLE = 15;
    // An adapter contract is unusable. Causes include a malformed message, a field outside its
    // range, ambiguous source or virtual claims, overlapping write claims, a virtual path
    // collision, and a cycle in virtual-source routing. Correct the adapter configuration
    // before retrying.
    ERROR_CODE_ADAPTER_PROTOCOL_ERROR = 16;
    // The adapter took the call and did not answer inside its budget. Retrying can work: a cold
    // adapter on a large workspace is slow once and fast afterwards.
    ERROR_CODE_ADAPTER_TIMEOUT = 17;
    // Rift could not read or write workspace state — Git objects, refs, worktrees, or the
    // repository-local control directory. Worth retrying only if the cause was transient, such
    // as a disk that has since been cleared.
    ERROR_CODE_STORAGE_FAILURE = 18;
    // Rift could not prepare the validation workspace, launch the command validator, enforce
    // its timeout, or capture its output. One retry is reasonable when the host failure was
    // transient.
    ERROR_CODE_VALIDATOR_EXECUTION_FAILURE = 19;
    // A bug in Rift. `causes` says what it was doing at the time, and a retry is not expected
    // to answer differently.
    ERROR_CODE_INTERNAL_ERROR = 20;
    // Git contains a path the protocol or host filesystem cannot represent safely. The same
    // snapshot remains unusable until that path changes.
    ERROR_CODE_UNSUPPORTED_PATH = 21;
    // The cursor is valid, but its immutable result generation left the process-local cache.
    // Start again from the first page.
    ERROR_CODE_CURSOR_EXPIRED = 22;
    // A Rift ref is malformed, or Git's registered-worktree record does not match the physical
    // directory. A local state command must resolve it.
    ERROR_CODE_STATE_CORRUPT = 23;
    // The resource exists, but Rift cannot produce a safe answer yet. Recovery can require a
    // local operator decision before a retry.
    ERROR_CODE_TEMPORARILY_UNAVAILABLE = 24;
  }
  // Stable retry instruction for one failed request. `deadline_exceeded` can permit the same
  // request; `invalid_request` requires changed input.
  enum RetryDirective {
    // The caller did not set a value.
    RETRY_DIRECTIVE_UNSPECIFIED = 0;
    // The request fails the same way every time. Change it or give up.
    RETRY_DIRECTIVE_NEVER = 1;
    // Send the same bytes again. The cause was transient — a busy working tree, an adapter
    // still starting.
    RETRY_DIRECTIVE_SAME_REQUEST = 2;
    // The state moved under the request. Re-read the current state, rebuild whatever was pinned
    // to the old one, then ask again.
    RETRY_DIRECTIVE_REFRESH_SNAPSHOT = 3;
    // A local state command or policy change must resolve the condition before another request
    // can succeed.
    RETRY_DIRECTIVE_OPERATOR_ACTION = 4;
  }
  // How this link classifies on its own.
  ErrorCode code = 1;
  // What happened, for a human reading a log.
  string message = 2;
  // What could be done about this cause. The request's outer directive governs the call.
  RetryDirective retry = 3;
}
// The `data` object on every Rift MCP failure. `code` and `retry` are what a caller branches
// on, `message` is for a human, and `phase`, `diagnostics`, `limit` and `causes` are the
// evidence behind the code.
message ErrorData {
  // Why a request failed, as a stable code a caller branches on. The code is the complete
  // classification. Domain results such as unsupported coverage and edit refusal use their
  // typed result values.
  enum ErrorCode {
    // The caller did not set a value.
    ERROR_CODE_UNSPECIFIED = 0;
    // The request does not satisfy the schema, or names something the schema forbids: a `limit`
    // above the advertised maximum, a filter field that does not exist. The same bytes fail
    // identically.
    ERROR_CODE_INVALID_REQUEST = 1;
    // The client and server use different protocol versions. Compare `Contract` with the
    // client's supported contract.
    ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
    // Host policy refused — a path outside the workspace, a revision this deployment does not
    // expose, a language not authorized for execution, or a debugging session owned by another
    // connection. The same request fails the same way.
    ERROR_CODE_PERMISSION_DENIED = 3;
    // The revision does not resolve here: a deleted branch, a commit never fetched, a working
    // tree that has been removed. Retrying helps only once the revision exists.
    ERROR_CODE_SNAPSHOT_NOT_FOUND = 4;
    // The snapshot passed back is no longer one the server can answer from — the working tree
    // moved under it, or the adapter that held its facts was restarted. Re-read the current
    // snapshot and rebuild whatever was pinned to the old one.
    ERROR_CODE_SEMANTIC_SNAPSHOT_MISMATCH = 5;
    // The revision resolves, but Rift has no index for it yet: the adapters are still
    // analysing, or that state's facts were dropped. Retrying once indexing catches up
    // succeeds.
    ERROR_CODE_SEMANTIC_SNAPSHOT_UNAVAILABLE = 6;
