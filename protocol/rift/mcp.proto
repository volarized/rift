  optional string current = 3;
  // Exact session state used for the discarded integration attempt.
  rift.core.ProjectionState source = 4;
}
// The complete decision from one Git integration attempt.
message IntegrateResult {
  oneof variant {
    IntegrationSucceeded integrated = 1;
    IntegrationSynchronized synchronized = 2;
    IntegrationMergeConflict merge_conflict = 3;
    IntegrationRejected rejected = 4;
    IntegrationRefused refused = 5;
    IntegrationTargetMoved target_moved = 6;
    StaleProjectionResult stale_projection = 7;
  }
}
// Imports a conflict resolution from one retained conventional Git worktree. The index
// must have no unmerged entries and the worktree must have no unstaged or untracked paths.
// Rift imports only the reviewed index tree.
message RecoveryContinueParams {
  // Exact staged index and worktree bytes reviewed by the caller.
  RecoveryManifest expected = 1;
}
// Exact recovery guards consumed by successful continuation. It is response evidence and
// does not assert that the conventional worktree or private ref still exists.
message ConsumedRecovery {
  string recovery = 1;
  rift.core.ProjectionState expected_source = 2;
  string target = 3;
  string expected_target = 4;
  RecoveryManifest manifest = 5;
}
// A resolved integration merge was imported, validated, and published to its target ref.
message RecoveryIntegrationContinued {
  ConsumedRecovery recovery = 1;
  // Completed target update and validation evidence.
  IntegrationSucceeded integration = 2;
}
// The reviewed resolution already matched the target tree. Rift rebased the source and
// removed the recovery without creating a commit.
message RecoveryIntegrationSynchronized {
  ConsumedRecovery recovery = 1;
  IntegrationSynchronized integration = 2;
}
// Validation rejected the reviewed resolution. The recovery remains available for more
// edits or explicit abort.
message RecoveryIntegrationRejected {
  // Retained recovery with its rescanned current manifest.
  GitRecovery recovery = 1;
  IntegrationRejected integration = 2;
}
// Repository state prevented publication of the reviewed resolution. The recovery remains
// available for retry or explicit abort.
message RecoveryIntegrationRefused {
  // Retained recovery with its rescanned current manifest.
  GitRecovery recovery = 1;
  IntegrationRefused integration = 2;
}
// The source projection, target ref, or recovery bytes moved before continuation. Nothing
// was published; the exact current values let the caller choose whether to abort or restart.
message RecoveryObsolete {
  string recovery = 1;
  rift.core.ProjectionState expected_source = 2;
  rift.core.ProjectionState current_source = 3;
  string target = 4;
  string expected_target = 5;
  // Current target commit, or null if the guarded branch was deleted.
  optional string current_target = 6;
  RecoveryManifest expected_manifest = 7;
  RecoveryManifest current_manifest = 8;
}
// Selects one captured page of active recoveries in recovery-id order.
message RecoveryListParams {
  optional int64 limit = 1;
  optional string cursor = 2;
}
// One page of durable merge recoveries. Listing rescans each conventional worktree and
// returns the manifest a caller can review and pass to continue or abort.
message RecoveryListResult {
  repeated GitRecovery recoveries = 1;
  optional string next_cursor = 2;
}
// A completed integration or failed saved-state comparison.
message RecoveryContinueResult {
  oneof variant {
    RecoveryIntegrationContinued integration_continued = 1;
    RecoveryObsolete obsolete = 2;
    RecoveryIntegrationSynchronized integration_synchronized = 3;
    RecoveryIntegrationRejected integration_rejected = 4;
    RecoveryIntegrationRefused integration_refused = 5;
  }
}
// Previews or removes one retained recovery without changing source or a public Git ref.
// The manifest prevents deleting recovery edits the caller did not review. A mismatch fails
// with `recovery_moved`; an unrepresentable special file fails with `unsupported_path`.
message RecoveryAbortParams {
  RecoveryManifest expected = 1;
  optional bool confirm = 2;
}
// The recovery still exists and no cleanup was performed.
message RecoveryAbortPreview {
  GitRecovery recovery = 1;
}
// The reviewed worktree, private ref, and recovery pins were removed.
message RecoveryAborted {
  string recovery = 1;
  // Exact final manifest accepted before cleanup.
  RecoveryManifest manifest = 2;
}
// A recovery cleanup preview or completed cleanup.
message RecoveryAbortResult {
  oneof variant {
    RecoveryAbortPreview preview = 1;
    RecoveryAborted aborted = 2;
  }
}
// A regular-file range whose bytes decode as UTF-8. Start and end fall on UTF-8
// code-point boundaries.
message FileResourcePayloadUtf8 {
  // Exact resource request this payload answers.
  string uri = 1;
  // Exact source snapshot from which the entry and bytes were read.
  rift.core.ResolvedSnapshot at = 2;
  // Complete regular source-store entry.
  rift.core.File file = 3;
  int64 start = 4;
  int64 end = 5;
  int64 total_bytes = 6;
  string content = 7;
  // Next exact-snapshot range beginning at `end`, or null at EOF.
  optional string next = 8;
}
// A range carried as canonical base64 because its bytes do not form valid UTF-8.
message FileResourcePayloadBase64 {
  // Exact resource request this payload answers.
  string uri = 1;
  // Exact source snapshot from which the entry and bytes were read.
  rift.core.ResolvedSnapshot at = 2;
  // Complete regular source-store entry.
  rift.core.File file = 3;
  int64 start = 4;
  int64 end = 5;
  int64 total_bytes = 6;
  string content = 7;
  // Next exact-snapshot range beginning at `end`, or null at EOF.
  optional string next = 8;
}
// A complete non-regular source-store entry. Its empty interval carries no bytes and has
// no continuation.
message FileResourcePayloadNone {
  // Exact resource request this payload answers.
  string uri = 1;
  // Exact source snapshot from which the entry was read.
  rift.core.ResolvedSnapshot at = 2;
  // Complete LFS-pointer, symlink, or gitlink entry.
  rift.core.File file = 3;
  optional int64 start = 4;
  optional int64 end = 5;
  optional int64 total_bytes = 6;
  optional google.protobuf.Value content = 7;
  optional google.protobuf.Value next = 8;
}
// One complete source-store entry and a bounded byte range at an exact resolved snapshot.
// Regular files carry UTF-8 text where the selected bytes form valid UTF-8 and canonical base64
// otherwise. `next` uses a `snapshot:` selector and continues at `end`; non-regular entries
// carry their complete metadata and no bytes.
message FileResourcePayload {
  oneof variant {
    FileResourcePayloadUtf8 utf8 = 1;
    FileResourcePayloadBase64 base64 = 2;
    FileResourcePayloadNone none = 3;
  }
}
// Effective caller-code routing after Rift intersects `rift.toml` with one adapter's
// advertised operations.
message ExecutionAvailability {
  // Whether execute may route to this language after workspace configuration and adapter
  // capability are applied.
  bool execute = 1;
  // Whether all three debug tools may route to this language. True requires execute enablement
  // and the complete adapter debug operation triplet.
  bool debug = 2;
}
// Capabilities reported by one configured language adapter. `execution` applies the
// workspace configuration to its caller-code operations.
message LanguageSupport {
  // Optional adapter operations advertised before Rift issues a call.
  enum AdapterOperation {
    // The caller did not set a value.
    ADAPTER_OPERATION_UNSPECIFIED = 0;
    // Emit advertised fact families from source.
    ADAPTER_OPERATION_ANALYZE = 1;
    // Check a changed source closure.
    ADAPTER_OPERATION_VALIDATE = 2;
    // Format selected source.
    ADAPTER_OPERATION_FORMAT = 3;
    // Run structural matching.
    ADAPTER_OPERATION_MATCH = 4;
    // Discover actions at an address.
    ADAPTER_OPERATION_ACTIONS = 5;
    // Resolve a discovered action to edits and evidence.
    ADAPTER_OPERATION_RESOLVE = 6;
    // Consume virtual source produced by another adapter.
    ADAPTER_OPERATION_SYNC_VIRTUAL = 7;
    // Evaluate a caller-provided code block against one adapter state.
    ADAPTER_OPERATION_EXECUTE = 8;
    // Start an inspect-only debugging session for a code block.
    ADAPTER_OPERATION_DEBUG_START = 9;
    // Read one retained stack frame from a debugging session.
    ADAPTER_OPERATION_DEBUG_GET_FRAME = 10;
    // Release a debugging session and its runtime state.
    ADAPTER_OPERATION_DEBUG_STOP = 11;
  }
  // One kind of fact an adapter can emit for a file. Coverage, streaming, and invalidation use
  // the family as their unit.
  enum FactFamily {
    // The caller did not set a value.
    FACT_FAMILY_UNSPECIFIED = 0;
    // Relations from produced source ranges to the physical or virtual source ranges that
    // contributed them.
    FACT_FAMILY_ORIGIN_MAPPINGS = 1;
    // The declarations the adapter resolved in the file.
    FACT_FAMILY_SYMBOLS = 2;
    // The nodes of the file's syntax tree, and which symbol each writes.
    FACT_FAMILY_NODES = 3;
    // The edges between symbols the adapter read out of this file.
    FACT_FAMILY_RELATIONSHIPS = 4;
    // The types carried by those symbols. Type facts live in `Symbol.types` and `Signature`;
    // this family records how completely the adapter resolved them.
    FACT_FAMILY_TYPES = 5;
    // What the adapter complained about while reading the file.
    FACT_FAMILY_DIAGNOSTICS = 6;
  }
  // Language name and optional dialect handled by the adapter.
  rift.core.Language language = 1;
  // Implementation name and version reported by the adapter.
  string adapter = 2;
  // Optional operations implemented by the adapter, sorted by protocol order.
  repeated AdapterOperation operations = 3;
  // Fact families the adapter may emit from Analyze, sorted by protocol order.
  repeated FactFamily fact_families = 4;
  // Supported action families in kind-prefix order. Empty when `actions` is not advertised or
  // the adapter has no action families.
  repeated rift.core.ActionSupport action_kinds = 5;
  // Effective workspace configuration and adapter capability for caller code.
  ExecutionAvailability execution = 6;
}
// The Protobuf service exposed by the Rift server. `rift mcp` maps its JSON entry points to
// these methods.
service Rift {
  // Opens the control stream that owns one logical client connection. For an MCP role, the
  // first response returns the always-mounted persistent session projection. A session ID
  // admits one live connection.
  rpc Connect (rift.mcp.ConnectRequest) returns (stream rift.mcp.Connected);
  // Lists retained sessions for this workspace. Each entry reports its projection path, exact
  // current state and base, and live owner.
  rpc SessionList (rift.mcp.SessionListParams) returns (rift.mcp.SessionListResult);
  // Rebinds the current MCP connection to one retained session. The connection's initial
  // session must still be unchanged; Rift then removes it and continues the selected
  // projection. The MCP process remembers the selected ID for reconnects. A changed initial
  // session returns `invalid_request`; an active session or retained debugger returns
  // `temporarily_unavailable`.
  rpc SessionContinue (rift.mcp.SessionContinueParams) returns (rift.mcp.SessionContinueResult);
  // Previews or confirms removal of one inactive session. Confirmation removes its projection
  // and compares the exact observed projection state. An active session returns
  // `temporarily_unavailable`; open handles and in-flight filesystem mutations return
  // `projection_busy`.
  rpc SessionRemove (rift.mcp.SessionRemoveParams) returns (rift.mcp.SessionRemoveResult);
  // Mounts one exact revision as an explicitly pinned read-only filesystem projection.
  rpc ProjectionOpen (rift.mcp.ProjectionOpenParams) returns (rift.mcp.ProjectionOpenResult);
  // Withdraws an explicit read projection; open handles keep only their inode pins.
  rpc ProjectionClose (rift.mcp.ProjectionCloseParams) returns (rift.mcp.ProjectionCloseResult);
  // Lists the project tree at one snapshot. Rift derives directories from source paths and
  // answers without starting a language adapter. A depth of one is an `ls`; an unbounded depth
  // with path selectors is a recursive tree, glob, or file find.
  rpc Tree (rift.mcp.TreeParams) returns (rift.mcp.TreeResult);
  // Reads the adapter-owned declaration structure of one file. Results preserve source nesting
  // and carry semantic coverage, so an empty outline distinguishes an empty file from an
  // unsupported language.
  rpc Outline (rift.mcp.OutlineParams) returns (rift.mcp.OutlineResult);
  // Searches symbols, nodes and files in a stable ranked order. A lexical query finds names or
  // text; a structured filter walks adapter facts. Path selectors narrow either form. Every
  // page carries its total order, continuation cursor, and coverage.
  rpc Search (rift.mcp.SearchParams) returns (rift.mcp.SearchResult);
  // Finds byte ranges. Rift runs literal and regular-expression matching over every UTF-8 file.
  // The owning adapter parses structural patterns because it defines the language's syntax.
  // Every hit carries a key an edit can address.
  rpc Match (rift.mcp.MatchParams) returns (rift.mcp.MatchResult);
  // Evaluates a caller-provided code block with one configured language adapter against an
  // exact snapshot. Rift prepares a disposable execution workspace and discards every
  // filesystem write made by the evaluated code.
  rpc Execute (rift.mcp.ExecuteParams) returns (rift.mcp.ExecuteResult);
  // Starts an inspect-only debugging evaluation. An unhandled failure retains bounded stack
  // frames until the caller stops the connection-bound session.
  rpc DebugStart (rift.mcp.DebugStartParams) returns (rift.mcp.DebugSession);
  // Reads one retained stack frame without resuming evaluation.
  rpc DebugGetFrame (rift.mcp.DebugGetFrameParams) returns (rift.mcp.DebugGetFrameResult);
  // Releases a debugging session, adapter state, and execution workspace.
  rpc DebugStop (rift.mcp.DebugStopParams) returns (rift.mcp.DebugStopResult);
  // Checks the exact projection token, applies an atomic edit set in a private candidate,
  // validates it, and conditionally swaps the public projection state.
  rpc Edit (rift.mcp.EditParams) returns (rift.mcp.ChangeResult);
  // Checks the exact projection token, then applies a unified diff in a private candidate and
  // checks every hunk's context.
  rpc Patch (rift.mcp.PatchParams) returns (rift.mcp.ChangeResult);
  // Applies replacements for every match of one query. The cardinality is checked before
  // expansion, so a pattern that matches more places than intended refuses instead of rewriting
  // them.
  rpc Rewrite (rift.mcp.RewriteParams) returns (rift.mcp.ChangeResult);
  // Applies the three-way inverse of one commit against a selected parent.
  rpc Revert (rift.mcp.RevertParams) returns (rift.mcp.ChangeResult);
  // Changes what a declaration is called and rewrites every reference that names it. The
  // adapter checks spelling, collisions, and binding changes. A reference outside the scope
  // refuses the whole operation.
  rpc Rename (rift.mcp.RenameParams) returns (rift.mcp.ChangeResult);
  // Moves a declaration or file to another container or path and updates the imports and
  // references that reach it.
  rpc Move (rift.mcp.MoveParams) returns (rift.mcp.ChangeResult);
  // Removes a declaration. Without a policy this is a mechanical removal that analyses no
  // references. With one, the adapter classifies every remaining use, applies the stated
  // disposition, and refuses when reference coverage is incomplete.
  rpc Delete (rift.mcp.DeleteParams) returns (rift.mcp.ChangeResult);
  // Changes the shape of a callable and propagates it to callers, overrides, and
  // implementations. Unlike a rename, it rewrites argument lists, so it commonly raises a
  // `behavior_unknown` confirmation.
  rpc ChangeSignature (rift.mcp.ChangeSignatureParams) returns (rift.mcp.ChangeResult);
  // Resolves one action an adapter offered — a quick fix, an extraction, an inline, or an
  // adapter-specific family. Arguments are validated against the schema the offer advertises. A
  // portable family is refused here and resolves through its own tool.
  rpc Act (rift.mcp.ActParams) returns (rift.mcp.ChangeResult);
  // Discards reviewed unintegrated source changes and restores the pinned session base.
  rpc ProjectionRestore (rift.mcp.ProjectionRestoreParams) returns (rift.mcp.ProjectionRestoreResult);
  // Merges the exact current projection from its retained base onto a guarded target, validates
  // the merged snapshot, writes at most one squash commit, and conditionally advances the
  // target. A conflict creates an exceptional conventional Git recovery worktree.
  rpc Integrate (rift.mcp.IntegrateParams) returns (rift.mcp.IntegrateResult);
  // Lists durable unresolved integrations and rescans their exact recovery manifests.
  rpc RecoveryList (rift.mcp.RecoveryListParams) returns (rift.mcp.RecoveryListResult);
  // Imports and validates the staged tree of a resolved exceptional Git worktree, then performs
  // the saved source and target compare-and-swaps.
  rpc RecoveryContinue (rift.mcp.RecoveryContinueParams) returns (rift.mcp.RecoveryContinueResult);
  // Previews or removes a retained Git recovery against its exact manifest.
  rpc RecoveryAbort (rift.mcp.RecoveryAbortParams) returns (rift.mcp.RecoveryAbortResult);
  rpc ReadResource (rift.mcp.ResourceReadParams) returns (rift.mcp.ResourceReadResult);
}
