  string current = 3;
  // Session commit merged in the integration worktree.
  string source = 4;
  // Integration worktree preserved for supervisor inspection.
  string worktree = 5;
}
// The complete decision from one Git integration attempt.
message IntegrateResult {
  oneof variant {
    IntegrationSucceeded integrated = 1;
    IntegrationMergeConflict merge_conflict = 2;
    IntegrationRejected rejected = 3;
    IntegrationRefused refused = 4;
    IntegrationTargetMoved target_moved = 5;
