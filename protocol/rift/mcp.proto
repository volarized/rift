  repeated rift.core.Relationship relationships = 6;
  // The source at each node, so the declaration and its call sites can be read without a second
  // round trip.
  repeated SourceExcerpt source = 7;
  // What the adapter reported at this symbol's nodes.
  repeated DiagnosticContext diagnostics = 8;
  // How complete each fact family is for this symbol. An empty `relationships` means the symbol
