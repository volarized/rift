}
message PreviewResourcePayloadPreconditions {
  // Requested change index checked by this condition.
  int64 change = 1;
  rift.core.OperationPrecondition precondition = 2;
}
message PreviewResourcePayloadEffects {
  // Requested change index that produced this effect.
  int64 change = 1;
  rift.core.OperationEffect effect = 2;
}
message PreviewResourcePayloadGuarantees {
  // Requested change index supported by this evidence.
  int64 change = 1;
  rift.core.GuaranteeEvidence evidence = 2;
}
message PreviewResourcePayloadResolutionDiagnostics {
  // Requested change index that produced this finding.
  int64 change = 1;
  rift.core.Diagnostic diagnostic = 2;
}
// One page of a retained candidate contract. Concatenating every array from successive pages
// reconstructs the complete plan and validation evidence. Every page repeats the URI, base,
