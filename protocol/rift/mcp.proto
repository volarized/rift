  repeated int64 changes = 1;
  // Guarantee established when the validator passes.
  GuaranteeKind kind = 2;
  // Source over which the command checks the property.
  rift.core.CoverageScope scope = 3;
  // Exact property the command checks and limits on interpreting a pass.
  string detail = 4;
}
// A caller-authorized acceptance check executed directly, without a shell, in a disposable
// validation workspace materialized from the complete candidate tree. The workspace is only the
// process working directory; it does not isolate the command from the host. Rift removes it
// when the check ends.
message CommandValidator {
