    FACT_FAMILY_ORIGIN_MAPPINGS = 1;
    // The declarations the adapter resolved in the file.
    FACT_FAMILY_SYMBOLS = 2;
    // The nodes of the file's syntax tree, and which symbol each writes.
    FACT_FAMILY_NODES = 3;
    // The edges between symbols the adapter read out of this file.
