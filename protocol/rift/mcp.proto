// What a read of a `rift://symbol/…` URI returns.
message SymbolResourceContent {
  // The URI that was read, as it resolved.
  string uri = 1;
  // A `SymbolResourcePayload`, serialized as JSON.
  string text = 2;
}
// What a read of a `rift://diff/…` URI returns.
message DiffResourceContent {
  // The URI that was read, as it resolved.
  string uri = 1;
  // A `DiffResourcePayload`, serialized as JSON.
  string text = 2;
}
// What a read of a `rift://file/…` URI returns.
message FileResourceContent {
  // The URI that was read, as it resolved.
  string uri = 1;
  // A `FileResourcePayload`, serialized as JSON.
  string text = 2;
}
