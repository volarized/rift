  // selected commit must be an ancestor of `rev`.
  optional string expected_accepted = 3;
  // Formatting applied after this operation's edits resolve.
  FormattingPolicy formatting = 4;
  // The declaration or file to move.
  rift.core.Address target = 5;
  // The destination, and the source eligible for import and reference updates.
  rift.core.MoveArguments arguments = 6;
  // Fixed command validators for this preview. A root candidate requires a plan, which may
  // contain an empty array; null on a chained candidate inherits its parent plan.
  optional PublicationPlan publication = 7;
}
// Removes a declaration. Without a policy this is a mechanical removal that analyses no
// references and claims no reference guarantee. With one, the adapter classifies every
// remaining use, applies the stated disposition, and refuses the operation when reference
// coverage is incomplete.
message DeleteParams {
