  string path = 1;
  // Conflict status derived from Git's index stages.
  GitConflictStatus status = 2;
}
// Git left the session worktree and index in an unmerged state.
message ChangeMergeConflict {
  // Session head used as the current side of the merge.
  string previous = 1;
  // Commit supplied as the other side of the merge.
  string source = 2;
  // Session worktree containing Git's unmerged index and working files.
  string worktree = 3;
  // Conflicting paths in project-path order.
  repeated GitConflict conflicts = 4;
}
// A committed session change, Git merge state, domain refusal, or stale-head result.
message ChangeResult {
  oneof variant {
    ChangeCommitted committed = 1;
    ChangeMergeConflict merge_conflict = 2;
    RefusedResult refused = 3;
    StaleHeadResult stale_head = 4;
  }
}
// Merges the session head into one local branch with a conditional target update.
message IntegrateParams {
  // Local branch that receives the merged session history.
  string target = 1;
  // Session commit to merge. Omission selects the current session head.
  optional string source = 2;
  // Target head that the final conditional ref update must replace.
