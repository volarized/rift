// Current workspace state and request limits. Each configured language advertises its
// adapter support and effective caller-code availability.
message WorkspaceResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // Current session projection state.
  rift.core.ProjectionState state = 2;
  // The version every other field in this payload is stated under.
  string protocol_version = 3;
  // The ceilings a request has to stay inside here.
  Limits limits = 4;
  // Configured languages and their capabilities, sorted by name and dialect with null first.
  repeated LanguageSupport languages = 5;
  // How complete each fact family is across the workspace. A family reported `unsupported` here
  // remains unsupported in subsequent answers.
  rift.core.SemanticCoverage coverage = 6;
  // The MCP resource families this workspace serves.
  repeated ResourceFamily resources = 8;
  // The same resource carrying the cursor for the next page, or null on the last one.
  optional string next = 9;
  // The pattern grammars the `match` tool accepts here.
  MatchSyntax matching = 11;
  // Publication checks declared by the workspace-root `rift.toml`.
  repeated CommandValidator validators = 13;
}
// Where this session's projection lives on the filesystem. Adapters receive the tree they
// analyze over the adapter protocol; a caller that has to reach the projection through an
// ordinary filesystem tool reads it here.
message ProjectionResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // Absolute path of the projection directory, at `.rift/projections/<session>` for the
  // session's life. Reading this resource materializes the projection, because a tool pointed
  // here may write and those writes belong to the changeset.
  string path = 2;
  // Absolute path of the workspace this projection was taken from.
  string workspace = 3;
}
// One page of search hits, and what the page is worth. `coverage` is what makes an empty page
// readable: nothing matched, or Rift could not see far enough to know.
message SearchResult {
  // How much Rift could see while answering. An empty page means nothing matched only where
  // this is complete.
  rift.core.Coverage coverage = 2;
  // The hits on this page, in the order the request asked for.
  repeated SearchHit results = 3;
  // Cursor for the next page, or null after the final result.
  optional string next_cursor = 4;
}
