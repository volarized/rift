// Resolves one discovered adapter action — a quick fix, an extraction, an inline, anything an
// adapter offers that has no portable contract. Rift validates `arguments` against the offer's
// advertised schema. An offer whose kind belongs to a portable family is refused here, because
// `rename`, `move`, `delete`, and `change_signature` are its typed entry points.
message ActParams {
