  rift.core.ExecutionBudget budget = 4;
}
// Public summary of an inspect-only debugging evaluation. Start runs the block to normal
// completion or an unhandled failure; failed runs retain their stack for frame reads.
message DebugSession {
  // Server-minted public handle. The adapter-local DebugSessionKey never crosses MCP.
  string id = 1;
  // Adapter that owns the retained debug state.
  rift.core.Language language = 3;
  // Retained stack frames, innermost first. Zero after normal completion.
  int64 frame_count = 4;
  // How the debugging evaluation ended and its bounded output.
  rift.core.ExecutionResult result = 5;
  // Exact execution and retained-frame bounds applied to this session.
  rift.core.DebugBudget budget = 6;
}
// Start an inspect-only debugging evaluation in a disposable execution workspace.
message DebugStartParams {
  // Exact language and optional dialect selecting the adapter.
  rift.core.Language language = 1;
  rift.core.CodeBlock block = 2;
}
// Read one retained stack frame without resuming or mutating the debugging session.
message DebugGetFrameParams {
  string session = 1;
  // Zero-based stack depth, with the innermost retained frame first.
  int64 depth = 2;
}
// One retained frame from a connection-bound debugging session.
message DebugGetFrameResult {
  string session = 1;
  rift.core.DebugFrame frame = 2;
}
// Stop a debugging session and release its adapter state and execution workspace.
message DebugStopParams {
  string session = 1;
}
// Acknowledgement that a debugging session no longer retains runtime state.
message DebugStopResult {
  string session = 1;
  optional int64 stopped = 2;
}
// A structural match with grammar-derived replacement ranges.
message MatchHitStructural {
  // The named captures this match bound, in the order the pattern declares them.
  repeated rift.core.Capture captures = 1;
  // Why this is a match, one step per line.
  repeated string explanation = 2;
  // Ranges the adapter says can be replaced whole: the matched node alone, or with the
  // whitespace and punctuation on either side. Rewriting `foo(a, b)` out of a list needs one of
  // the wider ones to avoid leaving a comma behind.
  rift.core.StructuralMatchRanges replacement_ranges = 3;
  // Facts the adapter carries that this model has no field for, under a reverse-domain key.
  rift.core.Extensions extensions = 4;
  // Identity of this match and the state it was found in. An edit addressed at it is checked
  // against this before it lands.
  string key = 5;
}
// A text match. Bytes matched bytes, with no tree behind them and nothing to say about what is
// safe to replace.
message MatchHitText {
  // The named captures this match bound, in the order the pattern declares them.
  repeated rift.core.Capture captures = 1;
  // Why this is a match, one step per line.
  repeated string explanation = 2;
  // Identity of this match and the state it was found in. An edit addressed at it is checked
  // against this before it lands.
  string key = 3;
}
// One match, tagged by the engine that produced it. The tag equals `key.query.kind`. A
// structural match carries grammar-derived replacement ranges. A text match carries source
// captures only.
message MatchHit {
  oneof variant {
    MatchHitStructural structural = 1;
    MatchHitText text = 2;
  }
}
// A match query and page size for the session projection.
message MatchParams {
  // What to look for, and which engine answers it.
  rift.core.MatchQuery query = 1;
  // Most matches to return in one page, capped by `max_page_items`.
  optional int64 limit = 2;
  // Continues a previous match where its last page ended. Omit it for the first page.
  optional string cursor = 3;
}
// One page of matches. Matches sort by file bytes, range, and canonical key. A match key names
// the file it was found in, so Rift rechecks that file before applying an edit addressed at it.
message MatchResult {
  // The matches on this page.
  repeated MatchHit matches = 2;
  // How much of the selected path set was searched. A file too large to read makes this partial
  // with a reason.
  rift.core.Coverage coverage = 3;
  // Cursor for the next page, or null after the final result.
  optional string next_cursor = 4;
}
// One `Diagnostic` as an MCP answer carries it: the fact the adapter minted, plus what Rift can
// add without the adapter — where it lands in a line and column, and the source around it.
message DiagnosticContext {
  // Component that produced the diagnostic. Rift sets this after collecting adapter, validator,
  // or apply output.
  enum Source {
    // The caller did not set a value.
    SOURCE_UNSPECIFIED = 0;
    // The language's own analysis.
    ADAPTER = 1;
    // A check Rift ran over a proposed change.
    VALIDATOR = 2;
    // Output from applying edits to the workspace.
    APPLY = 3;
  }
  Source source = 1;
  // The finding itself, exactly as the adapter minted it.
  rift.core.Diagnostic diagnostic = 3;
  // One-based line the finding starts on. Null where the diagnostic has no span — a
  // whole-project error has nowhere to point.
  optional int64 line = 4;
  // One-based column within that line, counted in UTF-8 bytes. Null for the same reason as
  // `line`.
  optional int64 column = 5;
  // The source the finding points at. Null where there is no span to copy from.
  optional SourceExcerpt excerpt = 6;
}
// One cause in a failure chain. Entries appear from the outer operation to the concrete
// failure.
message ErrorCause {
  // How this link classifies on its own.
  ErrorCode code = 1;
  // What happened, for a human reading a log.
  string message = 2;
  // What could be done about this cause. The request's outer directive governs the call.
  RetryDirective retry = 3;
}
// The versions the server implements, carried when it rejects the caller's. Without it the
// caller cannot pick a version to reconnect with.
message ProtocolEvidence {
  // Versions the server implements, newest first.
  repeated string supported = 1;
  // The versions the caller declared, echoed back in the order received.
  repeated string requested = 2;
}
// The `data` object on every Rift MCP failure. `code` and `retry` are what a caller branches
// on, `message` is for a human, and the remaining fields carry the evidence available for that
// failure.
message ErrorData {
  // How far the request got before it failed. The same code means different things at different
  // phases: `limit_exceeded` while reading is a response too big, and while validating it is a
  // change set too large.
  enum Phase {
    // The caller did not set a value.
    PHASE_UNSPECIFIED = 0;
    // Working out what the workspace can do: capabilities, limits, which languages have
    // adapters.
    DISCOVERY = 1;
    // Reading workspace or adapter data.
    READ = 2;
    // Turning an address, a cursor or an action key into the concrete thing it names at a
    // state.
    RESOLVE = 3;
    // Checking a proposed change against the schema, the state it was pinned to, and the checks
    // required by the workspace-root `rift.toml`.
    VALIDATE = 4;
    // Resolving the operation, writing the result into the projection, and validating the
    // resulting tree.
    CHANGE = 5;
    // Publishing projection changes to the workspace.
    PUBLISH = 6;
    // Preparing an execution workspace and evaluating caller-provided code.
    EXECUTE = 7;
    // Starting, inspecting, or stopping a connection-bound debugging session.
    DEBUG = 8;
  }
  // Why the request failed.
  ErrorCode code = 1;
  // Human-readable account of the failure. Machine-readable classification remains in the
  // surrounding fields.
  string message = 2;
  // What the caller may do next.
  RetryDirective retry = 3;
  Phase phase = 4;
  // What an adapter or configured command check reported while the request was failing. Empty
  // where neither ran.
  repeated DiagnosticContext diagnostics = 7;
  // Which advertised limit was hit, and by how much. Present exactly when `code` is
  // `limit_exceeded`, and forbidden otherwise.
  optional LimitEvidence limit = 8;
  // What led to this failure, outermost first. A code alone rarely says whether the cause is
  // worth waiting out.
  repeated ErrorCause causes = 9;
  // The server's supported versions. Present exactly when `code` is `unsupported_protocol`, and
  // forbidden otherwise.
  optional ProtocolEvidence protocol = 10;
}
// Which advertised limit a `limit_exceeded` failure hit, and by how much. It is present exactly
// when the code is `limit_exceeded`; without it, choosing between retrying smaller, falling
// back to another resource and giving up means reparsing the human message.
message LimitEvidence {
  // Which side of the server the limit belongs to: a `driver` limit is enforced by Rift around
  // the request, while an `adapter` limit is enforced inside one adapter process.
  enum Scope {
    // The caller did not set a value.
    SCOPE_UNSPECIFIED = 0;
    // A field of `Limits`, advertised by the workspace resource.
    DRIVER = 1;
    // A field of the adapter's `AdapterLimits`, advertised in `Describe`.
    ADAPTER = 2;
  }
  Scope scope = 1;
  // The limit's field path below whichever message `scope` names, such as `max_page_items`,
  // `execution.max_concurrent`, or `max_in_flight_per_state`.
  string field = 2;
  // The value in force when the request was rejected.
  int64 limit = 3;
  // What the request would have needed. Larger than `limit`, and the difference is what the
  // caller has to close.
  int64 required = 4;
}
// The grammar a `TextQuery` pattern is read in.
message MatchSyntaxText {
  string name = 1;
  int64 version = 2;
}
// The grammar used by path selectors.
message MatchSyntaxPath {
  string name = 1;
  int64 version = 2;
}
// The two pattern grammars this workspace accepts: one for text patterns and one for path
// globs. Names remain stable; their version fields select syntax and matching semantics.
message MatchSyntax {
  MatchSyntaxText text = 1;
  MatchSyntaxPath path = 2;
}
// A link to one Rift resource, as MCP carries it inside tool output. `name` selects the family,
// which fixes the URI shape a read of `uri` accepts and the media type it returns.
message ResourceLink {
  // The resource to read. Hand it to `resources/read` unchanged.
  string uri = 1;
  // The resource family this link belongs to.
  ResourceFamily name = 2;
  // What a read of `uri` returns, as `application/vnd.rift.<family>+json`.
  string mime_type = 3;
}
// One advertised MCP resource template, as `resources/templates/list` returns it. The family
// fixes the template and the media type.
message ResourceTemplate {
  // The resource family being advertised.
  ResourceFamily name = 1;
  // What a read of a URI from this template returns, as `application/vnd.rift.<family>+json`.
  string mime_type = 2;
}
// The URI passed to MCP `resources/read`. Each branch is one advertised Rift resource family.
message ResourceReadParams {
  // A URI matching one advertised resource family.
  string uri = 1;
}
// One content block of an MCP resource read. `text` holds the family's payload as JSON —
// `WorkspaceResourcePayload` for `rift://workspace`, `SymbolResourcePayload` for a symbol URI,
// and so on — and `mimeType` names which. The `rift:contentTypes` map in the schema carries the
// complete pairing.
message ResourceContent {
  // The URI that was read, as it resolved.
  string uri = 1;
  // Which payload `text` holds, as `application/vnd.rift.<family>+json`.
  string mime_type = 3;
  // The payload, serialized as JSON.
  string text = 2;
}
// The result of one MCP resource read. Each Rift resource returns one JSON payload in `text`,
// identified by `mimeType`. File bytes use UTF-8 or base64.
message ResourceReadResult {
  // The blocks this read produced. MCP allows several per read; each Rift resource returns one.
  repeated ResourceContent contents = 1;
}
// A symbol hit: the declaration the adapter resolved, and a link to read the rest of what Rift
// knows about it.
message SearchHitTargetSymbol {
  // The declaration that matched.
  rift.core.Symbol symbol = 1;
  // Link to the symbol resource that carries this symbol's nodes and relationships.
  ResourceLink resource = 2;
}
// A node hit: one place in a syntax tree, without its enclosing symbol record.
message SearchHitTargetNode {
  // The syntax-tree node that matched, and the symbol written at it where there is one.
  rift.core.Node node = 1;
}
// A file hit: one entry of the workspace tree. The only hit that needs no adapter.
message SearchHitTargetFile {
  // The tree entry that matched: what it holds, and which languages read it.
  rift.core.File file = 1;
}
// What a search hit is. Tagged, so the payload correlation survives code generation.
message SearchHitTarget {
  oneof variant {
    SearchHitTargetSymbol symbol = 1;
    SearchHitTargetNode node = 2;
    SearchHitTargetFile file = 3;
  }
}
// Concrete filesystem edits supplied by the caller. Their ranges address the state this
// operation resolves against, and replacements in one set may not overlap.
message EditParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // An atomic effect set in canonical file-and-range order. Every text replacement addresses
  // the state before this operation.
  repeated rift.core.Edit edits = 4;
}
// A UTF-8 unified diff guarded by its context lines. A malformed patch — an absolute path, path
// traversal, a binary patch, a broken header — is `invalid_request`; a hunk whose context
// differs from the state it resolves against is a refusal carrying a failed `source_unchanged`
// precondition.
message PatchParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // Unified text diff with project-relative `a/` and `b/` paths.
  string patch = 4;
}
// An atomic query-and-rewrite. Rift finds every match, checks the cardinality, expands the
// replacement, and either applies all resulting edits or refuses the operation.
message RewriteParams {
  // Which safe structural range is replaced. Text queries accept `exact` only because they have
  // no grammar-owned trivia boundaries.
  enum Range {
    // The caller did not set a value.
    RANGE_UNSPECIFIED = 0;
    EXACT = 1;
    LEADING = 2;
    TRAILING = 3;
    BOTH = 4;
  }
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The text or structural pattern evaluated against the state this operation resolves against.
  rift.core.MatchQuery query = 4;
  // UTF-8 replacement template. `${NAME}` inserts the source bound by a named or numeric
  // capture, `${0}` inserts the whole match, and `$$` inserts one dollar sign. An absent
  // capture refuses the rewrite.
  string replacement = 5;
  Range range = 6;
  // The accepted number of matches before expansion.
  rift.core.MatchCardinality cardinality = 7;
}
// Changes what a declaration is called and rewrites the references that name it. The adapter
// checks language spelling, collisions, and binding changes; a reference outside `scope`
// refuses the operation rather than leaving it half done.
message RenameParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The declaration to rename.
  rift.core.Address target = 4;
  // The new name, and the source eligible for propagation.
  rift.core.RenameArguments arguments = 5;
}
// Moves a declaration or file to another container or path and updates the imports and
// references that reach it.
message MoveParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The declaration, file, or directory to move.
  rift.core.Address target = 4;
  // The destination, and the source eligible for import and reference updates.
  rift.core.MoveArguments arguments = 5;
}
// Removes a declaration. Without a policy this is a mechanical removal that analyses no
// references and claims no reference guarantee. With one, the adapter classifies every
// remaining use, applies the stated disposition, and refuses the operation when reference
// coverage is incomplete.
message DeleteParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The declaration, file, or directory to remove.
  rift.core.Address target = 4;
  // The disposition for each classified use, and the source it may be applied in.
  rift.core.SafeDeleteArguments arguments = 5;
}
// Changes the shape of a callable and propagates it. Unlike a rename, this rewrites argument
// lists: a new required parameter has to be supplied at every call site, which is why the
// operation commonly raises a `behavior_unknown` confirmation.
message ChangeSignatureParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The callable whose signature changes.
  rift.core.Address target = 4;
  // The desired callable shape, its propagation, and the source it may reach.
  rift.core.ChangeSignatureArguments arguments = 5;
}
// Resolves one discovered adapter action — a quick fix, an extraction, an inline, anything an
// adapter offers that has no portable argument contract. Rift validates `arguments` against the
// offer's advertised schema. An offer carrying a portable argument contract is refused here,
// because `rename`, `move`, `delete`, and `change_signature` are its typed entry points.
message ActParams {
  // Formatting applied after this operation's edits resolve.
  rift.core.FormattingPolicy formatting = 3;
  // The offer to resolve, as the actions resource returned it.
  string action = 4;
  // Arguments accepted by the offer's `ActionDescriptor.arguments_schema`. An action with no
  // parameters receives an empty object.
  google.protobuf.Struct arguments = 5;
}
// Restores changed paths from the current workspace.
message ProjectionRestoreParams {
  // Changed paths to restore. Null restores every changed path. Naming any path of a change
  // restores every path that change touched — a change leaves the changeset whole.
  repeated string paths = 2;
}
// What a passing run of one configured command establishes.
message CommandValidatorGuarantees {
  // Guarantee established when the validator passes.
  rift.core.GuaranteeKind kind = 1;
  // Source over which the command checks the property.
  rift.core.CoverageScope scope = 2;
  // Exact property the command checks and limits on interpreting a pass.
  string detail = 3;
}
// A command from the workspace-root `rift.toml`, run without a shell inside the session's
// projection directory. Whatever it writes there is published with the projection. The command
// runs the tree it checks, so it executes unpublished changes.
message CommandValidator {
  // How workspace configuration presents this check.
  enum Kind {
    // The caller did not set a value.
    KIND_UNSPECIFIED = 0;
    KIND_TEST = 1;
    KIND_LINT = 2;
    KIND_BUILD = 3;
    KIND_OTHER = 4;
  }
  // Whether Rift appends changed `ProjectPath` values to `argv` in byte order.
  enum ChangedPaths {
    // The caller did not set a value.
    CHANGED_PATHS_UNSPECIFIED = 0;
    CHANGED_PATHS_NONE = 1;
    CHANGED_PATHS_APPEND = 2;
  }
  // Whether an identical tree and environment are expected to produce the same result.
  enum Determinism {
    // The caller did not set a value.
    DETERMINISM_UNSPECIFIED = 0;
    DETERMINISM_DETERMINISTIC = 1;
    DETERMINISM_BEST_EFFORT = 2;
  }
  // Label shown with this validator. It is unique within `validators.commands`.
  string id = 1;
  Kind kind = 2;
  // Executable followed by literal arguments. An absolute executable path is refused; a bare
  // name resolves through the `PATH` of the merged environment the command runs with, and a
  // relative path resolves below `working_directory` in the session projection. Rift performs
  // no shell expansion.
  repeated string argv = 3;
  ChangedPaths changed_paths = 4;
  // Directory below the projection root in which the process starts. The empty path selects the
  // root.
  string working_directory = 5;
  // Environment values added on top of the environment the server inherited. Rift starts the
  // command directly, without a shell, and supplies its working directory separately.
  map<string, string> environment = 6;
  // Wall-clock limit before Rift terminates the process.
  int64 timeout_ms = 7;
  // Captured prefix limit for each output stream. `CapturedText.total_bytes` reports the
  // omitted size. The upper bound keeps one escaped validator result inside one bounded result.
  int64 output_limit_bytes = 8;
  // Behavior or other properties this command is intended to check. A passing result turns each
  // declaration into `GuaranteeEvidence`; a failed result attaches a `ConfirmationRequirement`
  // to the change.
  repeated CommandValidatorGuarantees guarantees = 9;
  Determinism determinism = 10;
}
// Bounded adapter-validation evidence for one applied session change.
message ChangeValidation {
  // How much semantic validation the result contains.
  enum Strength {
    // The caller did not set a value.
    STRENGTH_UNSPECIFIED = 0;
    // No affected adapter supplied a semantic validation report.
    STRENGTH_MECHANICAL = 1;
    // Every affected adapter that advertises validation supplied a complete report.
    STRENGTH_AVAILABLE = 2;
    // Every language named by `validation.require` supplied a complete report.
    STRENGTH_REQUIRED = 3;
  }
  // Semantic validation strength established for the resulting tree.
  Strength strength = 3;
  // Adapter reports in language order.
  repeated rift.core.ValidationReport adapter_reports = 4;
}
// One change in the projection's changeset, with everything Rift learned while resolving it.
// A change carrying confirmations is recorded the same way as one carrying none; the
// confirmations are what publication checks.
message ChangeSummary {
  // Identity of this change in the changeset.
  string id = 1;
  // Adapter validation of the resulting projection.
  ChangeValidation validation = 3;
  // Concrete edits in canonical file-and-range order.
  repeated rift.core.Edit edits = 4;
  // Semantic effects in adapter emission order.
  repeated rift.core.OperationEffect effects = 6;
  // Scoped guarantee evidence in guarantee-kind order.
  repeated rift.core.GuaranteeEvidence guarantees = 7;
  // Resolution findings in source order.
  repeated rift.core.Diagnostic diagnostics = 8;
  // Effects the caller has to accept before this change can be published, sorted by kind,
  // source location, title, and detail. Empty where every affected adapter and validator
  // vouched for the result.
  repeated rift.core.ConfirmationRequirement confirmations = 10;
  // Projection state after this change landed.
  rift.core.ProjectionState current = 9;
}
// One page of the session's changeset, oldest change first. This is the read the caller makes
// before publishing: every change it applied, what each one did, and which of them nobody
// vouched for.
message ChangesResourcePayload {
  // The URI this payload answers for.
  string uri = 1;
  // Projection state the page was read from.
  rift.core.ProjectionState state = 2;
  // Changes on this page, in the order they were applied.
  repeated ChangeSummary changes = 3;
  // The same resource carrying the cursor for the next page, or null on the last one.
  optional string next = 4;
}
// The operation resolved to edits and Rift wrote them into the projection.
message ChangeApplied {
  // The applied change and its evidence.
  ChangeSummary summary = 1;
}
// Resolution produced no edits, so the projection is untouched.
message RefusedResult {
  // The condition the caller can act on.
  rift.core.RefusalReason reason = 2;
  // Conditions checked before refusal, including at least one failed entry for
  // `unmet_precondition`.
  repeated rift.core.OperationPrecondition preconditions = 3;
  // Existing code, paths, or relationships that prevented a deterministic resolution.
  repeated rift.core.OperationBlocker blockers = 4;
  // Evidence that explains the refusal.
  repeated rift.core.Diagnostic diagnostics = 5;
}
// An applied projection change or semantic refusal.
message ChangeResult {
  oneof variant {
    ChangeApplied applied = 1;
    RefusedResult refused = 2;
  }
}
// Publishes the session projection into the workspace. Publication is the one step that
// writes into the workspace, so it is where confirmations are settled: a change carrying
// one is published only when this call names it.
message PublishParams {
  // Changes whose confirmations the caller accepts. A change carrying a confirmation and absent
  // here is returned in `unaccepted` and nothing is written.
  repeated string accept = 1;
}
// The result of publishing projection changes into the workspace.
message PublishResult {
  // Current projection state after the attempt.
  rift.core.ProjectionState state = 2;
  // Paths changed in both this projection and the workspace. Non-empty means nothing was
  // written.
  repeated string conflicts = 3;
  // Changes carrying a confirmation that `accept` did not name, sorted by change identity.
  // Non-empty means nothing was written.
  repeated string unaccepted = 4;
}
// One filesystem entry from the session projection.
message FsResourcePayload {
  // How a filesystem resource entry is represented.
  enum Encoding {
    // The caller did not set a value.
    ENCODING_UNSPECIFIED = 0;
    ENCODING_DIRECTORY = 1;
    ENCODING_UTF8 = 2;
    ENCODING_BASE64 = 3;
    ENCODING_NONE = 4;
  }
  // Exact resource request this payload answers.
  string uri = 1;
  // Directory, regular file, or symbolic link named by the URI.
  rift.core.ProjectEntry entry = 3;
  // How this entry's payload is represented.
  Encoding encoding = 4;
  // Directory children on this page — subdirectories and files alike, each one a complete
  // `ProjectEntry`, sorted bytewise by path.
  repeated rift.core.ProjectEntry entries = 5;
  optional int64 start = 6;
  optional int64 end = 7;
  optional int64 total_bytes = 8;
  optional string content = 9;
  // SHA-256 of the complete file for a regular-file read, null for directories and symlinks.
  // Compare it across pages of one range read: a changed digest means the file moved underneath
  // the read, and the range starts over at zero.
  optional string digest = 11;
  // Continuation for the same entry.
  optional string next = 10;
}
// Effective caller-code routing after Rift intersects `rift.toml` with one adapter's
// advertised operations.
message ExecutionAvailability {
  // Whether execute may route to this language after workspace configuration and adapter
  // capability are applied.
  bool execute = 1;
  // Whether all three debug tools may route to this language. True requires execute enablement
  // and the complete adapter debug operation triplet.
  bool debug = 2;
}
// Capabilities advertised by one configured language adapter. `execution` applies the
// workspace configuration to its caller-code operations.
message LanguageSupport {
  // Language name and optional dialect handled by the adapter.
  rift.core.Language language = 1;
  // Implementation name and version the adapter advertises.
  string adapter = 2;
  // Optional operations implemented by the adapter, sorted by protocol order.
  repeated rift.core.AdapterOperation operations = 3;
  // Fact families the adapter may emit from Analyze, sorted by protocol order.
  repeated rift.core.FactFamily fact_families = 4;
  // Supported action families in kind-prefix order. Empty when `actions` is not advertised or
  // the adapter has no action families.
  repeated rift.core.ActionSupport action_kinds = 5;
  // Effective workspace configuration and adapter capability for caller code.
  ExecutionAvailability execution = 6;
}
// The Protobuf service exposed by the Rift server. `rift mcp` maps its JSON entry points to
// these methods.
service Rift {
  // Opens one caller session and returns its writable projection. A session ID admits one live
  // connection.
  rpc Connect (rift.mcp.ConnectRequest) returns (stream rift.mcp.Connected);
  // Lists retained sessions and their projection state.
  rpc SessionList (rift.mcp.SessionListParams) returns (rift.mcp.SessionListResult);
  // Rebinds the current connection to one retained session.
  rpc SessionContinue (rift.mcp.SessionContinueParams) returns (rift.mcp.SessionContinueResult);
  // Removes one inactive session and deletes its projection. A live one, the caller's own
  // included, returns `temporarily_unavailable`.
  rpc SessionRemove (rift.mcp.SessionRemoveParams) returns (rift.mcp.SessionRemoveResult);
  // Reads the declaration structure of one file from its adapter.
  rpc Outline (rift.mcp.OutlineParams) returns (rift.mcp.OutlineResult);
  // Searches symbols, nodes, and files in the session projection.
  rpc Search (rift.mcp.SearchParams) returns (rift.mcp.SearchResult);
  // Finds literal, regular-expression, or structural matches.
  rpc Match (rift.mcp.MatchParams) returns (rift.mcp.MatchResult);
  // Evaluates code against the session projection in a disposable workspace.
  rpc Execute (rift.mcp.ExecuteParams) returns (rift.mcp.ExecuteResult);
  // Starts an inspect-only evaluation and retains bounded frames after a failure.
  rpc DebugStart (rift.mcp.DebugStartParams) returns (rift.mcp.DebugSession);
  // Reads one retained stack frame without resuming evaluation.
  rpc DebugGetFrame (rift.mcp.DebugGetFrameParams) returns (rift.mcp.DebugGetFrameResult);
  // Releases a debugging session, adapter state, and execution workspace.
  rpc DebugStop (rift.mcp.DebugStopParams) returns (rift.mcp.DebugStopResult);
  // Applies and validates an atomic edit set, and records the result in the changeset.
  rpc Edit (rift.mcp.EditParams) returns (rift.mcp.ChangeResult);
  // Applies a unified diff, and records the result in the changeset.
  rpc Patch (rift.mcp.PatchParams) returns (rift.mcp.ChangeResult);
  // Applies replacements for every match of one query. The cardinality is checked before
  // expansion, so a pattern that matches more places than intended refuses instead of rewriting
  // them.
  rpc Rewrite (rift.mcp.RewriteParams) returns (rift.mcp.ChangeResult);
  // Changes what a declaration is called and rewrites every reference that names it. The
  // adapter checks spelling, collisions, and binding changes. A reference outside the scope
  // refuses the whole operation.
  rpc Rename (rift.mcp.RenameParams) returns (rift.mcp.ChangeResult);
  // Moves a declaration or file to another container or path and updates the imports and
  // references that reach it.
  rpc Move (rift.mcp.MoveParams) returns (rift.mcp.ChangeResult);
  // Removes a declaration. Without a policy this is a mechanical removal that analyses no
  // references. With one, the adapter classifies every remaining use, applies the stated
  // disposition, and refuses when reference coverage is incomplete.
  rpc Delete (rift.mcp.DeleteParams) returns (rift.mcp.ChangeResult);
  // Changes the shape of a callable and propagates it to callers, overrides, and
  // implementations. Unlike a rename, it rewrites argument lists, so it commonly raises a
  // `behavior_unknown` confirmation.
  rpc ChangeSignature (rift.mcp.ChangeSignatureParams) returns (rift.mcp.ChangeResult);
  // Resolves one action an adapter offered — a quick fix, an extraction, an inline, or an
  // adapter-specific family. Arguments are validated against the schema the offer advertises.
  // An offer carrying a portable argument contract is refused here and resolves through its own
  // tool.
  rpc Act (rift.mcp.ActParams) returns (rift.mcp.ChangeResult);
  // Restores changed paths from the workspace and drops the changes that touched them.
  rpc ProjectionRestore (rift.mcp.ProjectionRestoreParams) returns (rift.core.ProjectionState);
  // Publishes the changeset into the workspace. A change carrying a confirmation is published
  // only when the call accepts it, and a workspace path changed since the projection took it
  // refuses the whole publication.
  rpc Publish (rift.mcp.PublishParams) returns (rift.mcp.PublishResult);
  rpc ReadResource (rift.mcp.ResourceReadParams) returns (rift.mcp.ResourceReadResult);
}
