  // refresh and publish cannot widen its reach.
  enum FormattingPolicy {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Retained candidate this operation continues. Omission starts from `rev`. The operation
  // resolves against that candidate's tree, so a rename can follow the edit that created what
  // it renames, and the chain is the transaction.
  optional string on = 1;
  // State against which resolution begins when `on` is absent. Omission selects the
  // connection's current accepted revision.
  optional string rev = 2;
  // Accepted-ref head expected at publication. Omission selects the current accepted head. The
  // selected commit must be an ancestor of `rev`.
  optional string expected_accepted = 3;
  // Formatting applied after this operation's edits resolve.
  FormattingPolicy formatting = 4;
  // The offer to resolve, as the actions resource returned it.
  string action = 5;
  // Arguments accepted by the offer's `ActionDescriptor.arguments_schema`. An action with no
  // parameters receives an empty object.
  google.protobuf.Struct arguments = 6;
  // Fixed command validators for this preview. A root candidate requires a plan, which may
  // contain an empty array; null on a chained candidate inherits its parent plan.
  optional PublicationPlan publication = 7;
}
// The request one retained candidate was built from, as the tool received it. It appears in the
// preview resource rather than in any tool parameter, so a plan can be read back and a refresh
// can repeat exactly what was asked.
message PreviewOperation {
  oneof variant {
    EditParams edit_params = 1;
    PatchParams patch_params = 2;
    RewriteParams rewrite_params = 3;
    RevertParams revert_params = 4;
    MergeParams merge_params = 5;
    RenameParams rename_params = 6;
    MoveParams move_params = 7;
    DeleteParams delete_params = 8;
    ChangeSignatureParams change_signature_params = 9;
    ActParams act_params = 10;
    IntegrateParams integrate_params = 11;
  }
}
// Bounded summary of one candidate's operation after resolution. The preview resource pages its
// exact edits and evidence.
message ResolvedOperation {
  // Language adapters that contributed to resolution, sorted by name and dialect with null
  // first. Empty for an operation resolved entirely by Rift.
  repeated rift.core.Language owners = 1;
  // Number of concrete Edit records retained for this operation.
  int64 edit_count = 2;
  // Number of satisfied preconditions retained for this operation.
  int64 precondition_count = 3;
  // Number of semantic effects retained for this operation.
  int64 effect_count = 4;
  // Number of guarantee evidence records retained for this operation.
  int64 guarantee_count = 5;
  // How completely Rift and its adapters resolved the request. Publication requires complete
  // coverage.
  rift.core.Coverage coverage = 6;
  // Number of resolution diagnostics retained for this operation.
  int64 diagnostic_count = 7;
}
// What a passing run of one command is taken to establish. The evidence covers the published
// chain, which is the whole of what the command ran against.
message CommandValidatorGuarantees {
  // A property an action claims and must establish with scoped evidence when resolved.
  enum GuaranteeKind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The language parser accepts the affected source under the stated scope.
    GUARANTEE_KIND_SYNTAX_VALIDATED = 1;
    // Unchanged references in scope resolve to the same symbols before and after the action.
    GUARANTEE_KIND_BINDINGS_PRESERVED = 2;
    // Every resolved reference in scope that should follow the operation now reaches its
    // intended target.
    GUARANTEE_KIND_REFERENCES_UPDATED = 3;
    // A named static analysis or command validator checked a stated behavioral property. The
    // evidence is limited to that named property and scope.
    GUARANTEE_KIND_BEHAVIOR_CHECKED = 4;
  }
  // Guarantee established when the validator passes.
  GuaranteeKind kind = 1;
  // Source over which the command checks the property.
  rift.core.CoverageScope scope = 2;
  // Exact property the command checks and limits on interpreting a pass.
  string detail = 3;
}
// A caller-authorized acceptance check executed directly, without a shell, in a disposable
// validation workspace materialized from the complete candidate tree. The workspace is only the
// process working directory; it does not isolate the command from the host. Rift removes it
// when the check ends.
message CommandValidator {
  // How the caller presents this check.
  enum Kind {
    // The caller did not set a value.
    KIND_UNSPECIFIED = 0;
    KIND_TEST = 1;
    KIND_LINT = 2;
    KIND_BUILD = 3;
    KIND_OTHER = 4;
  }
  // Whether Rift appends the candidate's changed `ProjectPath` values to `argv` in byte order.
  enum ChangedPaths {
    // The caller did not set a value.
    CHANGED_PATHS_UNSPECIFIED = 0;
    CHANGED_PATHS_NONE = 1;
    CHANGED_PATHS_APPEND = 2;
  }
  // Whether an identical candidate and environment are expected to produce the same result.
  enum Determinism {
    // The caller did not set a value.
    DETERMINISM_UNSPECIFIED = 0;
    DETERMINISM_DETERMINISTIC = 1;
    DETERMINISM_BEST_EFFORT = 2;
  }
  // Caller label shown with this validator. The result links to the complete declaration by
  // digest, so labels may repeat.
  string id = 1;
  Kind kind = 2;
  // Executable followed by literal arguments. An absolute executable path is refused; a bare
  // name resolves through the validator PATH and a relative path resolves below
  // `working_directory`. Rift performs no shell expansion.
  repeated string argv = 3;
  ChangedPaths changed_paths = 4;
  // Directory below the project root in which the process starts. The empty path selects the
  // root.
  string working_directory = 5;
  // Caller-supplied environment additions. Rift supplies a policy-controlled PATH, private HOME
  // and temporary directories, and a UTF-8 locale; it removes host secrets and every other
  // inherited variable.
  map<string, string> environment = 6;
  // Wall-clock limit before Rift terminates the process.
  int64 timeout_ms = 7;
  // Captured prefix limit for each output stream. `CapturedText.total_bytes` reports the
  // omitted size. The upper bound keeps one escaped validator result inside a 65536-byte
  // preview page.
  int64 output_limit_bytes = 8;
  // Behavior or other properties this command is intended to check. A passing result turns each
  // declaration into `GuaranteeEvidence`; a failed result rejects publication.
  repeated CommandValidatorGuarantees guarantees = 9;
  Determinism determinism = 10;
}
// Command checks fixed when a preview is created. Rift stores the complete plan with the
// preview and includes its canonical bytes in `PreviewId`.
message PublicationPlan {
  // Checks run against the complete tip tree during publication, in declaration order. An empty
  // array requests no command validators.
  repeated CommandValidator validators = 1;
}
// A declared validator process that exited with status zero.
message ValidatorResultPassed {
  optional int64 exit_code = 1;
  // SHA-256 of the validator's RFC 8785 canonical JSON declaration. Results and declarations
  // form a bijection on this value, because labels may repeat while commands differ.
  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  rift.core.CapturedText stdout = 5;
  // Bounded standard error from the process.
  rift.core.CapturedText stderr = 6;
}
// A declared validator process that exited with a nonzero status.
message ValidatorResultFailed {
  int64 exit_code = 1;
  // SHA-256 of the validator's RFC 8785 canonical JSON declaration. Results and declarations
  // form a bijection on this value, because labels may repeat while commands differ.
  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  rift.core.CapturedText stdout = 5;
  // Bounded standard error from the process.
  rift.core.CapturedText stderr = 6;
}
// The completed outcome of one declared validator. Exit status zero passes. Every other exit
// status fails. A workspace, launch, timeout, or capture failure raises
// `validator_execution_failure` before Rift produces candidate evidence.
message ValidatorResult {
  oneof variant {
    ValidatorResultPassed passed = 1;
    ValidatorResultFailed failed = 2;
  }
}
// Bounded verdict over a candidate's adapter reports and command validators. The preview
// resource carries the complete paginated evidence.
message CandidateValidation {
  // Whether every adapter required by workspace validation policy returned complete coverage
  // and every declared validator produced a result.
  bool complete = 1;
  // True when `complete` is true, every adapter report is valid, and every validator result
  // passed. Publication requires true.
  bool valid = 2;
  // Number of adapter reports retained by the preview.
  int64 adapter_reports = 3;
  // Number of command-validator results retained by the preview.
  int64 validator_results = 4;
  // Number of retained validator results with `passed` status.
  int64 validators_passed = 5;
}
// Bounded identity and validation evidence for a retained apply or integration candidate. The
// linked preview resource carries the complete plan.
message CandidateSummary {
  // The retained plan's stable identity, derived from the request that produced it.
  string preview = 1;
  // The state against which this operation resolved.
  rift.core.Snapshot base = 2;
  // The candidate this one continues, or null when it started from `rev`. Following `parent`
  // from a tip reads the complete chain a publication would advance.
  optional string parent = 8;
  // Ref head that publication will compare-and-swap. Apply reports the accepted head;
  // integration reports the target head.
  string expected_head = 3;
  // Immutable Git commit containing the resolved change. It remains outside the destination ref
  // until publication succeeds.
  string candidate = 4;
  // Link to the complete retained plan.
  PreviewResourceLink resource = 5;
  // Bounded verdict and evidence counts for this candidate.
  CandidateValidation validation = 6;
  // Number of acknowledgement requirements retained in the preview resource.
  int64 confirmation_count = 7;
}
// One page of a retained candidate. Concatenating every array from successive pages
// reconstructs the complete plan and its validation evidence. Every page repeats the URI, base,
// candidate, and bounded verdict. A candidate holds one operation; `parent` reads back the
// chain it belongs to.
message PreviewResourcePayload {
  // The preview resource URI for this page.
  string uri = 1;
  // The state from which resolution began.
  rift.core.Snapshot base = 2;
  // The candidate this one continues, or null when it started from a revision.
  optional string parent = 3;
  // The immutable candidate commit produced by this operation.
  string candidate = 4;
  // The request this candidate was built from, as the tool received it.
  PreviewOperation operation = 5;
  // Bounded resolution summary for that operation.
  ResolvedOperation resolved = 6;
  // Concrete edits on this page, in canonical file-and-range order.
  repeated rift.core.Edit edits = 7;
  // Satisfied preconditions on this page, in check order.
  repeated rift.core.OperationPrecondition preconditions = 8;
  // Semantic effects on this page, in adapter emission order.
  repeated rift.core.OperationEffect effects = 9;
  // Guarantee evidence on this page, ordered by guarantee kind.
  repeated rift.core.GuaranteeEvidence guarantees = 10;
  // Resolution findings on this page, ordered by source location.
  repeated rift.core.Diagnostic resolution_diagnostics = 11;
  // File-level diff entries on this page, ordered by the path present after the change and then
  // by the path present before it.
  repeated rift.core.FileChange files = 12;
  // Bounded verdict for the complete candidate.
  CandidateValidation validation = 13;
  // Command declarations fixed by this preview's publication plan, preserving declaration
  // order.
  repeated CommandValidator validators = 14;
  // Adapter reports on this page, sorted by language name and dialect with null first and
  // unique across the complete resource.
  repeated rift.core.ValidationReport adapter_reports = 15;
  // Command-validator results on this page, preserving declaration order and appearing once
  // across the complete resource.
  repeated ValidatorResult validator_results = 16;
  // Acknowledgements on this page, sorted by id across the complete resource.
  repeated rift.core.ConfirmationRequirement confirmations = 17;
  // Rift findings about the complete plan, including path, ownership, and formatting decisions.
  repeated rift.core.Diagnostic diagnostics = 18;
  // The URI for the next plan page, or null after the final page.
  optional string next = 19;
}
// Resolution or publication stopped before a valid candidate existed. No ref and no worktree
// changed.
message RefusedResult {
  // Why Rift declined a candidate operation or its publication. A refusal is a completed
  // decision with evidence, not a transport failure; `ErrorData` carries the failures that
  // never reached a decision.
  enum RefusalReason {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // No adapter implements this operation for the language it reaches, or repository state
    // cannot satisfy the contract.
    REFUSAL_REASON_UNSUPPORTED = 1;
    // A condition checked before resolution failed. The failed entry is in `preconditions`.
    REFUSAL_REASON_UNMET_PRECONDITION = 2;
    // The address resolves to several targets. Narrow it and ask again.
    REFUSAL_REASON_AMBIGUOUS_TARGET = 3;
    // The retained candidate no longer matches the head or source it was built against.
    REFUSAL_REASON_STALE_PREVIEW = 4;
    // The offer was discovered against a snapshot that has moved. Read the actions resource
    // again.
    REFUSAL_REASON_STALE_ACTION = 5;
    // The match was found against a snapshot that has moved. Search again.
    REFUSAL_REASON_STALE_MATCH = 6;
    // A rewrite matched fewer or more times than its cardinality accepts.
    REFUSAL_REASON_CARDINALITY_MISMATCH = 7;
    // Publication needs an acknowledgement the caller did not supply.
    REFUSAL_REASON_CONFIRMATION_REQUIRED = 8;
    // The complete effect reaches outside what the caller can have meant — outside the project,
    // or into generated source.
    REFUSAL_REASON_UNSAFE_EFFECT = 9;
    // The requested formatting policy has no formatter behind it for an affected language.
    REFUSAL_REASON_FORMATTER_UNSUPPORTED = 10;
    // Required adapter or command validation did not complete.
    REFUSAL_REASON_VALIDATION_INCOMPLETE = 11;
    // The offer belongs to a portable family, which resolves through `rename`, `move`,
    // `delete`, or `change_signature` rather than through `act`.
    REFUSAL_REASON_PORTABLE_FAMILY = 12;
    // The integration target is checked out and automatic integration is disabled.
    REFUSAL_REASON_CHECKED_OUT_TARGET = 13;
    // The checked-out integration target has local changes.
    REFUSAL_REASON_DIRTY_TARGET = 14;
  }
  // State against which the refused work was attempted.
  rift.core.Snapshot base = 1;
  // The condition the caller can act on.
  RefusalReason reason = 2;
  // Conditions checked before refusal, including at least one failed entry for
  // `unmet_precondition`.
  repeated rift.core.OperationPrecondition preconditions = 3;
  // Existing code, paths, or relationships that prevented a deterministic resolution.
  repeated rift.core.OperationBlocker blockers = 4;
  // Evidence that explains the refusal.
  repeated rift.core.Diagnostic diagnostics = 5;
}
// A retained candidate. Nothing has been published: the accepted ref, the integration target,
// and the connection worktree are unchanged until `publish` and `persist`.
message CandidateCreated {
  // Candidate identity and acceptance evidence.
  CandidateSummary summary = 1;
}
// What every candidate-creating tool returns: a retained candidate, or a refusal carrying the
// conditions and code that stopped it. Malformed requests, unavailable infrastructure, storage
// faults, and validator execution failures use `ErrorData` instead.
message CandidateResult {
  oneof variant {
    CandidateCreated candidate = 1;
    RefusedResult refused = 2;
  }
}
// Re-runs a retained candidate's operation on a newer base. Because each candidate holds one
// operation and names the candidate it continued, refreshing a chain replays the same requests
// in the same order.
message RefreshParams {
  // The retained candidate to run again.
  string preview = 1;
  // New base. Omission selects the current accepted revision.
  optional string rev = 2;
  // Accepted-ref head expected at publication. Omission selects the current accepted head. The
  // selected commit must be an ancestor of `rev`.
  optional string expected_accepted = 3;
  // Replacement publication plan for the refreshed preview. Null preserves the exact plan
  // stored by the earlier preview.
  optional PublicationPlan publication = 4;
}
// A new retained candidate produced from an earlier one and a selected base.
message RefreshedResult {
  // The candidate whose operation was rerun.
  string previous = 1;
  // Identity and evidence for the refreshed candidate.
  CandidateSummary summary = 2;
  // Number of resolved records — edits, preconditions, effects, guarantees, coverage,
  // diagnostics — that differ from the previous candidate. Comparing the two preview resources
  // yields the exact records.
  int64 changed_record_count = 3;
  // Number of candidate paths that differ from the previous candidate. Comparing the paginated
  // file records yields the exact paths.
  int64 changed_file_count = 4;
}
// A rerun of one retained candidate against a newer base.
message RefreshResult {
  oneof variant {
    RefreshedResult refreshed = 1;
    RefusedResult refused = 2;
  }
}
// Publishes one retained candidate. Rift verifies the retained chain, runs the command
// validators fixed by the tip preview, and advances the destination by compare-and-swap: the
// accepted ref for an ordinary candidate, the target branch for an integration.
message PublishParams {
  // The retained candidate to publish. Its chain publishes with it.
  string preview = 1;
  // Every confirmation id the candidate currently requires, sorted bytewise. Missing or extra
  // ids refuse publication.
  repeated int64 confirmations = 2;
}
// Publication advanced the accepted ref to the retained candidate commit, so `accepted` equals
// `summary.candidate`. The connection worktree remains unchanged until `persist` materializes
// it.
message AcceptedResult {
  // The published candidate and its acceptance evidence.
  CandidateSummary summary = 1;
  // The commit now held by the accepted ref.
  string accepted = 2;
  // Whether the accepted ref already held this candidate, so publication returned the earlier
  // outcome without repeating it.
  bool replayed = 3;
}
// Publication advanced an integration target to the retained merge candidate.
message IntegratedResult {
  // Local branch advanced by publication.
  string target = 1;
  // Target head replaced by publication.
  string previous = 2;
  // Commit now held by the target ref.
  string integrated = 3;
  // Published merge candidate and fresh validation evidence.
  CandidateSummary summary = 4;
  // Whether the target already held this candidate, so publication returned the earlier
  // outcome.
  bool replayed = 5;
}
// Publication reran the retained contract and validation did not pass. The candidate remains
// readable as a preview and no ref moved.
message RejectedResult {
  // The rejected candidate and the evidence that prevented acceptance.
  CandidateSummary summary = 1;
}
// Publication reached compare-and-swap after another publication had moved the destination ref.
message ConflictResult {
  // Which compare-and-swap lost. Publication is idempotent by construction: a retry that finds
  // the destination already holding the candidate returns the same success.
  enum Reason {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The accepted head moved after the candidate was built.
    STALE_BASE = 1;
    // The integration target head moved after the candidate was built.
    TARGET_MOVED = 2;
  }
  // Which destination moved.
  Reason reason = 2;
  // Destination state the retained candidate expected.
  rift.core.Snapshot expected = 3;
  // Destination state observed at publication.
  rift.core.Snapshot current = 4;
}
// A completed publication decision. An ordinary candidate advances the accepted ref; an
// integration candidate advances its target branch.
message PublishResult {
  oneof variant {
    AcceptedResult accepted = 1;
    IntegratedResult integrated = 2;
    RejectedResult rejected = 3;
    RefusedResult refused = 4;
    ConflictResult conflict = 5;
  }
}
// Merges an accepted commit into a local branch and validates the result, leaving the target
// unchanged. Two commits that are each valid can merge into a broken tree, which is why the
// merge candidate is validated like any other. `publish` advances the target.
message IntegrateParams {
  // Branch that receives the accepted commit.
  string target = 1;
  // Accepted commit to integrate. Omission selects the connection's current accepted ref.
  optional string source = 2;
  // Command validators fixed for the retained integration preview.
  PublicationPlan publication = 3;
}
// Three Git entries that could not be merged automatically at one path.
message MergeConflict {
  // Conflicting project path.
  string path = 1;
  // Entry at the merge base, or null when absent.
  optional rift.core.File base = 2;
  // Entry in the accepted source commit, or null when absent.
  optional rift.core.File source = 3;
  // Entry at the target head, or null when absent.
  optional rift.core.File target = 4;
}
// A retained, conflict-free merge candidate.
message PreparedIntegrateResult {
  // Local branch the candidate would advance.
  string target = 1;
  // Accepted commit merged into the target.
  string source = 2;
  // Retained merge candidate and validation evidence.
  CandidateSummary summary = 3;
}
// A retained provisional merge whose conflicting paths still hold the target entries, so the
// tree stays parseable and adapters can still read it. Repair it with an ordinary candidate
// tool whose `on` is this candidate.
message MergeConflictIntegrateResult {
  // Local branch used as the merge target.
  string target = 1;
  // Target head used as the provisional merge parent.
  string target_head = 2;
  // Accepted source used as the other provisional merge parent.
  string source = 3;
  // Two-parent provisional merge commit. Non-conflicting paths are merged; conflicting paths
  // retain the target entries.
  string candidate = 4;
  // Retained conflict record.
  string preview = 5;
  // Link to the retained merge and conflict evidence.
  PreviewResourceLink resource = 6;
  // Conflicts in project-path order.
  repeated MergeConflict conflicts = 7;
}
// A merge candidate, a retained provisional merge with its conflicts, or a refusal.
message IntegrateResult {
  oneof variant {
    PreparedIntegrateResult prepared = 1;
    MergeConflictIntegrateResult merge_conflict = 2;
    RefusedResult refused = 3;
  }
}
// Selects files from one accepted commit for materialization into the connection worktree.
// Omitted `paths` selects every changed path.
message PersistParams {
  // Accepted commit whose tree supplies the desired entries.
  string revision = 1;
  // Changed project paths to materialize. Omission selects all paths changed by the accepted
  // commit.
  repeated string paths = 2;
  // Whether entries absent from the accepted tree may be removed from the worktree.
  optional bool include_deletions = 3;
}
// The materialization decision for one selected path. Safety conditions are reported as skips.
// Materialization keeps sparse-checkout boundaries, leaves child repositories untouched, and
// does not hydrate external content.
message PersistOutcome {
  // What happened to this path.
  enum Outcome {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    // The worktree entry matched the candidate base and now matches the accepted commit.
    WRITTEN = 1;
    // The worktree entry already matched the accepted commit.
    UNCHANGED = 2;
    // The worktree entry differed from the candidate base and accepted commit, so
    // materialization preserved the local change.
    SKIPPED_DRIFT = 3;
    // The accepted commit removes the entry and `include_deletions` is false.
    SKIPPED_DELETION = 4;
    // The selected Git entry kind has no safe worktree materialization rule.
    SKIPPED_UNSUPPORTED_KIND = 5;
    // The selected entry refers to content Rift does not hydrate, such as Git LFS content.
    SKIPPED_EXTERNAL_CONTENT = 6;
    // The selected path is outside the worktree's sparse-checkout definition.
    SKIPPED_SPARSE = 7;
    // The selected path is a gitlink or lies inside a child repository, whose worktree is
    // managed by its own Rift connection.
    SKIPPED_NESTED_REPOSITORY = 8;
    // The selected path does not differ between the candidate base and accepted commit.
    NOT_FOUND = 9;
  }
  // Selected project path.
  string path = 1;
  Outcome outcome = 2;
}
// Materialization outcomes for one accepted commit. Results follow project-path byte order.
// Rift enumerates the selected paths and verifies that every outcome fits `max_response_bytes`
// before writing any path.
message PersistResult {
  // Accepted commit used as the source tree.
  string revision = 1;
  // Whether every selected path is `written` or `unchanged`.
  bool all_written = 2;
  // One result per selected path.
  repeated PersistOutcome outcomes = 3;
}
message FileResourcePayloadUtf8FileContent {
  optional string kind = 1;
}
message FileResourcePayloadUtf8File {
  optional FileResourcePayloadUtf8FileContent content = 1;
}
// A range whose bytes decode as UTF-8. Start and end fall on UTF-8 code-point boundaries.
message FileResourcePayloadUtf8 {
  optional string content = 1;
  optional FileResourcePayloadUtf8File file = 2;
}
message FileResourcePayloadBase64FileContent {
  optional string kind = 1;
}
message FileResourcePayloadBase64File {
  optional FileResourcePayloadBase64FileContent content = 1;
}
// A range carried as canonical base64 because its bytes do not form valid UTF-8.
message FileResourcePayloadBase64 {
  optional string content = 1;
  optional FileResourcePayloadBase64File file = 2;
}
message FileResourcePayloadNoneFileContent {
  enum Kind {
    // The caller did not set a value.
    UNSPECIFIED = 0;
    LFS_POINTER = 1;
    SYMLINK = 2;
    GITLINK = 3;
  }
  optional Kind kind = 1;
}
message FileResourcePayloadNoneFile {
  optional FileResourcePayloadNoneFileContent content = 1;
}
// A non-regular tree entry. Its empty interval carries no bytes and has no continuation.
message FileResourcePayloadNone {
  optional int64 start = 1;
  optional int64 end = 2;
  optional int64 total_bytes = 3;
  optional google.protobuf.Value content = 4;
  optional google.protobuf.Value next = 5;
  optional FileResourcePayloadNoneFile file = 6;
}
// One bounded byte range from a file at one state. Regular files carry UTF-8 text where the
// selected bytes form valid UTF-8 and base64 otherwise. `next` continues at `end` until the
// complete file has been read.
message FileResourcePayload {
  oneof variant {
    FileResourcePayloadUtf8 utf8 = 1;
    FileResourcePayloadBase64 base64 = 2;
    FileResourcePayloadNone none = 3;
  }
}
// Effective caller-code capability after intersecting repository policy with one adapter's
// advertised operations. These values, rather than adapter capability alone, govern routing.
message ExecutionAvailability {
  // Whether execute may route to this language after policy, adapter capability, and host
  // conformance intersect.
  bool execute = 1;
  // Whether all three debug tools may route to this language. True requires execute
  // authorization, the complete adapter debug operation triplet, and host conformance.
  bool debug = 2;
}
// Adapter identity and advertised capability sets for one language in this workspace.
message LanguageSupport {
  // Optional adapter operations advertised before Rift issues a call.
  enum AdapterOperation {
    // The caller did not set a value.
    ADAPTER_OPERATION_UNSPECIFIED = 0;
    // Emit advertised fact families from source.
    ADAPTER_OPERATION_ANALYZE = 1;
    // Check a changed source closure.
    ADAPTER_OPERATION_VALIDATE = 2;
    // Format selected source.
    ADAPTER_OPERATION_FORMAT = 3;
    // Run structural matching.
    ADAPTER_OPERATION_MATCH = 4;
    // Discover actions at an address.
    ADAPTER_OPERATION_ACTIONS = 5;
    // Resolve a discovered action to edits and evidence.
    ADAPTER_OPERATION_RESOLVE = 6;
    // Consume virtual source produced by another adapter.
    ADAPTER_OPERATION_SYNC_VIRTUAL = 7;
    // Evaluate a caller-provided code block against one adapter state.
    ADAPTER_OPERATION_EXECUTE = 8;
    // Start an inspect-only debugging session for a code block.
    ADAPTER_OPERATION_DEBUG_START = 9;
    // Read one retained stack frame from a debugging session.
    ADAPTER_OPERATION_DEBUG_GET_FRAME = 10;
    // Release a debugging session and its runtime state.
    ADAPTER_OPERATION_DEBUG_STOP = 11;
  }
  // One kind of fact an adapter can emit for a file. Coverage, streaming, and invalidation use
  // the family as their unit.
  enum FactFamily {
    // The caller did not set a value.
    FACT_FAMILY_UNSPECIFIED = 0;
    // Relations from produced source ranges to the physical or virtual source ranges that
    // contributed them.
    FACT_FAMILY_ORIGIN_MAPPINGS = 1;
    // The declarations the adapter resolved in the file.
    FACT_FAMILY_SYMBOLS = 2;
    // The nodes of the file's syntax tree, and which symbol each writes.
    FACT_FAMILY_NODES = 3;
    // The edges between symbols the adapter read out of this file.
    FACT_FAMILY_RELATIONSHIPS = 4;
    // The types carried by those symbols. Type facts live in `Symbol.types` and `Signature`;
    // this family records how completely the adapter resolved them.
    FACT_FAMILY_TYPES = 5;
    // What the adapter complained about while reading the file.
    FACT_FAMILY_DIAGNOSTICS = 6;
  }
  // Language name and optional dialect handled by the adapter.
  rift.core.Language language = 1;
  // Implementation name and version reported by the adapter.
  string adapter = 2;
  // Optional operations implemented by the adapter, sorted by protocol order.
  repeated AdapterOperation operations = 3;
  // Fact families the adapter may emit from Analyze, sorted by protocol order.
  repeated FactFamily fact_families = 4;
  // Supported action families in kind-prefix order. Empty when `actions` is not advertised or
  // the adapter has no action families.
  repeated rift.core.ActionSupport action_kinds = 5;
  // Effective host-policy and adapter-capability intersection for caller code.
  ExecutionAvailability execution = 6;
}
// The Protobuf service exposed by the Rift server. `rift mcp` maps its JSON entry points to
// these methods.
service Rift {
  // Opens the control stream that owns one logical client connection. The first event selects
  // the wire contract and returns the connection identity required by later RPCs.
  rpc Connect (rift.mcp.ConnectRequest) returns (stream rift.mcp.ConnectionEvent);
  // Lists the project tree at one snapshot. Rift derives directories from Git paths and answers
  // without starting a language adapter. A depth of one is an `ls`; an unbounded depth with
  // path selectors is a recursive tree, glob, or file find.
  rpc Tree (rift.mcp.TreeParams) returns (rift.mcp.TreeResult);
  // Reads the adapter-owned declaration structure of one file. Results preserve source nesting
  // and carry semantic coverage, so an empty outline distinguishes an empty file from an
  // unsupported language.
  rpc Outline (rift.mcp.OutlineParams) returns (rift.mcp.OutlineResult);
  // Searches symbols, nodes and files in a stable ranked order. A lexical query finds names or
  // text; a structured filter walks adapter facts. Path selectors narrow either form. Every
  // page carries its total order, continuation cursor, and coverage.
  rpc Search (rift.mcp.SearchParams) returns (rift.mcp.SearchResult);
  // Finds byte ranges. Rift runs literal and regular-expression matching over every UTF-8 file.
  // The owning adapter parses structural patterns because it defines the language's syntax.
  // Every hit carries a key an edit can address.
  rpc Match (rift.mcp.MatchParams) returns (rift.mcp.MatchResult);
  // Evaluates a caller-provided code block with one configured language adapter against an
  // exact snapshot. Rift prepares a disposable execution workspace and discards every
  // filesystem write made by the evaluated code.
  rpc Execute (rift.mcp.ExecuteParams) returns (rift.mcp.ExecuteResult);
  // Starts an inspect-only debugging evaluation. An unhandled failure retains bounded stack
  // frames until the caller stops the connection-bound session.
  rpc DebugStart (rift.mcp.DebugStartParams) returns (rift.mcp.DebugSession);
  // Reads one retained stack frame without resuming evaluation.
  rpc DebugGetFrame (rift.mcp.DebugGetFrameParams) returns (rift.mcp.DebugGetFrameResult);
  // Releases a debugging session, adapter state, and execution workspace.
  rpc DebugStop (rift.mcp.DebugStopParams) returns (rift.mcp.DebugStopResult);
  // Builds a candidate from an atomic set of concrete edits. Nothing is published: the
  // candidate is an immutable commit that `publish` can advance a ref to.
  rpc Edit (rift.mcp.EditParams) returns (rift.mcp.CandidateResult);
  // Builds a candidate from a unified diff. Rift checks every hunk's context against the state
  // it resolves against. A patch written for older bytes is refused before any hunk is applied.
  rpc Patch (rift.mcp.PatchParams) returns (rift.mcp.CandidateResult);
  // Builds a candidate by replacing every match of one query. The cardinality is checked before
  // expansion, so a pattern that matches more places than intended refuses instead of rewriting
  // them.
  rpc Rewrite (rift.mcp.RewriteParams) returns (rift.mcp.CandidateResult);
  // Builds a candidate from the three-way inverse of one commit against a selected parent.
  rpc Revert (rift.mcp.RevertParams) returns (rift.mcp.CandidateResult);
  // Builds a candidate by merging one exact commit into the candidate state.
  rpc Merge (rift.mcp.MergeParams) returns (rift.mcp.CandidateResult);
  // Changes what a declaration is called and rewrites every reference that names it. The
  // adapter checks spelling, collisions, and binding changes. A reference outside the scope
  // refuses the whole operation.
  rpc Rename (rift.mcp.RenameParams) returns (rift.mcp.CandidateResult);
  // Moves a declaration or file to another container or path and updates the imports and
  // references that reach it.
  rpc Move (rift.mcp.MoveParams) returns (rift.mcp.CandidateResult);
  // Removes a declaration. Without a policy this is a mechanical removal that analyses no
  // references. With one, the adapter classifies every remaining use, applies the stated
  // disposition, and refuses when reference coverage is incomplete.
  rpc Delete (rift.mcp.DeleteParams) returns (rift.mcp.CandidateResult);
  // Changes the shape of a callable and propagates it to callers, overrides, and
  // implementations. Unlike a rename, it rewrites argument lists, so it commonly raises a
  // `behavior_unknown` confirmation.
  rpc ChangeSignature (rift.mcp.ChangeSignatureParams) returns (rift.mcp.CandidateResult);
  // Resolves one action an adapter offered — a quick fix, an extraction, an inline, or an
  // adapter-specific family. Arguments are validated against the schema the offer advertises. A
  // portable family is refused here and resolves through its own tool.
  rpc Act (rift.mcp.ActParams) returns (rift.mcp.CandidateResult);
  // Merges the connection's accepted commit into a local branch and validates the result. Two
  // commits that are each valid can merge into a broken tree, so the merge candidate is
  // validated like any other. A conflict returns a parseable provisional merge.
  rpc Integrate (rift.mcp.IntegrateParams) returns (rift.mcp.IntegrateResult);
  // Reruns a retained candidate's operation against a newer base and reports how much the
  // result moved. It preserves the stored publication plan unless the caller supplies a
  // replacement for the new preview.
  rpc Refresh (rift.mcp.RefreshParams) returns (rift.mcp.RefreshResult);
  // Runs the retained preview's command validators and advances its destination by
  // compare-and-swap: the accepted ref for an ordinary candidate, the target branch for an
  // integration. A retry that finds the destination already holding the candidate returns the
  // same result.
  rpc Publish (rift.mcp.PublishParams) returns (rift.mcp.PublishResult);
  // Materializes an accepted commit into the connection worktree. Each requested path reports
  // its own outcome, so drift, sparse checkout rules, nested repositories, and deletion policy
  // remain visible to the caller.
  rpc Persist (rift.mcp.PersistParams) returns (rift.mcp.PersistResult);
  rpc ReadResource (rift.mcp.ResourceReadParams) returns (rift.mcp.ResourceReadResult);
}
