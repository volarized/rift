  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  ValidatorOutput stdout = 5;
  // Bounded standard error from the process.
  ValidatorOutput stderr = 6;
}
// A declared validator process that exited with a nonzero status.
message ValidatorResultFailed {
  int64 exit_code = 1;
  // SHA-256 of the validator's RFC 8785 canonical JSON declaration. Results and declarations
  // form a bijection on this value, because labels may repeat while commands differ.
  string declaration_digest = 2;
  // Paths evaluated by the validator, sorted by UTF-8 bytes and without duplicates.
  repeated string files = 3;
  // Structured findings produced by the validator. The list is empty when its output has no
  // configured diagnostic decoder.
  repeated rift.core.Diagnostic diagnostics = 4;
  // Bounded standard output from the process.
  ValidatorOutput stdout = 5;
  // Bounded standard error from the process.
  ValidatorOutput stderr = 6;
}
// The completed outcome of one declared validator. Exit status zero passes. Every other exit
