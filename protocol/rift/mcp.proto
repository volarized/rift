}
message ResourceContent {
  oneof variant {
    RepositoryResourceContent repository = 1;
    SymbolResourceContent symbol = 2;
    DiffResourceContent diff = 3;
    FileResourceContent file = 4;
    PreviewResourceContent preview = 5;
  }
