    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Keep every byte outside the resolved edits unchanged.
    FORMATTING_POLICY_PRESERVE = 1;
    // Run the language formatter over the smallest syntactic regions containing the resolved
    // edits.
    FORMATTING_POLICY_CHANGED_REGIONS = 2;
    // Run the language formatter over every text file touched by the change.
    FORMATTING_POLICY_AFFECTED_FILES = 3;
  }
  // Retained candidate this operation continues. Omission starts from `rev`. The operation
  // resolves against that candidate's tree, so a rename can follow the edit that created what
  // it renames, and the chain is the transaction.
  optional string on = 1;
  // State against which resolution begins when `on` is absent. Omission selects the
  // connection's current accepted revision.
  optional string rev = 2;
  // Accepted-ref head expected at publication. Omission selects the current accepted head. The
  // selected commit must be an ancestor of `rev`.
  optional string expected_accepted = 3;
  // Formatting applied after this operation's edits resolve.
  FormattingPolicy formatting = 4;
  // The callable whose signature changes.
  rift.core.Address target = 5;
  // The desired callable shape, its propagation, and the source it may reach.
  rift.core.ChangeSignatureArguments arguments = 6;
