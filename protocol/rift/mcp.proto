    // The caller did not set a value.
    UNSPECIFIED = 0;
    // Both sides modified the path.
    GIT_CONFLICT_STATUS_BOTH_MODIFIED = 1;
    // The current side added the path and the other side did not.
    GIT_CONFLICT_STATUS_ADDED_BY_US = 2;
    // The other side added the path and the current side did not.
    GIT_CONFLICT_STATUS_ADDED_BY_THEM = 3;
    // The current side deleted a path modified by the other side.
    GIT_CONFLICT_STATUS_DELETED_BY_US = 4;
    // The other side deleted a path modified by the current side.
    GIT_CONFLICT_STATUS_DELETED_BY_THEM = 5;
    // Both sides added different entries at the path.
    GIT_CONFLICT_STATUS_BOTH_ADDED = 6;
    // Both sides deleted the path with incompatible index state.
    GIT_CONFLICT_STATUS_BOTH_DELETED = 7;
  }
