// Git preserved an unmerged index and working files in the integration worktree.
message IntegrationMergeConflict {
  // Local branch used as the current side of the merge.
  string target = 1;
  // Target commit used by Git.
  string target_head = 2;
  // Session commit used as the other side of the merge.
  string source = 3;
  // Integration worktree containing Git's unmerged state.
  string worktree = 4;
  // Conflicting paths in project-path order.
  repeated GitConflict conflicts = 5;
}
// Validation rejected a clean Git merge, so the target ref did not move.
message IntegrationRejected {
  // Local branch that remained unchanged.
  string target = 1;
  // Target commit used by Git.
  string target_head = 2;
  // Session commit merged for validation.
  string source = 3;
  // Integration worktree containing the clean merged tree.
