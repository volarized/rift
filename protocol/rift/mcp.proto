  repeated CommandValidator validators = 4;
  // Requested changes on this page, preserving their transaction order.
  repeated Change requested = 5;
  // Bounded resolution summaries on this page, ordered by request index.
  repeated ResolvedChange resolved = 6;
  // Concrete edits on this page, ordered by change index and canonical edit order.
  repeated PreviewResourcePayloadEdits edits = 7;
  // Satisfied preconditions on this page, ordered by change index and check order.
  repeated PreviewResourcePayloadPreconditions preconditions = 8;
  // Semantic effects on this page, ordered by change index and adapter emission order.
