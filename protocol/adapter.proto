// The Rift server to language adapter seam.
//
// gRPC over a Unix domain socket. One Rift server starts and owns its adapters,
// one per language, and no other server shares them — so a workspace has
// exactly one party creating, refreshing and closing it, and the adapter
// arbitrates nothing. One adapter still holds several workspaces at once,
// because a workspace is one task's tree and many tasks run at once.
//
// What the adapter is handed is a `git worktree` — one per task, at the path
// this seam calls `workspace`, and at least one per MCP client the server has —
// which every adapter driven for that task reads. Compilers want a real
// filesystem, since rust-analyzer, gopls and tsc all end up calling open(2),
// and the work in that tree is committed and merged back when the run ends.
// Both want a tree git itself made.
//
// So this service carries control and results, not source. The compiler opens
// the files itself. Bytes cross in one case only: a file the adapter generated,
// which has no on-disk original for anything else to read.
//
// The adapter never writes source. Fixes and refactors come back as
// rift.core.v1.Edit and Rift applies them, so a change can be rejected
// before it lands and one agent's `rustfmt` run cannot reach another agent's
// files. Compilers still write — `target/`, `node_modules/`, `Cargo.lock` — so
// the adapter declares those paths in Describe and Rift stops treating them as
// source.
//
// This seam is protobuf; the MCP surface is JSON Schema. The model both carry —
// Symbol, Leaf, File, Snapshot — is defined once in core.json and generated
// into core.proto, so neither side owns it and neither can drift from it.
//
// What gRPC already does, this file does not repeat. There is no envelope, no
// request id, no operation name, no sequence number and no cancel operation:
// an RPC method is the operation, a stream is ordered, and a deadline or a
// cancelled context ends the call. Failures are `google.rpc.Status`, with the
// details below carried in `status.details`.

syntax = "proto3";

package rift.adapter.v1;

import "core.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/empty.proto";

// Which group a declaration belongs to. Declared here rather than left to a
// comment banner, so the grouping is descriptor data any tool can read and the
// documentation has nothing of its own to keep in step. Messages only: every
// enum in this file is nested inside the message it belongs to, and is grouped
// with it.
extend google.protobuf.MessageOptions {
  optional string section = 50000;
}

// Everything Rift can ask one language for. The adapter answers `Describe`
// once, then holds workspaces and answers questions about the code in them.
service Adapter {
  // What this adapter can do, asked once before anything else. Rift holds the
  // adapter to exactly what it claims here and never probes or feature-tests.
  rpc Describe(google.protobuf.Empty) returns (Capabilities);

  // Here is a worktree and here is the state it holds. The tree exists before
  // this call, so the adapter can start its compiler against something complete
  // the moment it is named.
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (WorkspaceState);

  // The files on disk moved to a new state, and these are the paths that
  // changed. Without this the adapter would have to stat the tree to find out,
  // and a fresh workspace per edit would make every keystroke a cold compile.
  rpc Refresh(RefreshRequest) returns (WorkspaceState);

  // Stop holding this workspace, and let Rift delete the tree. Nothing is
  // reclaimed implicitly, so this has to be said. Refused while calls are in
  // flight: a stream pinned to a state that just stopped being newest is still
  // a valid read, and killing it turns a correct answer into a failure.
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (google.protobuf.Empty);

  // Read the code and say what is in it: symbols, where they appear, how they
  // connect, and what the compiler complains about. Facts stream per file and
  // the summary closes it.
  rpc Analyze(AnalyzeRequest) returns (stream AnalyzeEvent);

  // Find code by shape rather than by text — a call with two arguments, a class
  // implementing an interface. The pattern is parsed by the language.
  rpc Match(MatchRequest) returns (stream MatchEvent);

  // List the fixes and refactors the compiler can offer at one address.
  rpc Actions(ActionsRequest) returns (ActionsResponse);

  // Work out what one of those actions would actually change. Separate from
  // `Actions` because computing an action's edits costs about as much as
  // performing it, and only one of the actions offered gets picked.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

// The adapter's first and only self-description.
message Capabilities {
  option (section) = "Capabilities";
  // The contract version this adapter implements. A mismatch is a hard startup
  // failure rather than a negotiation.
  uint32 protocol_version = 1;
  // The language this adapter answers for, as every `LanguageId` in the model
  // will spell it. One workspace runs one adapter per language, so this is also
  // what makes two adapters distinct.
  string language = 2;
  // The adapter build, as it names itself.
  string implementation = 3;
  // The compiler behind it, as it names itself.
  string compiler = 4;
  // Which files this adapter owns, and which it merely reads.
  repeated SourceClaim claims = 5;
  // Files that configure the compiler without being source themselves —
  // `Cargo.toml`, `tsconfig.json`. Several adapters may claim the same one.
  repeated AuxiliaryClaim auxiliary_claims = 6;
  // Languages this adapter will consume produced files for, rather than files
  // read from disk.
  repeated VirtualClaim virtual_claims = 7;
  // Which paths inside the workspace this adapter's compiler writes to.
  repeated WriteClaim write_claims = 8;
  // The exact kinds this adapter emits, and the portable facets each carries.
  repeated KindDescriptor kinds = 9;
  // Whether structural queries can be answered, and where not, why. Which
  // revision of the pattern grammar is not asked: `StructuralQuery.version`
  // pins it, so an adapter either parses that one or says so here.
  rift.core.v1.Coverage structural_matching = 10;
  // Whether compiler actions can be discovered, and where not, why. Absence is
  // never read as "no actions".
  rift.core.v1.Coverage action_discovery = 11;
  // Versioned extension values this adapter emits, and where each may appear.
  repeated ExtensionDescriptor extension_values = 12;
  // Constants every adapter must echo, so a mismatch fails at startup rather
  // than as a wrong answer later.
  DeterminismContract determinism = 13;
  // Bounds Rift must stay inside when driving this adapter.
  AdapterLimits limits = 14;
  // What the host has to enforce around this adapter's process.
  RuntimeRequirements runtime = 15;
}

// A deterministic claim on physical files, re-evaluated after every path or
// content change. Selectors are ORed and compare UTF-8 bytes: suffixes against
// the full path, names against the final component, shebang prefixes against
// the first line. Highest priority wins, and equal priority from two adapters
// is an error rather than a coin toss.
message SourceClaim {
  option (section) = "Capabilities";
  // The language these files are parsed as.
  string language = 1;
  // Which adapter wins where two claim the same path. Higher takes it.
  uint32 priority = 2;
  // Suffixes matched against the whole path, so `.d.ts` can be claimed apart
  // from `.ts`.
  repeated string path_suffixes = 3;
  // Whole final path components, for files whose name carries the meaning —
  // `Makefile`, `Dockerfile`.
  repeated string path_names = 4;
  // First-line prefixes for extensionless scripts: `#!/usr/bin/env python`.
  repeated string shebang_prefixes = 5;
  // Whether a claimed file may hold other languages inside it. A `.svelte` file
  // is a container; a `.rs` file is not.
  bool container = 6;
}

// A non-owning claim on project files needed to discover or configure compiler
// semantics. Same bytewise rules as SourceClaim, may overlap across adapters,
// and never makes a file a source unit.
message AuxiliaryClaim {
  option (section) = "Capabilities";

  // What an auxiliary file is to the compiler that reads it. This is what the
  // file means, and it is what Rift acts on: a workspace manifest changing can
  // add or remove whole source trees, which Rift has to rescan for. What the
  // adapter has to redo is `environment_defining`.
  enum Purpose {
    // The adapter did not say. Treated as the widest purpose, so a change to
    // the file invalidates everything derived from it.
    UNSPECIFIED = 0;
    // Settings the compiler reads directly — `tsconfig.json`, `.rustfmt.toml`.
    COMPILER_CONFIGURATION = 1;
    // Declared dependencies, before resolution — `package.json`, `Cargo.toml`.
    DEPENDENCY_MANIFEST = 2;
    // Resolved dependency versions — `Cargo.lock`, `bun.lock`. Editing one can
    // change every type the compiler resolves.
    DEPENDENCY_LOCK = 3;
    // Which packages make up the project — a Cargo workspace, an npm workspace.
    // A change here can add or remove whole source trees.
    WORKSPACE_MANIFEST = 4;
    // Metadata a build step wrote for the compiler to read back.
    GENERATED_METADATA = 5;
    // Something the compiler needs that none of the above describes. Say what
    // in the claim rather than stretching one of the named purposes.
    OTHER = 6;
  }

  // What the file is to the compiler, and so what Rift itself has to redo when
  // it changes.
  repeated Purpose purposes = 1;
  // Suffixes matched against the whole path.
  repeated string path_suffixes = 2;
  // Whole final path components — `Cargo.toml`, `package.json`.
  repeated string path_names = 3;
  // Whether a Refresh touching this file forces the adapter to rebuild what it
  // resolved rather than update it incrementally. Declared and never inferred
  // from purpose or path, because whether a compiler rereads a given file is a
  // fact only the adapter driving it has.
  bool environment_defining = 4;
}

// A claim to consume semantic facts for virtual sources of one language. The
// producer keeps authority over the virtual bytes, regions and source maps.
message VirtualClaim {
  option (section) = "Capabilities";
  // The language of the produced files this adapter will consume.
  string language = 1;
  // Which consumer wins where two claim the same produced language.
  uint32 priority = 2;
}

// Paths inside the workspace that this adapter's compiler writes to, and that
// Rift must therefore stop reading as source. Nothing under a write claim is
// ever analyzed, diffed against the snapshot, or reported to an agent.
//
// Most build output can be pushed out of the tree instead — CARGO_TARGET_DIR,
// GOCACHE, PYTHONPYCACHEPREFIX, tsBuildInfoFile all point somewhere else, and
// an adapter should aim them at `state_root`. Declare what is left: `cargo`
// rewrites Cargo.lock at the workspace root, npm insists on `node_modules` next
// to the package it belongs to.
//
// Selectors follow SourceClaim's bytewise rules. A directory name matches the
// directory and everything beneath it.
message WriteClaim {
  option (section) = "Capabilities";
  // Whole final path components. A directory named here takes its whole tree
  // with it — `node_modules`, `target`.
  repeated string path_names = 1;
  // Suffixes matched against the whole path, for generated files scattered
  // through the tree rather than gathered under one directory.
  repeated string path_suffixes = 2;
  // Why the compiler needs it, in one line. Rift logs this when a claim shadows
  // a file the repository actually tracks, which is nearly always a mistake.
  string reason = 3;
}

// One kind this adapter emits, and the portable facets it carries. Which facet
// vocabulary applies depends on what the kind describes — a symbol, a leaf or
// a relationship — so the branch that is set is what says which.
message KindDescriptor {
  option (section) = "Capabilities";
  // The kind as the language names it: `rust.trait`, `typescript.interface`.
  string kind = 1;
  oneof facets {
    // Facets carried by symbols of this kind.
    SymbolFacets symbol = 2;
    // Facets carried by leaves of this kind.
    LeafFacets leaf = 3;
    // Facets carried by relationships of this kind.
    RelationshipFacets relationship = 4;
  }
}

message SymbolFacets { option (section) = "Capabilities"; repeated rift.core.v1.SymbolFacet values = 1; }
message LeafFacets { option (section) = "Capabilities"; repeated rift.core.v1.LeafFacet values = 1; }
message RelationshipFacets { option (section) = "Capabilities"; repeated rift.core.v1.RelationshipFacet values = 1; }

// One versioned extension value, and every place it may appear. Rift validates
// each occurrence against the schema.
message ExtensionDescriptor {
  option (section) = "Capabilities";
  // Reverse-domain namespaced key.
  string key = 1;
  // Bumped whenever the schema changes shape, so a consumer that knows version
  // 1 can skip a version 2 value rather than misread it.
  uint32 version = 2;
  // Which model types this value may be attached to — `Symbol`, `Leaf`.
  repeated string targets = 3;
  // A self-contained JSON Schema draft 2020-12 document. Remote references are
  // forbidden, so validation fetches nothing.
  string schema = 4;
  // Whether Rift builds a search index over this value. Indexing costs storage
  // per fact, so it is asked for rather than assumed.
  bool indexed = 5;
  // Whether this value contributes to semantic cache identity.
  bool semantic = 6;
}

// Constants every adapter must echo, so that two adapters producing the same
// fact produce the same bytes. Paths are project-relative UTF-8 with '/'
// separators and no normalization; path sets sort by UTF-8 bytes, other
// unique-item sets by RFC 8785 bytes. Both inputs to `owner_id` appear in
// Describe, so Rift recomputes it and refuses a mismatch before any fact is
// minted.
message DeterminismContract {
  option (section) = "Capabilities";
  // "RFC8785"
  string canonical_json = 1;
  // "UTF-8"
  string source_encoding = 2;
  // "UTF-8-bytes"
  string offsets = 3;
  // "UTF-8-bytewise"
  string path_order = 4;
  // "RFC8785-bytewise"
  string set_order = 5;
  // "none"
  string unicode_normalization = 6;
  // language '.' sha256(u32le(len(implementation)) implementation
  // u32le(len(compiler)) compiler)[0:16]
  string owner_id = 7;
}

// Bounds this adapter advertises. One adapter holds several workspaces over one
// connection, so in-flight work is bounded per workspace rather than per
// process.
message AdapterLimits {
  option (section) = "Capabilities";
  // Largest single message this adapter will accept or send. A fact batch is
  // split to stay under it.
  uint64 max_message_bytes = 1;
  // Concurrent calls accepted across the whole connection.
  uint32 max_in_flight = 2;
  // Concurrent calls accepted for any one workspace, so one agent cannot
  // consume the process.
  uint32 max_in_flight_per_workspace = 3;
  // Workspaces this adapter will hold open at once. Each one is a parsed tree
  // and a compiler's state, so this is the number that decides its memory.
  uint32 max_workspaces = 4;
}

// What the host must enforce for this adapter to run on untrusted source.
message RuntimeRequirements {
  option (section) = "Capabilities";
  // Whether the adapter executes code from the repository — a build script, a
  // plugin, a macro.
  bool executes_repository_code = 1;
  // Whether the adapter spawns subprocesses.
  bool spawns_subprocesses = 2;
  // "denied"
  string network = 3;
  // "workspace_and_declared_dependencies"
  string filesystem = 4;
  // "state_root_and_write_claims"
  string writes = 5;
}

// What a workspace holds right now. Every call that reads code carries one, and
// a call naming a state the workspace has moved past is refused rather than
// answered against different content.
message WorkspaceState {
  option (section) = "Workspaces";
  // Which workspace this describes, by the absolute path of its working tree.
  // That path is the workspace: one tree, one workspace, and Rift never reuses
  // a path once CloseWorkspace has taken it. A minted handle beside it would be
  // a second name for a thing that already resolves to something.
  string workspace = 1;
  // The state the files in it hold.
  rift.core.v1.Snapshot snapshot = 2;
}

// Take this working tree and start a compiler against it. Rift has already
// written every file, so nothing here has to be fetched or waited for.
message OpenWorkspaceRequest {
  option (section) = "Workspaces";
  // Absolute path to the worktree, and the identity both sides use for it from
  // now on. Read-only as far as this adapter is concerned: what it needs to
  // write goes to `state_root` or is declared as a WriteClaim.
  string workspace = 1;
  // Absolute path to a directory the adapter owns and Rift never reads. Build
  // output belongs here — point CARGO_TARGET_DIR and friends at it. It outlives
  // any one workspace, which is what lets a second compile be warm.
  //
  // Two workspaces of the same adapter get the same path today. Whether that
  // holds when their compilers lock the directory against each other is not yet
  // settled.
  string state_root = 2;
  // The state that tree holds.
  rift.core.v1.Snapshot snapshot = 3;
}

// Rift rewrote the tree in place. Paths are project-relative and cover every
// file it touched, so the adapter reparses exactly this set. Content already
// sits on disk by the time this call arrives.
message RefreshRequest {
  option (section) = "Workspaces";
  // The state the adapter last acknowledged. A mismatch means Rift and the
  // adapter disagree about what is on disk, and comes back as StaleState.
  WorkspaceState from = 1;
  // The state the tree holds now.
  rift.core.v1.Snapshot to = 2;
  // Files created or overwritten since `from`, as `rift://file/<path>`.
  repeated string written = 3;
  // Files deleted since `from`. A rename arrives as one of each.
  repeated string removed = 4;
}

// Let go of this workspace. Rift deletes the tree once the adapter has.
message CloseWorkspaceRequest { option (section) = "Workspaces"; string workspace = 1; }

// Read everything in this workspace. The state is what the answer is pinned to.
message AnalyzeRequest { option (section) = "Analysis"; WorkspaceState state = 1; }

// One event of an analyze stream, followed eventually by exactly one summary.
message AnalyzeEvent {
  option (section) = "Analysis";
  oneof event {
    // A file read from disk is about to have facts.
    SourceUnit source_unit = 1;
    // A file this adapter produced is about to have text and facts.
    VirtualUnit virtual_unit = 2;
    // A chunk of a produced file's bytes.
    VirtualText virtual_text = 3;
    // A batch of facts for one file.
    Facts facts = 4;
    // No more facts for one file.
    UnitCoverage coverage = 5;
    // No more events at all.
    AnalyzeSummary summary = 6;
  }
}

// Metadata for one file on disk that this adapter owns.
message SourceUnit {
  option (section) = "Analysis";
  // The file, as `rift://file/<path>`. The same spelling `SourceSpan.unit`
  // uses, so a fact and the unit it was read from compare without translation.
  string unit = 1;
  // Which bytes each language owns. One entry for a file in a single language,
  // several where one embeds another.
  repeated rift.core.v1.LanguageRegion regions = 2;
}

// Metadata for a file this adapter produced from another one. Rift writes the
// bytes into the consuming adapter's workspace, so that adapter sees an
// ordinary file and needs to know nothing about where it came from.
message VirtualUnit {
  option (section) = "Analysis";
  // The produced file, as `rift://file/<path>`. The adapter mints the path; it
  // is addressed like any other file, because everything downstream reads it
  // like any other file.
  string unit = 1;
  // The language that will consume these bytes, selected by a VirtualClaim.
  string language = 2;
  // Which bytes each language owns inside the produced file.
  repeated rift.core.v1.LanguageRegion regions = 3;
}

// One chunk of a produced file's bytes. Sent in pieces because a generated file
// can be far larger than the source it came from, and a message has a bound.
message VirtualText {
  option (section) = "Analysis";
  // The produced file these bytes belong to, spelled as its VirtualUnit did.
  string unit = 1;
  // Byte offset this chunk starts at. Chunks arrive in order and leave no gaps.
  uint64 offset = 2;
  // The bytes themselves.
  string text = 3;
  // Whether this is the last chunk. Rift holds the file until it arrives.
  bool final = 4;
}

// One file's worth of one fact family. Rift buffers by file until the coverage
// event for that file, then routes complete virtual units to their consumer.
message Facts {
  option (section) = "Analysis";
  // The file these facts were read from, as `rift://file/<path>`.
  string unit = 1;
  oneof family {
    SourceMaps source_maps = 2;
    Symbols symbols = 3;
    Leaves leaves = 4;
    Relationships relationships = 5;
    Diagnostics diagnostics = 6;
  }
}

message SourceMaps { option (section) = "Analysis"; repeated rift.core.v1.SourceMapEntry items = 1; }
message Symbols { option (section) = "Analysis"; repeated rift.core.v1.Symbol items = 1; }
message Leaves { option (section) = "Analysis"; repeated rift.core.v1.Leaf items = 1; }
message Relationships { option (section) = "Analysis"; repeated rift.core.v1.Relationship items = 1; }
message Diagnostics { option (section) = "Analysis"; repeated rift.core.v1.Diagnostic items = 1; }

// Closes one file's facts. `present=false` clears everything buffered for it.
message UnitCoverage {
  option (section) = "Analysis";
  // The file being closed, as `rift://file/<path>`.
  string unit = 1;
  // Whether the file exists and was read at all. False retracts it.
  bool present = 2;
  // How complete each fact family is for this file. All six are stated: a
  // family the adapter cannot produce is `unsupported` and one the language has
  // no concept of is `not_applicable`, so there is no silence to interpret.
  rift.core.v1.SemanticCoverage coverage = 3;
}

// Analyze is rerun-equal: the same snapshot under the same environment yields
// the same facts, and the digest is over their canonical bytes so Rift can say
// so rather than assume it.
message AnalyzeSummary {
  option (section) = "Analysis";
  // The state every fact in this stream was read against.
  WorkspaceState state = 1;
  // SHA-256 over the RFC 8785 canonical JSON of every fact sent in this stream,
  // sorted by `DeterminismContract.set_order`. Two runs that agree produce the
  // same value, so Rift can skip reindexing — which only holds if the recipe is
  // fixed here rather than left to each adapter.
  string digest = 2;
  // Files whose previously published facts no longer hold, as
  // `rift://file/<path>`. This reaches files the stream said nothing about,
  // which is what a per-file `UnitCoverage` cannot do.
  repeated string invalidated = 3;
}

// Find every place matching one pattern, parsed by the language rather than
// read as text.
message MatchRequest {
  option (section) = "Matching";
  // The state to search, and what the answer is pinned to.
  WorkspaceState state = 1;
  // The pattern, and the constraints on what its captures may be.
  rift.core.v1.StructuralQuery query = 2;
}

// One event of a match stream, followed eventually by exactly one summary.
message MatchEvent {
  option (section) = "Matching";
  oneof event {
    // A batch of matches.
    Matches matches = 1;
    // No more matches.
    MatchSummary summary = 2;
  }
}

message Matches { option (section) = "Matching"; repeated StructuralMatch items = 1; }

// One match, as the adapter found it. It carries no identity of its own: a
// `MatchKey` is the snapshot, the query and the span, and Rift already holds
// the first two, so the span below completes it.
message StructuralMatch {
  option (section) = "Matching";
  // The file and byte range the pattern matched.
  rift.core.v1.SourceSpan span = 1;
  // The ranges around the matched node that are safe to replace.
  rift.core.v1.StructuralMatchRanges replacement_ranges = 2;
  // What each named part of the pattern bound to.
  repeated rift.core.v1.StructuralCapture captures = 3;
  // Why this is a match, one step per line.
  repeated string explanation = 4;
}

// Closes a match stream.
message MatchSummary {
  option (section) = "Matching";
  // The state every match was found against.
  WorkspaceState state = 1;
  // SHA-256 over the RFC 8785 canonical JSON of every match sent in this stream,
  // sorted by `DeterminismContract.set_order`, so a rerun that agrees can be
  // recognised without comparing the matches themselves.
  string digest = 2;
  // How much of the workspace the pattern actually reached.
  rift.core.v1.Coverage coverage = 3;
}

// What can the compiler offer here? Answered from what it already knows, so
// nothing is computed that the caller may not pick.
message ActionsRequest {
  option (section) = "Actions";
  // The state to ask against. The answer is only valid against it.
  WorkspaceState state = 1;
  // Where in the code to ask: a symbol, a leaf, a byte range, or a match.
  rift.core.v1.Address target = 2;
  // Hierarchical kind prefixes. Empty requests every action.
  repeated string only = 3;
}

// The actions on offer at one address.
message ActionsResponse {
  option (section) = "Actions";
  // The state they were discovered against.
  WorkspaceState state = 1;
  // What the compiler can do here, each with the token that resolves it.
  repeated CodeAction actions = 2;
  // Whether this is every action, and where not, why.
  rift.core.v1.Coverage coverage = 3;
}

// An adapter action token and its portable descriptor. The token is opaque and
// valid only against the state it was discovered in.
message CodeAction {
  option (section) = "Actions";
  // The adapter's own handle on this action. Rift passes it back unread.
  string token = 1;
  // What the action is, in terms the model shares with MCP.
  rift.core.v1.CodeActionDescriptor descriptor = 2;
}

// Compute what one action would change.
message ResolveRequest {
  option (section) = "Actions";
  // The state the token was discovered in. A token resolved against anything
  // else comes back as StaleState, because the offsets it computed no longer
  // point where they did.
  WorkspaceState state = 1;
  // The token from the `CodeAction` being resolved.
  string token = 2;
  // Arguments, as RFC 8785 canonical JSON, validated against the descriptor's
  // arguments_schema before the call.
  string arguments = 3;
}

// What the action changes. Rift applies these to the worktree; the adapter's
// own tree is untouched and will next hear about the change through Refresh.
message ResolveResponse {
  option (section) = "Actions";
  // The state the edits were computed against, and the only state their offsets
  // are correct for.
  WorkspaceState state = 1;
  // The change itself, as byte ranges and their replacements.
  repeated rift.core.v1.Edit edits = 2;
  // Whether the edits are the whole change. Partial means the compiler could
  // only rewrite part of what the action names — a rename it cannot follow into
  // a macro, say — and the diagnostics say where it stopped.
  rift.core.v1.Coverage coverage = 3;
  // What the compiler wants the caller to know before applying this.
  repeated rift.core.v1.Diagnostic diagnostics = 4;
}

// Carried in `google.rpc.Status.details` when an adapter declines work it
// understood: the target is ambiguous, an action went stale, the language
// forbids it. Everything else is an ordinary status code.
message Refusal {
  option (section) = "Failure";

  // Why the adapter declined. The value is what a caller acts on: some of these
  // are worth retrying after a Refresh, and the rest never are.
  enum Reason {
    // The adapter did not classify it. Treated as permanent.
    UNSPECIFIED = 0;
    // The operation has no implementation for this language. Retrying is futile.
    UNSUPPORTED = 1;
    // The code has to change first — a file must compile before this can run.
    UNMET_PRECONDITION = 2;
    // The address names more than one thing, and picking is not the adapter's
    // call. Narrow it and ask again.
    AMBIGUOUS_TARGET = 3;
    // The action was discovered against a state the workspace has left.
    // Rediscover it and resolve the new token.
    STALE_ACTION = 4;
    // The match was found against a state the workspace has left. Search again.
    STALE_MATCH = 5;
    // Doing it would reach further than the caller can have meant — outside the
    // workspace, or into generated code nothing regenerates.
    UNSAFE_EFFECT = 6;
    // The language itself forbids it: a rename to a reserved word, a visibility
    // change its rules do not allow.
    LANGUAGE_REFUSAL = 7;
  }

  // Which class of refusal this is, so a caller can decide without parsing
  // `message`.
  Reason reason = 1;
  // One line for a human, saying what specifically was wrong.
  string message = 2;
  // What in the code stopped it.
  repeated Blocker blockers = 3;
  // What the compiler reported while trying.
  repeated rift.core.v1.Diagnostic diagnostics = 4;
}

// What stopped the operation.
message Blocker {
  option (section) = "Failure";
  oneof value {
    // rift://symbol/...
    string symbol = 1;
    // The place in the code that stopped it.
    rift.core.v1.SourceSpan span = 2;
    // The edge that stopped it — a caller a rename cannot reach.
    rift.core.v1.Relationship relationship = 3;
  }
}

// Carried in `google.rpc.Status.details` when a pinned call names a state the
// workspace has moved past, so the caller can resync rather than guess.
message StaleState { option (section) = "Failure"; WorkspaceState actual = 1; }
