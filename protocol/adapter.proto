// The Rift server to language adapter seam.
//
// gRPC over a Unix domain socket. One Rift server starts and owns its adapters,
// one per language, and no other server shares them — so a mirror has exactly
// one party opening, filling and releasing it, and the adapter arbitrates
// nothing. One adapter still serves many mirrors at once, because many agents
// work against one workspace.
//
// This seam is protobuf; the MCP surface is JSON Schema. The model both carry —
// Symbol, Leaf, File, Snapshot — is defined once in core.json and generated
// into core.proto, so neither side owns it and neither can drift from it.
//
// What gRPC already does, this file does not repeat. There is no envelope, no
// request id, no operation name, no sequence number and no cancel operation:
// an RPC method is the operation, a stream is ordered, and a deadline or a
// cancelled context ends the call. Failures are `google.rpc.Status`, with the
// details below carried in `status.details`.

syntax = "proto3";

package rift.adapter.v1;

import "core.proto";
import "google/protobuf/empty.proto";

service Adapter {
  // What this adapter can do. Called once, before anything else. Rift holds the
  // adapter to exactly what it claims here and never probes or feature-tests.
  rpc Hello(google.protobuf.Empty) returns (Capabilities);

  // Give me somewhere to put the code. An adapter cannot read the repository,
  // so Rift opens a mirror and sends content into it.
  rpc OpenMirror(OpenMirrorRequest) returns (OpenMirrorResponse);

  // Throw a mirror away. Nothing is reclaimed implicitly, so this has to be
  // said. Refused while the mirror has live children or in-flight requests: an
  // analyze stream against a mirror that just stopped being newest is still a
  // valid pinned read, and killing it turns a correct answer into a failure.
  rpc ReleaseMirror(ReleaseMirrorRequest) returns (google.protobuf.Empty);

  // A change was published, so the child that held it becomes a base in its own
  // right. Without this, publishing from a child leaves the next edit to open a
  // fresh mirror and full-sync it, making every sequential edit a cold start.
  rpc PromoteMirror(PromoteMirrorRequest) returns (MirrorState);

  // Send content into a mirror. The stream is the transaction: it opens on the
  // first message, and either the client half-closes and the adapter commits,
  // or the call is cancelled and nothing is kept. Only one may be open per
  // mirror. Ordering is the stream's, so no sequence numbers appear here.
  rpc Sync(stream SyncChunk) returns (SyncResult);

  // Read the code and say what is in it: symbols, where they appear, how they
  // connect, and what the compiler complains about. Facts stream per file and
  // the summary closes it.
  rpc Analyze(AnalyzeRequest) returns (stream AnalyzeEvent);

  // Find code by shape rather than by text — a call with two arguments, a class
  // implementing an interface. The pattern is parsed by the language.
  rpc Match(MatchRequest) returns (stream MatchEvent);

  // List the fixes and refactors the compiler can offer at one address.
  rpc Actions(ActionsRequest) returns (ActionsResponse);
}

// ── capabilities ──────────────────────────────────────────────────────────────

// The adapter's first and only self-description.
message Capabilities {
  // The contract version this adapter implements. A mismatch is a hard startup
  // failure rather than a negotiation.
  uint32 protocol_version = 1;
  string language = 2;
  // The adapter build, as it names itself.
  string implementation = 3;
  // The compiler behind it, as it names itself.
  string compiler = 4;
  // Which files this adapter owns, and which it merely reads.
  repeated SourceClaim claims = 5;
  repeated AuxiliaryClaim auxiliary_claims = 6;
  repeated VirtualClaim virtual_claims = 7;
  // The exact kinds this adapter emits, and the portable facets each carries.
  repeated KindDescriptor kinds = 8;
  // Whether this adapter can parse the Rift pattern grammar. It declares
  // nothing about transforms: those read from captures Rift already holds.
  StructuralMatching structural_matching = 9;
  // Whether compiler actions can be discovered, and where not, why. Absence is
  // never read as "no actions".
  rift.core.v1.Coverage action_discovery = 10;
  // Versioned extension values this adapter emits, and where each may appear.
  repeated ExtensionDescriptor extension_values = 11;
  // Constants every adapter must echo, so a mismatch fails at startup rather
  // than as a wrong answer later.
  DeterminismContract determinism = 12;
  Limits limits = 13;
  RuntimeRequirements runtime = 14;
}

// A deterministic claim on physical files, re-evaluated after every path or
// content change. Selectors are ORed and compare UTF-8 bytes: suffixes against
// the full path, names against the final component, shebang prefixes against
// the first line. Highest priority wins; equal priority from two adapters is an
// error. A container claim may expose embedded languages and virtual units.
message SourceClaim {
  string language = 1;
  uint32 priority = 2;
  repeated string path_suffixes = 3;
  repeated string path_names = 4;
  repeated string shebang_prefixes = 5;
  bool container = 6;
}

// A non-owning claim on project files needed to discover or configure compiler
// semantics. Same bytewise rules as SourceClaim, may overlap across adapters,
// and never makes a file a source unit.
message AuxiliaryClaim {
  repeated AuxiliaryPurpose purposes = 1;
  repeated string path_suffixes = 2;
  repeated string path_names = 3;
  // Whether editing a matched file changes this adapter's environment. Declared
  // by the adapter and never inferred from purpose or path, because only the
  // adapter knows whether its compiler rereads a given file. True forces a
  // fresh base rather than a child mirror.
  bool environment_defining = 4;
}

enum AuxiliaryPurpose {
  AUXILIARY_PURPOSE_UNSPECIFIED = 0;
  AUXILIARY_PURPOSE_COMPILER_CONFIGURATION = 1;
  AUXILIARY_PURPOSE_DEPENDENCY_MANIFEST = 2;
  AUXILIARY_PURPOSE_DEPENDENCY_LOCK = 3;
  AUXILIARY_PURPOSE_WORKSPACE_MANIFEST = 4;
  AUXILIARY_PURPOSE_GENERATED_METADATA = 5;
  AUXILIARY_PURPOSE_OTHER = 6;
}

// A claim to consume semantic facts for virtual sources of one language. The
// producer keeps authority over the virtual bytes, regions and source maps.
message VirtualClaim {
  string language = 1;
  uint32 priority = 2;
}

// One kind this adapter emits, and the portable facets it carries. The entity
// decides which facet vocabulary applies.
message KindDescriptor {
  string kind = 1;
  oneof facets {
    SymbolFacets symbol = 2;
    LeafFacets leaf = 3;
    RelationshipFacets relationship = 4;
  }
}

message SymbolFacets { repeated rift.core.v1.SymbolFacet values = 1; }
message LeafFacets { repeated rift.core.v1.LeafFacet values = 1; }
message RelationshipFacets { repeated rift.core.v1.RelationshipFacet values = 1; }

message StructuralMatching {
  oneof variant {
    // Rift pattern v1, over every language this adapter claims.
    uint32 pattern_version = 1;
    // Cannot parse the pattern grammar, and why.
    string unsupported = 2;
    // The grammar has no meaning for this language, and why.
    string not_applicable = 3;
  }
}

// One versioned extension value, and every place it may appear. Rift validates
// each occurrence against the schema.
message ExtensionDescriptor {
  // Reverse-domain namespaced key.
  string key = 1;
  uint32 version = 2;
  repeated string targets = 3;
  // A self-contained JSON Schema draft 2020-12 document. Remote references are
  // forbidden, so validation fetches nothing.
  string schema = 4;
  bool indexed = 5;
  // Whether this value contributes to semantic cache identity.
  bool semantic = 6;
}

// Constants every adapter must echo. Paths are project-relative UTF-8 with '/'
// separators, no empty, '.' or '..' segment, and no normalization. Path sets
// sort by UTF-8 bytes; other unique-item sets sort by RFC 8785 bytes; the rest
// keep semantic order. Both inputs to owner_id appear in Hello, so Rift
// recomputes it and refuses a mismatch before any fact is minted.
message DeterminismContract {
  // "RFC8785"
  string canonical_json = 1;
  // "UTF-8"
  string source_encoding = 2;
  // "UTF-8-bytes"
  string offsets = 3;
  // "UTF-8-bytewise"
  string path_order = 4;
  // "RFC8785-bytewise"
  string set_order = 5;
  // "none"
  string unicode_normalization = 6;
  // language '.' sha256(u32le(len(implementation)) implementation
  // u32le(len(compiler)) compiler)[0:16]
  string owner_id = 7;
}

// Bounds this adapter advertises. One adapter serves many mirrors over one
// connection, so in-flight work is bounded per mirror rather than per process.
message Limits {
  uint64 max_message_bytes = 1;
  uint32 max_in_flight = 2;
  // Concurrent calls accepted for any one mirror, so one agent cannot consume
  // the process.
  uint32 max_in_flight_per_mirror = 3;
  // Concurrent bases held for candidates that change the environment. Such a
  // candidate cannot be a child of the accepted base and takes a base of its
  // own, which is the one legitimate route to N times base memory.
  uint32 max_provisional_bases = 4;
}

// What the host must enforce for this adapter to run on untrusted source.
message RuntimeRequirements {
  // Whether the adapter executes code from the repository — a build script, a
  // plugin, a macro.
  bool executes_repository_code = 1;
  // Whether the adapter spawns subprocesses.
  bool spawns_subprocesses = 2;
  // "denied"
  string network = 3;
  // "mirror_and_declared_dependencies"
  string filesystem = 4;
  // "private_temp_only"
  string writes = 5;
}

// ── mirrors ───────────────────────────────────────────────────────────────────

// One mirror inside this adapter process. A base is immutable and shared; each
// same-environment candidate opens a child whose content map is complete in
// structure and delta in content, so every unchanged entry is a shared
// reference and parsed-source memory is one base plus the deltas rather than
// one base per agent. Per-mirror compiler state is not shared.
message MirrorId { string value = 1; }

// Which adapter state a pinned call expects. A call carrying a snapshot the
// mirror has moved past is refused rather than answered against the wrong
// content. This exists only after a Sync commits, because the environment is
// derived from synced content rather than known in advance.
message MirrorState {
  MirrorId mirror = 1;
  // The state this mirror holds.
  rift.core.v1.Snapshot snapshot = 2;
  // Digest of the environment that content produced: compiler build, its
  // configuration, and the resolved dependencies.
  string environment = 3;
}

message OpenMirrorRequest {
  oneof base {
    // Start empty, pinned to this state. Rift then fills it with one full Sync,
    // which is the only way a cold mirror can materialize.
    rift.core.v1.Snapshot snapshot = 1;
    // Start as a depth-one child sharing that mirror's committed content. Rift
    // sends only what differs. A child may not itself be a base.
    MirrorId mirror = 2;
  }
}

// A freshly opened, still-empty mirror. It has no environment yet: one is
// derived from the configuration and dependency material in the synced content,
// so Sync is where the adapter first publishes it.
message OpenMirrorResponse { MirrorId mirror = 1; }

message ReleaseMirrorRequest { MirrorId mirror = 1; }

// Re-root a child as a base of its own. Pinned to the state the caller expects,
// because a child advances and re-rooting one that moved on would label the
// wrong content. The mirror must be committed-idle: no Sync in flight.
message PromoteMirrorRequest { MirrorState state = 1; }

// ── sync ──────────────────────────────────────────────────────────────────────

// One message of a Sync stream. The first carries `open`; the rest carry
// content. Half-closing the stream commits; cancelling discards.
message SyncChunk {
  oneof chunk {
    SyncOpen open = 1;
    SyncUnit unit = 2;
    SyncMap map = 3;
    SyncRemove remove = 4;
  }
}

message SyncOpen {
  MirrorId mirror = 1;
  // Return the mirror to its base before applying anything.
  bool reset = 2;
}

// One contiguous UTF-8 chunk of one file's text. Chunks for a file are
// contiguous by offset and exactly one has `final`. A source file carries the
// language whose adapter owns it; an auxiliary file is a project input mirrored
// read-only — a manifest, a compiler config — that no adapter owns.
message SyncUnit {
  // rift://file/<path>
  string unit = 1;
  bool auxiliary = 2;
  // Set for a source file; empty for an auxiliary one.
  string language = 3;
  uint64 offset = 4;
  string text = 5;
  bool final = 6;
}

// One file was generated from another, so a position in the generated code can
// be traced back to the line that was actually written.
message SyncMap {
  string unit = 1;
  repeated rift.core.v1.SourceMapEntry items = 2;
}

message SyncRemove { string unit = 1; }

// The committed mirror state, and the environment the content produced.
message SyncResult {
  MirrorState state = 1;
  uint64 source_units = 2;
  uint64 auxiliary_units = 3;
}

// ── analyze ───────────────────────────────────────────────────────────────────

// The pinned mirror, plus the files that changed since the snapshot it holds.
message AnalyzeRequest {
  MirrorState state = 1;
  repeated string changed_inputs = 2;
}

// One event of an analyze stream, followed eventually by exactly one summary.
message AnalyzeEvent {
  oneof event {
    SourceUnit source_unit = 1;
    VirtualUnit virtual_unit = 2;
    VirtualText virtual_text = 3;
    Facts facts = 4;
    UnitCoverage coverage = 5;
    AnalyzeSummary summary = 6;
  }
}

// One language-owned region inside a source file. A file can hold several:
// script inside a template, a query string inside a host language.
message LanguageRegion {
  string language = 1;
  rift.core.v1.TextRange range = 2;
}

// Metadata for one physical file this adapter owns.
message SourceUnit {
  string unit = 1;
  repeated LanguageRegion regions = 2;
}

// Manifest for a file this adapter produced from another. Its text and source
// map follow in their own events before the summary.
message VirtualUnit {
  string unit = 1;
  // The language that will consume these bytes, selected by a VirtualClaim.
  string language = 2;
  repeated LanguageRegion regions = 3;
}

message VirtualText {
  string unit = 1;
  uint64 offset = 2;
  string text = 3;
  bool final = 4;
}

// One file's worth of one fact family. Rift buffers by file until the coverage
// event for that file, then routes complete virtual units to their consumer.
message Facts {
  string unit = 1;
  oneof family {
    SourceMaps source_maps = 2;
    Symbols symbols = 3;
    Leaves leaves = 4;
    Relationships relationships = 5;
    Diagnostics diagnostics = 6;
  }
}

message SourceMaps { repeated rift.core.v1.SourceMapEntry items = 1; }
message Symbols { repeated rift.core.v1.Symbol items = 1; }
message Leaves { repeated rift.core.v1.Leaf items = 1; }
message Relationships { repeated rift.core.v1.Relationship items = 1; }
message Diagnostics { repeated rift.core.v1.Diagnostic items = 1; }

// Closes one file's facts. `present=false` clears everything buffered for it.
message UnitCoverage {
  string unit = 1;
  bool present = 2;
  map<string, rift.core.v1.Coverage> coverage = 3;
}

// Analyze is rerun-equal: the same snapshot under the same environment yields
// the same facts, and the digest is over their canonical bytes so Rift can say
// so rather than assume it.
message AnalyzeSummary {
  MirrorState state = 1;
  string digest = 2;
  // Files whose previously published facts no longer hold.
  repeated string invalidated = 3;
}

// ── match ─────────────────────────────────────────────────────────────────────

message MatchRequest {
  MirrorState state = 1;
  rift.core.v1.StructuralQuery query = 2;
}

message MatchEvent {
  oneof event {
    Matches matches = 1;
    MatchSummary summary = 2;
  }
}

message Matches { repeated StructuralMatch items = 1; }

// One match, as the adapter found it. Rift mints the public identity; the
// adapter's key only has to be stable within this stream.
message StructuralMatch {
  string key = 1;
  rift.core.v1.SourceSpan span = 2;
  // The ranges around the matched node that are safe to replace.
  rift.core.v1.StructuralMatchRanges replacement_ranges = 3;
  repeated rift.core.v1.StructuralCapture captures = 4;
  // Why this is a match, one step per line.
  repeated string explanation = 5;
}

message MatchSummary {
  MirrorState state = 1;
  string digest = 2;
  rift.core.v1.Coverage coverage = 3;
}

// ── actions ───────────────────────────────────────────────────────────────────

message ActionsRequest {
  MirrorState state = 1;
  rift.core.v1.Address target = 2;
  // Hierarchical kind prefixes. Empty requests every action.
  repeated string only = 3;
}

message ActionsResponse {
  MirrorState state = 1;
  repeated CodeAction actions = 2;
  rift.core.v1.Coverage coverage = 3;
}

// An adapter action token and its portable descriptor. The token is opaque and
// valid only against the state it was discovered in.
message CodeAction {
  string token = 1;
  rift.core.v1.CodeActionDescriptor descriptor = 2;
}

// ── failure ───────────────────────────────────────────────────────────────────

// Carried in `google.rpc.Status.details` when an adapter declines work it
// understood: the target is ambiguous, an action went stale, the language
// forbids it. Everything else is an ordinary status code.
message Refusal {
  RefusalReason reason = 1;
  string message = 2;
  repeated Blocker blockers = 3;
  repeated rift.core.v1.Diagnostic diagnostics = 4;
}

enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  REFUSAL_REASON_UNSUPPORTED = 1;
  REFUSAL_REASON_UNMET_PRECONDITION = 2;
  REFUSAL_REASON_AMBIGUOUS_TARGET = 3;
  REFUSAL_REASON_STALE_ACTION = 4;
  REFUSAL_REASON_STALE_MATCH = 5;
  REFUSAL_REASON_UNSAFE_EFFECT = 6;
  REFUSAL_REASON_LANGUAGE_REFUSAL = 7;
}

// What stopped the operation.
message Blocker {
  oneof value {
    // rift://symbol/...
    string symbol = 1;
    rift.core.v1.SourceSpan span = 2;
    rift.core.v1.Relationship relationship = 3;
  }
}

// Carried in `google.rpc.Status.details` when a pinned call names a state the
// mirror has moved past, so the caller can resync rather than guess.
message StaleState { MirrorState actual = 1; }
