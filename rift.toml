#:schema https://volar.sh/rift/rift.schema.json

[source]
include = []
# Agent worktrees and local tooling state hold full copies of the source tree; keep them out of
# the index even if gitignore inheritance is ever disabled. `docs/public` holds the artifacts
# `just generate` exports from the Rust models and from `rift --help`, so every hit in them
# restates something the same answer already carries; the generated plugin skill under
# `plugins/claude` restates the served tool descriptions the same way.
exclude = [".claude/**", ".agents/**", "docs/public/**", "plugins/claude/skills/**"]
# `.gitignore` keeps `.plans/` out of version control on purpose: campaign documents live
# outside the tree until they become code. They are still what a reader of this repository
# asks about, so the index reaches them here.
force_include = [".plans/**"]
respect_gitignore = true

# The name binding provider and the semantic ranking both run by default; the explicit
# tables pin that intent so a future default change cannot silently drop either capability.
[providers.binding]
enabled = true

[search.semantic]
disabled = false

# Text indexing defaults to every unclaimed visible file. The list keeps docs, scripts,
# and tooling text searchable while the lockfiles stay out: a lockfile hit restates a
# manifest entry the same answer already carries.
[search.text]
include = ["**/*.mdx", "**/*.py", "**/*.mjs", "**/*.css", "**/*.jsonc", "justfile"]

# Each process serves one exact language, so its table belongs to that language entry.
# The toolchain pin keeps rust-analyzer on the version `rust-toolchain.toml` names.
[languages.rust.lsp]
command = ["rustup", "run", "1.98", "rust-analyzer"]

[languages.toml.lsp]
command = ["tombi", "lsp"]

# The default package bounds skip the largest cataloged packages on this machine: the
# generated binding crates (`windows@0.62.2` alone holds 108mb of source), the icon and
# type packages under `docs/node_modules`, and the Rust standard library, whose `library`
# tree selects 2458 files. Each bound is set past the largest observed package so those
# packages are read rather than skipped, and `index_size` carries the sum.
[dependencies]
package_size = "128mb"
package_files = 8000
index_size = "1gb"
