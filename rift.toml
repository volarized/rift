#:schema ./protocol/rift.schema.json

[server]
idle-timeout = "10m"

[session]
base = "head"
integration = "manual"

[reads]
max-worktrees = 2
worktree-idle-timeout = "5m"

[facts]
max-size = "4GiB"

[profile]
max = "edit"

[validation]
require = "available"

[validators]
allow = []
carry = []
max-timeout = "5m"
