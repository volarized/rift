#:schema https://volar.sh/rift/rift.schema.json

[source]
include = []
# Agent worktrees and local tooling state hold full copies of the source tree; keep them out of
# the index even if gitignore inheritance is ever disabled.
exclude = [".claude/**", ".agents/**"]
respect_gitignore = true

[engines.rust]
program = "rust-analyzer"
languages = ["rust"]

[engines.toml]
program = "tombi"
arguments = ["lsp"]
languages = ["toml"]

[[hooks]]
type = "command"
id = "format"
kind = "lint"
program = "just"
arguments = ["format"]
changed_paths = "none"
working_directory = ""
environment = {}
timeout = "120s"
output_limit = "4kb"
guarantees = [
  { kind = "syntax_validated", scope = { kind = "reach", reach = "project" }, detail = "cargo fmt --all --check passes" },
]
determinism = "deterministic"

[[hooks]]
type = "command"
id = "check"
kind = "build"
program = "just"
arguments = ["check"]
changed_paths = "none"
working_directory = ""
environment = {}
timeout = "600s"
output_limit = "4kb"
guarantees = [
  { kind = "syntax_validated", scope = { kind = "reach", reach = "project" }, detail = "cargo check and the architecture gate pass" },
]
determinism = "deterministic"
