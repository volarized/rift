#:schema ./protocol/rift.schema.json

[server]
idle-timeout = "10m"

[session]
base = "head"
integration = "manual"

[reads]
max-worktrees = 2
worktree-idle-timeout = "5m"

[facts]
max-size = "4GiB"

[profile]
max = "edit"

[execution]
allow = []
debug = []
max-code = "16KiB"
max-timeout = "30s"
max-output = "8KiB"
max-concurrent = 2
max-debug-sessions = 2
debug-idle-timeout = "5m"
max-debug-frames = 64
max-debug-bindings = 32
max-debug-value = "1KiB"

[validation]
require = "available"

[validators]
allow = []
carry = []
max-timeout = "5m"
