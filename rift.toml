#:schema https://volar.sh/rift/rift.schema.json

[source]
include = []
# Agent worktrees and local tooling state hold full copies of the source tree; keep them out of
# the index even if gitignore inheritance is ever disabled. `docs/public` holds the artifacts
# `just generate` exports from the Rust models and from `rift --help`, so every hit in them
# restates something the same answer already carries.
exclude = [".claude/**", ".agents/**", "docs/public/**"]
respect_gitignore = true

[engines.rust]
program = "rust-analyzer"
languages = ["rust"]

[engines.toml]
program = "tombi"
arguments = ["lsp"]
languages = ["toml"]

[[hooks]]
type = "command"
id = "format"
kind = "format"
program = "cargo"
arguments = ["fmt", "--all"]
changed_paths = "none"
writes = "workspace"
working_directory = ""
environment = {}
timeout = "120s"
output_limit = "4kb"
failure_severity = "warning"
guarantees = []
determinism = "deterministic"

[[hooks]]
type = "command"
id = "check"
kind = "build"
program = "just"
arguments = ["check"]
changed_paths = "none"
writes = "none"
working_directory = ""
environment = {}
timeout = "600s"
output_limit = "4kb"
failure_severity = "error"
guarantees = [
  { kind = "syntax_validated", scope = { kind = "reach", reach = "project" }, detail = "cargo check and the architecture gate pass" },
]
determinism = "deterministic"
