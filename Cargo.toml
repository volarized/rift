[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.45"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
rift-analysis = { path = "crates/rift-analysis", default-features = false }
rift-cloud-client = { path = "crates/rift-cloud-client" }
rift-core = { path = "crates/rift-core" }
rift-dependency = { path = "crates/rift-dependency" }
rift-history = { path = "crates/rift-history" }
rift-index = { path = "crates/rift-index" }
rift-lsp = { path = "crates/rift-lsp" }
rift-mcp = { path = "crates/rift-mcp" }
rift-search = { path = "crates/rift-search" }
rift-protocol = { path = "crates/rift-protocol" }
rift-ranking = { path = "crates/rift-ranking" }
rift-provider = { path = "crates/rift-provider" }
rift-server = { path = "crates/rift-server" }
rift-syntax = { path = "crates/rift-syntax" }

anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
candle-transformers = { version = "0.11.0", default-features = false }
clap = { version = "4.6.5", features = ["derive"] }
data-encoding = "2.6.0"
getrandom = { version = "0.4.3", features = ["std"] }
flate2 = "1.1.9"
fs4 = "1.1.0"
gix = { version = "0.86.0", default-features = false, features = ["revision", "sha1"] }
globset = { version = "0.4.20", default-features = false }
http = "1.4"
ignore = { version = "0.4.23", default-features = false }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
lsp-types = "0.97.0"
mimalloc = { version = "=0.1.52", features = ["v2", "override"] }
nix = { version = "0.31.3", features = ["signal"] }
notify = "=8.2.0"
oas3-gen-support = "=0.28.0"
oas3 = "=0.22.0"
# The otlp feature's export stack. tracing-opentelemetry pins the opentelemetry minor it
# builds against (0.34.0 requires opentelemetry ^0.33.0), and opentelemetry_sdk /
# opentelemetry-otlp move in lockstep with opentelemetry itself, so every member is
# pinned exactly rather than left to drift independently.
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
    "trace",
] }
percent-encoding = "2.3.1"
rayon = "1.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
regex = "1.12.3"
rig-core = { version = "=0.42.0", default-features = false }
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
serde_path_to_error = "0.1.20"
serde_json_lenient = "0.2.4"
serde_with = "3.21"
strum = { version = "0.28.0", features = ["derive"] }
sha2 = "=0.11.0"
tar = "0.4.46"
toasty = { version = "=0.10.0", default-features = false, features = ["migration", "sqlite"] }
toasty-core = "=0.10.0"
toasty-driver-sqlite = "=0.10.0"
# candle-core has a non-optional `tokenizers 0.22` dependency with the `onig` backend on
# every non-wasm target, so the version is pinned to match it: a second tokenizers would
# be a duplicate the dependency policy refuses, and could not avoid onig either.
tokenizers = { version = "0.22.2", default-features = false }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "=2.5.8"
tree-sitter-rst = "=0.2.0"
validator = { version = "0.21", features = ["derive"] }
waitpid-any = "=0.3.0"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation"] }
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-md = { version = "=0.5.3", default-features = false }
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"
jsonschema = { version = "0.50.0", default-features = false }
tempfile = "3.27.0"
unicode-normalization = "0.1.24"
unicode-width = "0.2.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Embedded ty: git dependencies pinned to the ruff submodule sha of ty release
# 0.0.71. ty_project and ty_ide are unpublished, so git is the only route.
ty_project = { git = "https://github.com/astral-sh/ruff", rev = "2b0d21094e2a55491bff60c07fd6f8803876cae5" }
ty_ide = { git = "https://github.com/astral-sh/ruff", rev = "2b0d21094e2a55491bff60c07fd6f8803876cae5" }
ruff_db = { git = "https://github.com/astral-sh/ruff", rev = "2b0d21094e2a55491bff60c07fd6f8803876cae5", features = ["os"] }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "2b0d21094e2a55491bff60c07fd6f8803876cae5" }
ty_python_core = { git = "https://github.com/astral-sh/ruff", rev = "2b0d21094e2a55491bff60c07fd6f8803876cae5" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
clone_on_ref_ptr = "warn"
await_holding_lock = "deny"
large_futures = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"

[profile.test]
debug = "line-tables-only"

# Corpus tests serve large repositories with coverage instrumentation enabled.
[profile.corpus]
inherits = "release"
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# The product identity digests this executable at every server and proxy start
# (`rift-mcp/src/identity.rs`). A debug or instrumented test binary is over 130 MB,
# and sha2 at opt-level 0 needs about four seconds for it; optimized, well under one.
[profile.dev.package.sha2]
opt-level = 3

# gemm-common's `vmulq_f16` is an `#[inline]` fp16 `asm!` without a `target_feature`
# of its own: it assembles only once inlined into an fp16 caller. At opt-level 0 it is
# emitted alone, and aarch64 Linux and Windows reject it ("instruction requires:
# fullfp16"); Apple targets enable fp16 by default. The native checks build every
# workspace target in this profile on both.
[profile.dev.package.gemm-f16]
opt-level = 3
