[workspace]
resolver = "3"
members = ["crates/*", "protocol/rust"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
rift-core = { path = "crates/rift-core", version = "=0.0.1" }
rift-index = { path = "crates/rift-index", version = "=0.0.1" }
rift-mcp = { path = "crates/rift-mcp", version = "=0.0.1" }
rift-model = { path = "crates/rift-model", version = "=0.0.1" }
rift-protocol = { path = "protocol/rust", version = "=0.0.1" }
rift-provider = { path = "crates/rift-provider", version = "=0.0.1" }
rift-server = { path = "crates/rift-server", version = "=0.0.1" }
rift-syntax = { path = "crates/rift-syntax", version = "=0.0.1" }

clap = { version = "4.6.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
clone_on_ref_ptr = "warn"
await_holding_lock = "deny"
large_futures = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
