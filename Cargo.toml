[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
rift-core = { path = "crates/rift-core" }
rift-history = { path = "crates/rift-history" }
rift-index = { path = "crates/rift-index" }
rift-mcp = { path = "crates/rift-mcp" }
rift-model = { path = "crates/rift-model" }
rift-protocol = { path = "crates/rift-protocol" }
rift-provider = { path = "crates/rift-provider" }
rift-server = { path = "crates/rift-server" }
rift-syntax = { path = "crates/rift-syntax" }

clap = { version = "4.6.5", features = ["derive"] }
data-encoding = "2.6.0"
diffy = "0.5.1"
flate2 = "1.1.9"
fs4 = "1.1.0"
gix = { version = "0.86.0", default-features = false, features = ["revision", "sha1"] }
ignore = { version = "0.4.23", default-features = false }
percent-encoding = "2.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
rmcp = { version = "=3.1.3", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
sha2 = "=0.10.9"
tar = "0.4.46"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
jsonschema = { version = "0.50.0", default-features = false }
tempfile = "3.27.0"
unicode-normalization = "0.1.24"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
clone_on_ref_ptr = "warn"
await_holding_lock = "deny"
large_futures = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
